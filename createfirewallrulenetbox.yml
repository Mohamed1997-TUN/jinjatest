---
- name: Configure FortiGate Firewall Rule
  hosts: all
  gather_facts: false

  vars_files:
    - vars/firewallrule.vars

  tasks:

    # =========================================================
    # 1. Validate AWX input
    # =========================================================

    - name: Validate NetBox device ID
      ansible.builtin.assert:
        that:
          - netbox_device_id is defined
          - netbox_device_id | string | length > 0
        fail_msg: >
          netbox_device_id was not provided by the AWX workflow.
        success_msg: >
          NetBox device ID received: {{ netbox_device_id }}
      delegate_to: localhost
      run_once: true


    # =========================================================
    # 2. Get device information from NetBox
    #
    # At this point the first job has already updated the
    # management IP.
    # =========================================================

    - name: Get NetBox device information
      ansible.builtin.uri:
        url: "http://192.168.101.132:8000/api/dcim/devices/{{ netbox_device_id }}/"
        method: GET
        headers:
          Authorization: "Bearer iS1ny9JSpLUazDMkp0g3dcYHK2zPutpbEkigl0oY"
          Accept: "application/json"
        validate_certs: false
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: netbox_device
      run_once: true
      no_log: true


    # =========================================================
    # 3. Validate NetBox information
    # =========================================================

    - name: Validate NetBox device
      ansible.builtin.assert:
        that:
          - netbox_device.json.id is defined
          - netbox_device.json.serial is defined
          - netbox_device.json.primary_ip4 is defined
          - netbox_device.json.primary_ip4.address is defined
        fail_msg: >
          NetBox device {{ netbox_device_id }} does not contain
          a serial number or primary IP address.
      delegate_to: localhost
      run_once: true


    # =========================================================
    # 4. Extract the CURRENT management IP
    #
    # This should now be the NEW IP configured by the first job.
    # =========================================================

    - name: Set current FortiGate management IP
      ansible.builtin.set_fact:
        target_management_ip: >-
          {{ netbox_device.json.primary_ip4.address.split('/')[0] }}


    # =========================================================
    # 5. Identify the correct inventory host
    # =========================================================

    - name: Determine target FortiGate
      ansible.builtin.set_fact:
        is_target_firewall: >-
          {{
            (ansible_host | default(inventory_hostname))
            == target_management_ip
          }}


    # =========================================================
    # 6. Display targeting information
    # =========================================================

    - name: Display firewall rule target
      ansible.builtin.debug:
        msg:
          - "NetBox Device ID : {{ netbox_device_id }}"
          - "Serial           : {{ netbox_device.json.serial }}"
          - "Target IP        : {{ target_management_ip }}"
          - "Inventory Host   : {{ inventory_hostname }}"
          - "Ansible Host     : {{ ansible_host | default(inventory_hostname) }}"
          - "Target           : {{ is_target_firewall }}"


    # =========================================================
    # 7. Wait for the new management IP
    #
    # Extra safety check before pushing firewall rules.
    # =========================================================

    - name: Verify target FortiGate SSH
      ansible.builtin.wait_for:
        host: "{{ target_management_ip }}"
        port: 22
        state: started
        delay: 2
        timeout: 60
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 8. Render firewall rule configuration
    # =========================================================

    - name: Render firewall rule configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/template/firewallrule.j2"
        dest: /tmp/fortigate_config.txt
        mode: "0600"
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 9. Read generated configuration
    # =========================================================

    - name: Read generated configuration
      ansible.builtin.slurp:
        src: /tmp/fortigate_config.txt
      register: slurped_config
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 10. Display generated configuration
    # =========================================================

    - name: Display generated firewall rule configuration
      ansible.builtin.debug:
        msg: "{{ slurped_config.content | b64decode }}"
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 11. Check whether configuration is allowed
    # =========================================================

    - name: Check firewall rule policy
      ansible.builtin.assert:
        that:
          - "'❌ Not allowed' not in (slurped_config.content | b64decode)"
          - slurped_config.content | b64decode | length > 0
        fail_msg: >
          Firewall rule configuration was blocked by the policy
          validation in firewallrule.j2.
      when: is_target_firewall


    # =========================================================
    # 12. Push firewall rule ONLY to target FortiGate
    # =========================================================

    - name: Push firewall rule configuration
      ansible.builtin.raw: "{{ slurped_config.content | b64decode }}"
      register: result
      when: is_target_firewall


    # =========================================================
    # 13. Display FortiGate result
    # =========================================================

    - name: Display firewall rule result
      ansible.builtin.debug:
        var: result.stdout
      when:
        - is_target_firewall
        - result is defined


    # =========================================================
    # 14. Final success
    # =========================================================

    - name: Display success
      ansible.builtin.debug:
        msg: >
          ✅ Firewall rule configuration successfully applied to
          FortiGate {{ target_management_ip }}.
      when:
        - is_target_firewall
        - result is defined
