---
- name: Inspect FortiManager VDOM Meta Field
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    target_adom: "root"
    target_device: "dhia-staline-automation"
    target_vdom: "root"

  tasks:

    - name: Authenticate to FortiManager
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        body_format: json
        body:
          id: 1
          method: "exec"
          params:
            - url: "/sys/login/user"
              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"
        validate_certs: false
        return_content: true
      register: login_response
      no_log: true

    - name: Save session
      ansible.builtin.set_fact:
        fortimanager_session: "{{ login_response.json.session }}"
      no_log: true

    - name: Get VDOM Meta Field values
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        body_format: json
        body:
          id: 2
          method: "get"
          session: "{{ fortimanager_session }}"
          verbose: 1
          params:
            - url: >-
                /dvmdb/adom/{{ target_adom }}/device/{{ target_device }}/vdom/{{ target_vdom }}
              option:
                - "get meta"
              fields:
                - "name"
                - "meta fields"
        validate_certs: false
        return_content: true
      register: vdom_meta_response
      no_log: true

    - name: Display complete VDOM Meta Field response
      ansible.builtin.debug:
        var: vdom_meta_response.json

    - name: Logout
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        body_format: json
        body:
          id: 3
          method: "exec"
          session: "{{ fortimanager_session }}"
          params:
            - url: "/sys/logout"
        validate_certs: false
        return_content: true
      no_log: true
