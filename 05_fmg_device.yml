---
- name: Step 4 - FortiManager Enforce Device Names
  hosts: localhost
  gather_facts: false

  # ============================================================
  # CENTRALIZED VARIABLES
  # ============================================================

  vars_files:
    - ../vars/secrets.yml
    - ../vars/fortimanager.vars
    - ../vars/firewalls.vars

  vars:
    fmg_validate_certs: false

    # Target ADOM
    adom: "dhia"

  tasks:

    # ============================================================
    # 1. LOGIN TO FORTIMANAGER
    # ============================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"
        headers:
          Content-Type: application/json
        body_format: json
        body:
          id: 1
          method: "exec"
          params:
            - url: "/sys/login/user"
              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"
        return_content: true
      register: fmg_login
      no_log: true


    # ============================================================
    # 2. VERIFY LOGIN
    # ============================================================

    - name: Verify FortiManager login
      ansible.builtin.assert:
        that:
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined
        fail_msg: "FortiManager authentication failed."
        success_msg: "FortiManager authentication successful."


    # ============================================================
    # 3. SAVE SESSION
    # ============================================================

    - name: Save FortiManager session
      ansible.builtin.set_fact:
        fmg_session: "{{ fmg_login.json.session }}"
      no_log: true


    # ============================================================
    # 4. GET DEVICES FROM TARGET ADOM
    # ============================================================

    - name: Get FortiGate devices from FortiManager
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"
        headers:
          Content-Type: application/json
        body_format: json
        body:
          id: 2
          method: "get"
          session: "{{ fmg_session }}"
          params:
            - url: "/dvmdb/adom/{{ adom }}/device"
        return_content: true
      register: fmg_devices
      no_log: true


    # ============================================================
    # 5. VERIFY DEVICE DISCOVERY
    # ============================================================

    - name: Verify device discovery
      ansible.builtin.assert:
        that:
          - fmg_devices.json.result is defined
          - fmg_devices.json.result | length > 0
          - fmg_devices.json.result[0].status.code | int == 0
          - fmg_devices.json.result[0].data is defined
        fail_msg: >-
          FortiManager device discovery failed for ADOM {{ adom }}.
        success_msg: >-
          FortiManager devices successfully discovered
          from ADOM {{ adom }}.


    # ============================================================
    # 6. SAVE MANAGED DEVICES
    # ============================================================

    - name: Save managed devices
      ansible.builtin.set_fact:
        managed_devices: "{{ fmg_devices.json.result[0].data }}"


    # ============================================================
    # 7. INITIALIZE LISTS
    # ============================================================

    - name: Initialize summary lists
      ansible.builtin.set_fact:
        existing_firewalls: []
        synchronized_devices: []
        renamed_devices: []
        unchanged_devices: []
        skipped_devices: []


    # ============================================================
    # 8. BUILD DESIRED/CURRENT DEVICE MAPPING
    #
    # firewalls.vars remains centralized and contains:
    #
    #   serial
    #   hostname
    #   management_ip
    #   management_mask
    #   api_token
    #
    # api_token is NOT used by Step 4.
    # It remains available for other automation steps.
    #
    # If a device is not found:
    #
    #   current_device = {}
    #
    # If a device is found:
    #
    #   current_device = FortiManager device object
    # ============================================================

    - name: Build desired/current device mapping
      ansible.builtin.set_fact:
        existing_firewalls: "{{ existing_firewalls + [firewall_entry] }}"

      vars:

        matching_devices: >-
          {{
            managed_devices
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', item.serial)
            | list
          }}

        firewall_entry:
          serial: "{{ item.serial }}"
          desired_name: "{{ item.hostname }}"
          management_ip: "{{ item.management_ip }}"
          management_mask: "{{ item.management_mask }}"

          current_device: >-
            {{
              matching_devices[0]
              if matching_devices | length > 0
              else {}
            }}

      loop: "{{ firewalls }}"

      loop_control:
        label: "{{ item.serial }}"


    # ============================================================
    # 9. DISPLAY CURRENT STATE
    # ============================================================

    - name: Display firewall state
      ansible.builtin.debug:
        msg:
          serial: "{{ item.serial }}"

          desired_name: "{{ item.desired_name }}"

          desired_ip: "{{ item.management_ip }}"

          current_name: >-
            {{
              item.current_device.get('name', 'NOT FOUND')
            }}

          current_ip: >-
            {{
              item.current_device.get('ip', 'NOT FOUND')
            }}

          status: >-
            {{
              "FOUND"
              if (item.current_device | length) > 0
              else "NOT FOUND - SKIP"
            }}

      loop: "{{ existing_firewalls }}"

      loop_control:
        label: "{{ item.serial }}"


    # ============================================================
    # 10. RECORD MISSING DEVICES
    #
    # Missing devices are NOT failures.
    # ============================================================

    - name: Record missing devices
      ansible.builtin.set_fact:
        skipped_devices: >-
          {{
            skipped_devices
            +
            [
              item.serial
              ~ " -> "
              ~ item.desired_name
            ]
          }}

      loop: "{{ existing_firewalls }}"

      loop_control:
        label: "{{ item.serial }}"

      when:
        - (item.current_device | length) == 0


    # ============================================================
    # 11. RECORD ALREADY CORRECT DEVICES
    # ============================================================

    - name: Record devices with correct names
      ansible.builtin.set_fact:
        unchanged_devices: >-
          {{
            unchanged_devices
            +
            [
              item.serial
              ~ " -> "
              ~ item.desired_name
            ]
          }}

      loop: "{{ existing_firewalls }}"

      loop_control:
        label: "{{ item.serial }}"

      when:
        - (item.current_device | length) > 0
        - item.current_device.get('name') == item.desired_name


    # ============================================================
    # 12. RENAME DEVICES
    #
    # Only existing devices with a different name are renamed.
    # ============================================================

    - name: Enforce desired FortiManager device names
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"
        headers:
          Content-Type: application/json
        body_format: json

        body:
          id: 10
          method: "update"
          session: "{{ fmg_session }}"

          params:
            - url: >-
                /dvmdb/adom/{{ adom }}/device/{{
                  item.current_device.get('name')
                }}

              data:
                name: "{{ item.desired_name }}"

        return_content: true

      register: rename_results

      no_log: true

      loop: "{{ existing_firewalls }}"

      loop_control:
        label: "{{ item.serial }}"

      when:
        - (item.current_device | length) > 0
        - item.current_device.get('name') != item.desired_name


    # ============================================================
    # 13. VERIFY RENAME OPERATIONS
    # ============================================================

    - name: Verify rename operations
      ansible.builtin.assert:
        that:
          - item.json.result is defined
          - item.json.result | length > 0
          - item.json.result[0].status.code | int == 0

        fail_msg: >-
          Device rename failed for {{ item.item.serial }}.

          Old name:
          {{ item.item.current_device.get('name', 'N/A') }}

          New name:
          {{ item.item.desired_name }}

          Response:
          {{ item.json | default('N/A') }}

        success_msg: >-
          Device {{ item.item.serial }} renamed successfully:
          {{ item.item.current_device.get('name', 'N/A') }}
          ->
          {{ item.item.desired_name }}

      loop: "{{ rename_results.results | default([]) }}"

      loop_control:
        label: "{{ item.item.serial }}"

      when:
        - not (item.skipped | default(false))


    # ============================================================
    # 14. BUILD RENAMED SUMMARY
    # ============================================================

    - name: Build renamed devices summary
      ansible.builtin.set_fact:
        renamed_devices: >-
          {{
            renamed_devices
            +
            [
              item.item.serial
              ~ " : "
              ~ item.item.current_device.get('name', 'N/A')
              ~ " -> "
              ~ item.item.desired_name
            ]
          }}

      loop: "{{ rename_results.results | default([]) }}"

      loop_control:
        label: "{{ item.item.serial }}"

      when:
        - not (item.skipped | default(false))


    # ============================================================
    # 15. REFRESH DEVICE LIST
    # ============================================================

    - name: Refresh FortiManager devices
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"
        headers:
          Content-Type: application/json
        body_format: json

        body:
          id: 11
          method: "get"
          session: "{{ fmg_session }}"

          params:
            - url: "/dvmdb/adom/{{ adom }}/device"

        return_content: true

      register: refreshed_devices

      no_log: true


    # ============================================================
    # 16. VERIFY REFRESH
    # ============================================================

    - name: Verify refreshed device discovery
      ansible.builtin.assert:
        that:
          - refreshed_devices.json.result is defined
          - refreshed_devices.json.result | length > 0
          - refreshed_devices.json.result[0].status.code | int == 0
          - refreshed_devices.json.result[0].data is defined

        fail_msg:
          "Unable to refresh FortiManager device list."

        success_msg:
          "FortiManager device list refreshed successfully."


    # ============================================================
    # 17. FINAL VERIFICATION
    #
    # Existing devices are verified.
    # Missing devices remain skipped.
    # ============================================================

    - name: Verify final device state
      ansible.builtin.assert:

        that:
          - final_device is not none
          - final_device.get('name') == item.desired_name
          - final_device.get('sn') == item.serial
          - final_device.get('ip') == item.management_ip

        fail_msg: >-
          Final verification failed for {{ item.serial }}.

          Expected:

            Name = {{ item.desired_name }}
            IP   = {{ item.management_ip }}

          Actual:

            Name = {{ final_device.get('name', 'N/A') }}
            IP   = {{ final_device.get('ip', 'N/A') }}

        success_msg: >-
          {{ item.serial }} synchronized successfully:
          {{ final_device.get('name') }} /
          {{ final_device.get('ip') }}

      vars:

        matching_final_devices: >-
          {{
            refreshed_devices.json.result[0].data
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', item.serial)
            | list
          }}

        final_device: >-
          {{
            matching_final_devices[0]
            if matching_final_devices | length > 0
            else {}
          }}

      loop: "{{ existing_firewalls }}"

      loop_control:
        label: "{{ item.serial }}"

      when:
        - (item.current_device | length) > 0


    # ============================================================
    # 18. BUILD SYNCHRONIZED SUMMARY
    # ============================================================

    - name: Build synchronized devices summary
      ansible.builtin.set_fact:
        synchronized_devices: >-
          {{
            synchronized_devices
            +
            [
              item.serial
              ~ " -> "
              ~ item.desired_name
            ]
          }}

      loop: "{{ existing_firewalls }}"

      loop_control:
        label: "{{ item.serial }}"

      when:
        - (item.current_device | length) > 0


    # ============================================================
    # 19. FINAL SUMMARY
    # ============================================================

    - name: Display Step 4 summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "STEP 4 - FORTIMANAGER DEVICE NAME MANAGEMENT"
          - "=================================================="
          - "ADOM                    : {{ adom }}"
          - "Total desired firewalls : {{ firewalls | length }}"
          - "Found / synchronized    : {{ synchronized_devices | length }}"
          - "Renamed                 : {{ renamed_devices | length }}"
          - "Already correct         : {{ unchanged_devices | length }}"
          - "Skipped / not found     : {{ skipped_devices | length }}"
          - "=================================================="


    # ============================================================
    # 20. SHOW SYNCHRONIZED DEVICES
    # ============================================================

    - name: Display synchronized devices
      ansible.builtin.debug:
        msg: "{{ synchronized_devices }}"

      when:
        - synchronized_devices | length > 0


    # ============================================================
    # 21. SHOW RENAMED DEVICES
    # ============================================================

    - name: Display renamed devices
      ansible.builtin.debug:
        msg: "{{ renamed_devices }}"

      when:
        - renamed_devices | length > 0


    # ============================================================
    # 22. SHOW UNCHANGED DEVICES
    # ============================================================

    - name: Display unchanged devices
      ansible.builtin.debug:
        msg: "{{ unchanged_devices }}"

      when:
        - unchanged_devices | length > 0


    # ============================================================
    # 23. SHOW SKIPPED DEVICES
    # ============================================================

    - name: Display skipped devices
      ansible.builtin.debug:
        msg: "{{ skipped_devices }}"

      when:
        - skipped_devices | length > 0


    # ============================================================
    # 24. LOGOUT
    # ============================================================

    - name: Logout from FortiManager
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"
        headers:
          Content-Type: application/json
        body_format: json

        body:
          id: 3
          method: "exec"
          session: "{{ fmg_session }}"

          params:
            - url: "/sys/logout"

        return_content: true

      no_log: true