---
# ============================================================
# STEP 7 - VERIFY FORTIMANAGER POLICY PACKAGE INSTALLATION
# ============================================================
#
# Source of truth:
#   NetBox asset_tag -> vars/firewalls.vars
#
# Responsibilities:
#   1. Identify the firewall from NetBox asset_tag.
#   2. Verify that the FortiGate exists in the target ADOM.
#   3. Verify the FortiGate serial number.
#   4. Verify FortiManager connection/configuration state.
#   5. Verify that the expected policy package exists.
#   6. Verify that the FortiGate is an installation target of
#      the expected policy package.
#
# Notes:
#   - No ADOM is hard-coded.
#   - No VDOM verification is performed.
#   - The VDOM is not used to validate package scope because
#     the FortiManager API in this environment returns scope
#     members with the device name only.
#   - Installation itself is performed by Step 6.
#   - This step verifies the resulting FortiManager state.
# ============================================================

- name: Step 7 - Verify FortiManager Policy Package Installation
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

  tasks:
    - block:

        # ========================================================
        # 1. LOAD FIREWALL DATABASE WITHOUT EVALUATING ALL ENTRIES
        # ========================================================

        - name: Load firewall database
          ansible.builtin.set_fact:
            firewall_data: >-
              {{
                lookup(
                  'ansible.builtin.file',
                  playbook_dir + '/vars/firewalls.vars'
                )
                | from_yaml
              }}

        # ========================================================
        # 2. SELECT FIREWALL USING NETBOX ASSET TAG
        # ========================================================

        - name: Select firewall from NetBox asset_tag
          ansible.builtin.set_fact:
            selected_firewall: >-
              {{
                firewall_data.firewalls
                | selectattr('serial', 'equalto', hostvars[inventory_hostname].asset_tag | default(''))
                | list
                | first
                | default({}, true)
              }}

        - name: Skip host when asset_tag is not defined
          ansible.builtin.debug:
            msg: >-
              Skipping host '{{ inventory_hostname }}': NetBox asset_tag is not defined.
          when: hostvars[inventory_hostname].asset_tag is not defined

        - name: Stop processing host when asset_tag is not defined
          ansible.builtin.meta: end_host
          when: hostvars[inventory_hostname].asset_tag is not defined

        - name: Skip firewall not present in firewalls.vars
          ansible.builtin.debug:
            msg: >-
              Skipping '{{ inventory_hostname }}': NetBox asset_tag
              '{{ hostvars[inventory_hostname].asset_tag }}' is not present in vars/firewalls.vars.
          when: selected_firewall | length == 0

        - name: Stop processing firewall not present in firewalls.vars
          ansible.builtin.meta: end_host
          when: selected_firewall | length == 0

        # ========================================================
        # 3. VALIDATE REQUIRED DATA
        # ========================================================

        - name: Validate selected firewall data
          ansible.builtin.assert:
            that:
              - selected_firewall.serial is defined
              - selected_firewall.serial | string | length > 0
              - selected_firewall.hostname is defined
              - selected_firewall.hostname | string | length > 0
              - selected_firewall.target_adom is defined
              - selected_firewall.target_adom | string | length > 0
              - selected_firewall.policy_package is defined
              - selected_firewall.policy_package | string | length > 0
            fail_msg: >-
              Invalid firewall definition for asset_tag
              '{{ hostvars[inventory_hostname].asset_tag }}'.
              Required fields: serial, hostname, target_adom, policy_package.
            success_msg: >-
              Firewall definition validated for '{{ selected_firewall.hostname }}'.

        - name: Save verification parameters
          ansible.builtin.set_fact:
            device_serial: "{{ selected_firewall.serial }}"
            desired_hostname: "{{ selected_firewall.hostname }}"
            target_adom: "{{ selected_firewall.target_adom }}"
            policy_package: "{{ selected_firewall.policy_package }}"

        # ========================================================
        # 4. NORMALIZE SERIAL FOR COMPARISON
        # ========================================================

        - name: Normalize device serial
          ansible.builtin.set_fact:
            normalized_device_serial: >-
              {{
                device_serial
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              }}

        # ========================================================
        # 5. LOGIN TO FORTIMANAGER
        # ========================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            body:
              id: 1
              method: "exec"
              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"
              session: null
              verbose: 1
            return_content: true
          register: fmg_login
          failed_when: >-
            fmg_login.status != 200
            or (
              fmg_login.json.result[0].status.code
              | default(-1)
              | int
            ) != 0
            or fmg_login.json.session is not defined
            or fmg_login.json.session | string | length == 0
          no_log: true

        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"

        # ========================================================
        # 6. QUERY TARGET ADOM DEVICES
        # ========================================================

        - name: Get FortiGate devices from target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            body:
              id: 2
              method: "get"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
              session: "{{ fmg_session }}"
              verbose: 1
            return_content: true
          register: managed_devices_response
          failed_when: >-
            managed_devices_response.status != 200
            or (
              managed_devices_response.json.result[0].status.code
              | default(-1)
              | int
            ) != 0

        - name: Save managed devices
          ansible.builtin.set_fact:
            managed_devices: >-
              {{
                managed_devices_response.json.result[0].data
                | default([])
              }}

        # ========================================================
        # 7. FIND DEVICE BY NORMALIZED SERIAL
        # ========================================================

        - name: Build normalized device matches
          ansible.builtin.set_fact:
            normalized_device_matches: >-
              {%- set matches = [] -%}
              {%- for device in managed_devices -%}
                {%- if (
                  device.sn
                  | default('')
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial -%}
                  {%- set _ = matches.append(device) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ matches }}

        - name: Verify target FortiGate exists in target ADOM
          ansible.builtin.assert:
            that:
              - normalized_device_matches | length == 1
            fail_msg: >-
              FortiGate verification failed.
              Expected serial={{ device_serial }}
              (normalized={{ normalized_device_serial }}),
              ADOM={{ target_adom }},
              matches={{ normalized_device_matches | length }}.
            success_msg: >-
              FortiGate '{{ desired_hostname }}' found in ADOM '{{ target_adom }}'.

        - name: Save target FortiGate data
          ansible.builtin.set_fact:
            target_device: "{{ normalized_device_matches[0] }}"
            fmg_device_name: "{{ normalized_device_matches[0].name }}"
            fmg_device_serial: "{{ normalized_device_matches[0].sn }}"
            fmg_conn_status: "{{ normalized_device_matches[0].conn_status | default('unknown') }}"
            fmg_conf_status: "{{ normalized_device_matches[0].conf_status | default('unknown') }}"
            fmg_db_status: "{{ normalized_device_matches[0].db_status | default('unknown') }}"

        # ========================================================
        # 8. VERIFY DEVICE IDENTITY AND STATE
        # ========================================================

        - name: Display FortiManager device verification
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "DEVICE VERIFICATION"
              - "=============================================="
              - "Expected hostname : {{ desired_hostname }}"
              - "FMG device name   : {{ fmg_device_name }}"
              - "Expected serial   : {{ device_serial }}"
              - "FMG serial        : {{ fmg_device_serial }}"
              - "ADOM              : {{ target_adom }}"
              - "Connection status : {{ fmg_conn_status }}"
              - "Configuration     : {{ fmg_conf_status }}"
              - "Database status   : {{ fmg_db_status }}"
              - "=============================================="

        - name: Verify FortiGate identity
          ansible.builtin.assert:
            that:
              - fmg_device_name == desired_hostname
              - >-
                (
                  fmg_device_serial
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
            fail_msg: >-
              FortiGate identity verification FAILED.
              Expected name={{ desired_hostname }},
              actual name={{ fmg_device_name }},
              expected serial={{ device_serial }},
              actual serial={{ fmg_device_serial }}.
            success_msg: >-
              FortiGate identity verified: {{ fmg_device_name }} / {{ fmg_device_serial }}.

        - name: Verify FortiManager connection and configuration state
          ansible.builtin.assert:
            that:
              - fmg_conn_status | lower == 'up'
              - fmg_conf_status | lower == 'insync'
            fail_msg: >-
              FortiManager state verification FAILED for '{{ fmg_device_name }}'.
              Connection={{ fmg_conn_status }},
              Configuration={{ fmg_conf_status }},
              Database={{ fmg_db_status }}.
            success_msg: >-
              FortiManager state is healthy for '{{ fmg_device_name }}'.
              Connection={{ fmg_conn_status }},
              Configuration={{ fmg_conf_status }}.

        # ========================================================
        # 9. GET EXPECTED POLICY PACKAGE
        # ========================================================

        - name: Get expected policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            body:
              id: 3
              method: "get"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
              session: "{{ fmg_session }}"
              verbose: 1
            return_content: true
          register: policy_package_response
          failed_when: >-
            policy_package_response.status != 200
            or (
              policy_package_response.json.result[0].status.code
              | default(-1)
              | int
            ) != 0

        - name: Save policy package data
          ansible.builtin.set_fact:
            policy_package_data: >-
              {{
                policy_package_response.json.result[0].data
                | default({})
              }}

        # ========================================================
        # 10. VERIFY POLICY PACKAGE EXISTS
        # ========================================================

        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - policy_package_data | length > 0
              - policy_package_data.name | default('') == policy_package
            fail_msg: >-
              Policy package verification FAILED.
              Expected package={{ policy_package }},
              returned={{ policy_package_data.name | default('not found') }}.
            success_msg: >-
              Policy package '{{ policy_package }}' exists in ADOM '{{ target_adom }}'.

        # ========================================================
        # 11. VERIFY INSTALLATION TARGET
        # ========================================================
        #
        # FortiManager in this environment returns scope member
        # entries with the device name. Do not require a VDOM field.
        #

        - name: Check installation target in policy package
          ansible.builtin.set_fact:
            installation_target_matches: >-
              {%- set matches = [] -%}
              {%- for scope in policy_package_data['scope member'] | default([]) -%}
                {%- if scope.name | default('') == fmg_device_name -%}
                  {%- set _ = matches.append(scope) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ matches }}

        - name: Display policy package verification
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "POLICY PACKAGE VERIFICATION"
              - "=============================================="
              - "ADOM             : {{ target_adom }}"
              - "FortiGate         : {{ fmg_device_name }}"
              - "Serial            : {{ fmg_device_serial }}"
              - "Policy package    : {{ policy_package }}"
              - "Installation target matches : {{ installation_target_matches | length }}"
              - "=============================================="

        - name: Verify policy package installation target
          ansible.builtin.assert:
            that:
              - installation_target_matches | length >= 1
            fail_msg: >-
              Policy package installation target verification FAILED.
              Package={{ policy_package }},
              device={{ fmg_device_name }},
              ADOM={{ target_adom }}.
            success_msg: >-
              Policy package '{{ policy_package }}' is assigned to
              FortiGate '{{ fmg_device_name }}'.

        # ========================================================
        # 12. FINAL VERIFICATION SUMMARY
        # ========================================================

        - name: Display Step 7 final summary
          ansible.builtin.debug:
            msg:
              - ""
              - "============================================================"
              - "STEP 7 - INSTALLATION VERIFICATION"
              - "============================================================"
              - "FortiManager : {{ fortimanager_host }}"
              - "ADOM         : {{ target_adom }}"
              - "FortiGate    : {{ fmg_device_name }}"
              - "Serial       : {{ fmg_device_serial }}"
              - "Policy       : {{ policy_package }}"
              - ""
              - "Device identity          : PASSED"
              - "Serial verification      : PASSED"
              - "Connection verification  : PASSED"
              - "Configuration sync       : PASSED"
              - "Policy package            : PASSED"
              - "Installation target      : PASSED"
              - ""
              - "============================================================"
              - "STEP 7 STATUS: SUCCESS"
              - "============================================================"

        # ========================================================
        # 13. LOGOUT
        # ========================================================

      always:
        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            body:
              id: 99
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/sys/logout"
            return_content: true
          when: fmg_session is defined
          failed_when: false
          no_log: true
