---
- name: Provision FortiGate
  hosts: all
  gather_facts: false

  vars_files:
    - vars/firewalls.vars

  tasks:

    # =========================================================
    # 1. Validate AWX input
    # =========================================================

    - name: Validate NetBox device ID
      ansible.builtin.assert:
        that:
          - netbox_device_id is defined
          - netbox_device_id | string | length > 0
        fail_msg: >
          netbox_device_id was not provided.
          This playbook must be launched with a NetBox device ID.
        success_msg: >
          NetBox device ID received: {{ netbox_device_id }}
      delegate_to: localhost
      run_once: true


    # =========================================================
    # 2. Retrieve device information from NetBox
    #
    # ORB/Diode may create the device before the primary IP
    # synchronization is completed.
    #
    # Retry every 5 seconds for up to 120 seconds.
    # =========================================================

    - name: Get NetBox device information
      ansible.builtin.uri:
        url: "http://192.168.101.132:8000/api/dcim/devices/{{ netbox_device_id }}/"
        method: GET
        headers:
          Authorization: "Token iS1ny9JSpLUazDMkp0g3dcYHK2zPutpbEkigl0oY"
          Accept: "application/json"
        validate_certs: false
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: netbox_device
      run_once: true
      no_log: false
      until:
        - netbox_device.json.id is defined
        - netbox_device.json.serial is defined
        - netbox_device.json.primary_ip4 is not none
      retries: 30
      delay: 5


    # =========================================================
    # 3. Validate NetBox response
    # =========================================================

    - name: Validate NetBox device data
      ansible.builtin.assert:
        that:
          - netbox_device.json.id is defined
          - netbox_device.json.serial is defined
          - netbox_device.json.serial | string | length > 0
          - netbox_device.json.primary_ip4 is defined
          - netbox_device.json.primary_ip4 is not none
          - netbox_device.json.primary_ip4.address is defined
          - netbox_device.json.primary_ip4.address | string | length > 0
        fail_msg: >
          NetBox device {{ netbox_device_id }} did not provide
          the required serial number and primary IP address
          within the 120-second synchronization timeout.
      delegate_to: localhost
      run_once: true


    # =========================================================
    # 4. Extract serial number from NetBox
    # =========================================================

    - name: Set firewall serial
      ansible.builtin.set_fact:
        firewall_serial: "{{ netbox_device.json.serial }}"


    # =========================================================
    # 5. Extract CURRENT management IP from NetBox
    #
    # This is the IP currently used to reach the FortiGate.
    # =========================================================

    - name: Set current management IP
      ansible.builtin.set_fact:
        current_management_ip: >-
          {{ netbox_device.json.primary_ip4.address.split('/')[0] }}


    # =========================================================
    # 6. Find desired firewall configuration using SERIAL
    # =========================================================

    - name: Find firewall configuration
      ansible.builtin.set_fact:
        target_firewall: >-
          {{
            firewalls
            | selectattr('serial', 'equalto', firewall_serial)
            | list
            | first
          }}


    # =========================================================
    # 7. Validate firewall configuration
    # =========================================================

    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - target_firewall is defined
          - target_firewall is not none
          - target_firewall.serial is defined
          - target_firewall.hostname is defined
          - target_firewall.management_ip is defined
          - target_firewall.management_mask is defined
        fail_msg: >
          Firewall with serial {{ firewall_serial }}
          was not found or is incomplete in vars/firewalls.vars.


    # =========================================================
    # 8. Determine which inventory host is the target
    #
    # Example:
    #
    # NetBox current IP = 192.168.101.135
    #
    # 192.168.101.135 -> TARGET
    # 192.168.101.138 -> SKIP
    # =========================================================

    - name: Identify target FortiGate
      ansible.builtin.set_fact:
        is_target_firewall: >-
          {{
            (ansible_host | default(inventory_hostname))
            == current_management_ip
          }}


    # =========================================================
    # 9. Determine if management IP change is required
    #
    # SAME IP:
    #
    # Current = 192.168.101.135
    # Target  = 192.168.101.135
    #
    # -> No IP change required
    #
    # DIFFERENT IP:
    #
    # Current = 192.168.101.142
    # Target  = 192.168.101.136
    #
    # -> IP change required
    # =========================================================

    - name: Determine if management IP change is required
      ansible.builtin.set_fact:
        ip_change_required: >-
          {{
            current_management_ip != target_firewall.management_ip
          }}


    # =========================================================
    # 10. Display provisioning information
    # =========================================================

    - name: Display provisioning information
      ansible.builtin.debug:
        msg:
          - "Inventory Host        : {{ inventory_hostname }}"
          - "Ansible Host          : {{ ansible_host | default(inventory_hostname) }}"
          - "NetBox Device ID      : {{ netbox_device.json.id }}"
          - "Serial                : {{ firewall_serial }}"
          - "Current IP            : {{ current_management_ip }}"
          - "Desired Hostname      : {{ target_firewall.hostname }}"
          - "Desired Management IP : {{ target_firewall.management_ip }}"
          - "Desired Subnet Mask   : {{ target_firewall.management_mask }}"
          - "Target Firewall       : {{ is_target_firewall }}"
          - "IP Change Required    : {{ ip_change_required }}"


    # =========================================================
    # 11. Render provisioning configuration
    # =========================================================

    - name: Render FortiGate provisioning configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/template/firewall_provisioning.j2"
        dest: /tmp/firewall_provisioning.cfg
        mode: "0600"
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 12. Read generated configuration
    # =========================================================

    - name: Read generated configuration
      ansible.builtin.slurp:
        src: /tmp/firewall_provisioning.cfg
      register: generated_config_file
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 13. Display generated configuration
    #
    # Keep this during testing.
    # =========================================================

    - name: Display generated configuration
      ansible.builtin.debug:
        msg: "{{ generated_config_file.content | b64decode }}"
      delegate_to: localhost
      when: is_target_firewall


    # =========================================================
    # 14. Apply hostname + management IP
    # =========================================================

    - name: Apply FortiGate provisioning configuration
      ansible.builtin.raw: "{{ generated_config_file.content | b64decode }}"
      register: fortigate_result
      when: is_target_firewall


    # =========================================================
    # 15. Display configuration result
    # =========================================================

    - name: Display FortiGate configuration result
      ansible.builtin.debug:
        var: fortigate_result.stdout
      when: is_target_firewall


    # =========================================================
    # 16. Wait for FortiGate to apply the configuration
    # =========================================================

    - name: Wait for FortiGate configuration
      ansible.builtin.pause:
        seconds: 15
      when: is_target_firewall


    # =========================================================
    # 17. Wait for NEW management IP
    #
    # ONLY executed when the IP actually changed.
    # =========================================================

    - name: Wait for new management IP SSH
      ansible.builtin.wait_for:
        host: "{{ target_firewall.management_ip }}"
        port: 22
        state: started
        delay: 2
        timeout: 60
      delegate_to: localhost
      when:
        - is_target_firewall
        - ip_change_required


    # =========================================================
    # 18. Update Ansible connection address
    #
    # ONLY executed when the IP actually changed.
    # =========================================================

    - name: Update Ansible connection to new management IP
      ansible.builtin.set_fact:
        ansible_host: "{{ target_firewall.management_ip }}"
      when:
        - is_target_firewall
        - ip_change_required


    # =========================================================
    # 19. Reset existing SSH connection
    #
    # ONLY executed when the IP actually changed.
    # =========================================================

    - name: Reset SSH connection
      ansible.builtin.meta: reset_connection
      when:
        - is_target_firewall
        - ip_change_required


    # =========================================================
    # 20. Verify FortiGate
    #
    # If IP didn't change:
    #     -> verify using existing connection
    #
    # If IP changed:
    #     -> verify using the new IP
    # =========================================================

    - name: Verify FortiGate connectivity
      ansible.builtin.raw: "get system status"
      register: verification_result
      changed_when: false
      when: is_target_firewall


    # =========================================================
    # 21. Display verification
    # =========================================================

    - name: Display FortiGate verification
      ansible.builtin.debug:
        var: verification_result.stdout
      when: is_target_firewall


    # =========================================================
    # 22. Validate final connection
    #
    # If this fails, the AWX job becomes FAILED and the next
    # workflow node should NOT execute.
    # =========================================================

    - name: Validate FortiGate connectivity
      ansible.builtin.assert:
        that:
          - verification_result.rc == 0
          - verification_result.stdout is search('Version:')
        fail_msg: >
          FortiGate verification failed after provisioning.
          Current management IP: {{ current_management_ip }}
          Desired management IP: {{ target_firewall.management_ip }}
        success_msg: >
          FortiGate successfully provisioned and verified.
          Management IP: {{ target_firewall.management_ip }}
      when: is_target_firewall
