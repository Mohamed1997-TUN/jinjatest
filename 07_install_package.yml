---
# ============================================================
# STEP 06 - FORTIMANAGER POLICY PACKAGE INSTALLATION
# ============================================================
#
# Source of truth:
#   NetBox asset_tag
#       ->
#   vars/firewalls.vars
#
# This step performs ONLY the installation.
#
# Prerequisites:
#   - Step 04 authorized the FortiGate into target_adom.
#   - Step 04 assigned the FortiGate to policy_package.
#
# This playbook does NOT:
#   - authorize the FortiGate
#   - change the device name
#   - create the policy package
#   - modify Installation Targets
#   - discover/verify FortiGate VDOMs
#
# target_vdom is read from firewalls.vars and is used directly
# in the FortiManager installation scope.
#
# ============================================================

- name: Step 06 - FortiManager Policy Package Installation
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

    task_poll_interval: 5
    task_max_attempts: 60

    package_verify_retries: 5
    package_verify_delay: 3

  tasks:

    # ==========================================================
    # 1. READ FIREWALL DATABASE
    # ==========================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ==========================================================
    # 2. SELECT CURRENT FIREWALL FROM NETBOX ASSET TAG
    # ==========================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action            : SKIPPED"
          - "============================================================"
      when:
        - selected_firewall | length == 0


    - name: End unknown firewall host
      ansible.builtin.meta: end_host
      when:
        - selected_firewall | length == 0


    # ==========================================================
    # 3. VALIDATE INSTALLATION DATA
    # ==========================================================

    - name: Validate installation parameters
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | length > 0
          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | length > 0
        fail_msg: >-
          Firewall '{{ asset_tag }}' is missing one or more required
          installation fields in firewalls.vars.

          Required:
            serial
            hostname
            target_adom
            target_vdom
            policy_package


    - name: Save installation parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        desired_hostname: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    - name: Display installation target
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "STEP 06 - INSTALLATION TARGET"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag }}"
          - "Serial           : {{ device_serial }}"
          - "FortiGate        : {{ desired_hostname }}"
          - "Target ADOM      : {{ target_adom }}"
          - "Target VDOM      : {{ target_vdom }}"
          - "Policy Package   : {{ policy_package }}"
          - "============================================================"


    # ==========================================================
    # 4. FORTIMANAGER WORKFLOW
    # ==========================================================

    - name: Execute FortiManager policy package installation
      block:

        # ======================================================
        # 4.1 LOGIN
        # ======================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 1
              method: "exec"
              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"
            return_content: true
          register: fmg_login
          no_log: true


        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.status | int == 200
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined
              - fmg_login.json.session | string | length > 0
            fail_msg: "FortiManager authentication failed."
            success_msg: "FortiManager authentication successful."


        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"
          no_log: true


        # ======================================================
        # 4.2 FIND DEVICE IN TARGET ADOM
        # ======================================================
        #
        # No VDOM API verification.
        # We only verify that the authorized FortiGate exists in
        # the configured target ADOM.
        # ======================================================

        - name: Get devices from target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: target_adom_devices
          no_log: true


        - name: Verify target ADOM query
          ansible.builtin.assert:
            that:
              - target_adom_devices.status | int == 200
              - target_adom_devices.json.result is defined
              - target_adom_devices.json.result | length > 0
              - target_adom_devices.json.result[0].status.code | int == 0
            fail_msg: >-
              Unable to retrieve devices from target ADOM
              '{{ target_adom }}'.


        - name: Find FortiGate in target ADOM
          ansible.builtin.set_fact:
            target_device: "{{ item }}"
          loop: >-
            {{
              target_adom_devices.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Verify FortiGate is authorized in target ADOM
          ansible.builtin.assert:
            that:
              - target_device is defined
              - target_device | length > 0
            fail_msg: >-
              FortiGate '{{ device_serial }}' was not found in
              ADOM '{{ target_adom }}'.

              Run Step 04 before running Step 06.


        - name: Save FortiManager device name
          ansible.builtin.set_fact:
            fmg_device_name: "{{ target_device.name }}"


        - name: Display authorized FortiGate
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "AUTHORIZED FORTIGATE"
              - "============================================================"
              - "Serial       : {{ device_serial }}"
              - "FMG Name     : {{ fmg_device_name }}"
              - "Target ADOM  : {{ target_adom }}"
              - "Target VDOM  : {{ target_vdom }}"
              - "============================================================"


        # ======================================================
        # 4.3 GET POLICY PACKAGE
        # ======================================================

        - name: Get policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: policy_package_response
          no_log: true


        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - policy_package_response.status | int == 200
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name == policy_package
            fail_msg: >-
              Policy package '{{ policy_package }}' was not found
              in ADOM '{{ target_adom }}'.

              Run the policy package management step before installation.


        - name: Save policy package data
          ansible.builtin.set_fact:
            package_data: "{{ policy_package_response.json.result[0].data }}"


        # ======================================================
        # 4.4 VERIFY INSTALLATION TARGET
        # ======================================================
        #
        # Step 04 owns Installation Target configuration.
        # Step 06 only verifies it before installing.
        #
        # FortiManager may return only:
        #   {"name": "dhia-staline"}
        #
        # Therefore verification is based on the device name,
        # not on a VDOM field returned by the package API.
        # ======================================================

        - name: Check Installation Target
          ansible.builtin.set_fact:
            installation_target_exists: >-
              {{
                (
                  package_data['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('name', 'equalto', fmg_device_name)
                  | list
                  | length
                ) >= 1
              }}


        - name: Verify Installation Target exists
          ansible.builtin.assert:
            that:
              - installation_target_exists
            fail_msg: >-
              FortiGate '{{ fmg_device_name }}' is not assigned as an
              Installation Target of policy package '{{ policy_package }}'
              in ADOM '{{ target_adom }}'.

              Run Step 04 first.
            success_msg: >-
              Installation Target confirmed:
              '{{ fmg_device_name }}' -> '{{ policy_package }}'.


        - name: Display package installation target
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "PACKAGE READY FOR INSTALLATION"
              - "============================================================"
              - "ADOM            : {{ target_adom }}"
              - "Policy Package  : {{ policy_package }}"
              - "FortiGate       : {{ fmg_device_name }}"
              - "VDOM            : {{ target_vdom }}"
              - "Installation Target: CONFIRMED"
              - "============================================================"


        # ======================================================
        # 4.5 START INSTALLATION
        # ======================================================

        - name: Start FortiManager policy package installation
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/securityconsole/install/package"
                  data:
                    adom: "{{ target_adom }}"
                    pkg: "{{ policy_package }}"
                    scope:
                      - name: "{{ fmg_device_name }}"
                        vdom: "{{ target_vdom }}"
                    flags:
                      - "none"
            return_content: true
          register: install_request
          no_log: true


        - name: Verify installation request accepted
          ansible.builtin.assert:
            that:
              - install_request.status | int == 200
              - install_request.json.result is defined
              - install_request.json.result | length > 0
              - install_request.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager rejected installation of
              '{{ policy_package }}' to '{{ fmg_device_name }}'.

              Code:
              {{
                install_request.json.result[0].status.code
                | default('unknown')
              }}

              Message:
              {{
                install_request.json.result[0].status.message
                | default('unknown')
              }}


        - name: Extract installation task ID
          ansible.builtin.set_fact:
            installation_task_id: >-
              {{
                install_request.json.result[0].data.task
                | default(
                    (
                      install_request.json.result[0].data[0].task
                      if (
                        install_request.json.result[0].data is sequence
                        and install_request.json.result[0].data | length > 0
                        and install_request.json.result[0].data[0].task is defined
                      )
                      else ''
                    )
                  )
              }}


        - name: Verify installation task ID
          ansible.builtin.assert:
            that:
              - installation_task_id is defined
              - installation_task_id | string | length > 0
            fail_msg: >-
              FortiManager accepted the installation request but did not
              return an installation task ID.

              Device: {{ fmg_device_name }}
              Package: {{ policy_package }}


        - name: Display installation task
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "INSTALLATION STARTED"
              - "============================================================"
              - "FortiGate       : {{ fmg_device_name }}"
              - "Policy Package  : {{ policy_package }}"
              - "VDOM            : {{ target_vdom }}"
              - "Task ID         : {{ installation_task_id }}"
              - "============================================================"


        # ======================================================
        # 4.6 POLL INSTALLATION TASK
        # ======================================================

        - name: Poll FortiManager installation task
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/task/task/{{ installation_task_id }}"
            return_content: true
          register: installation_task
          retries: "{{ task_max_attempts }}"
          delay: "{{ task_poll_interval }}"
          until:
            - installation_task.json.result is defined
            - installation_task.json.result | length > 0
            - installation_task.json.result[0].status.code | default(-1) | int == 0
            - installation_task.json.result[0].data is defined
            - installation_task.json.result[0].data.percent | default(0) | int >= 100
          no_log: true


        # ======================================================
        # 4.7 VERIFY INSTALLATION RESULT
        # ======================================================

        - name: Verify final installation result
          ansible.builtin.assert:
            that:
              - installation_task.json.result[0].data.percent | int >= 100
              - installation_task.json.result[0].data.num_err | default(0) | int == 0
              - >-
                (
                  installation_task.json.result[0].data.state | string == '4'
                  or
                  installation_task.json.result[0].data.state | string | lower == 'done'
                )
            fail_msg: >-
              Policy package installation FAILED.

              FortiGate:
              {{ fmg_device_name }}

              Package:
              {{ policy_package }}

              Task ID:
              {{ installation_task_id }}

              Progress:
              {{ installation_task.json.result[0].data.percent | default(0) }}%

              State:
              {{ installation_task.json.result[0].data.state | default('unknown') }}

              Errors:
              {{ installation_task.json.result[0].data.num_err | default(0) }}

              Warnings:
              {{ installation_task.json.result[0].data.num_warn | default(0) }}

              Detail:
              {{ installation_task.json.result[0].data.detail | default('') }}

            success_msg: >-
              Policy package '{{ policy_package }}' was successfully
              installed on '{{ fmg_device_name }}/{{ target_vdom }}'.


        - name: Display installation result
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "STEP 06 - INSTALLATION COMPLETED"
              - "============================================================"
              - "FortiGate       : {{ fmg_device_name }}"
              - "Serial          : {{ device_serial }}"
              - "ADOM            : {{ target_adom }}"
              - "VDOM            : {{ target_vdom }}"
              - "Policy Package  : {{ policy_package }}"
              - "Task ID         : {{ installation_task_id }}"
              - "Progress        : {{ installation_task.json.result[0].data.percent }}%"
              - "Errors          : {{ installation_task.json.result[0].data.num_err | default(0) }}"
              - "State           : {{ installation_task.json.result[0].data.state | default('unknown') }}"
              - "============================================================"


      # ========================================================
      # 5. ALWAYS LOGOUT
      # ========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 99
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/sys/logout"
            return_content: true
          when:
            - fmg_session is defined
          failed_when: false
          no_log: true
