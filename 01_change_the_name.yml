---
- name: Configure FortiGate hostname
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    # =========================================================
    # 1. Get firewall information from firewalls.vars
    # =========================================================

    - name: Find firewall configuration
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}

    # =========================================================
    # 2. Validate firewall
    # =========================================================

    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - selected_firewall | length > 0
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
        fail_msg: >-
          No valid firewall configuration found for serial
          {{ asset_tag | default('UNDEFINED') }}

    # =========================================================
    # 3. Display selected configuration
    # =========================================================

    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "NetBox serial        : {{ asset_tag }}"
          - "Configured serial    : {{ selected_firewall.serial }}"
          - "Management IP        : {{ selected_firewall.management_ip }}"
          - "New hostname         : {{ selected_firewall.hostname }}"

    # =========================================================
    # 4. Verify SSH port
    # =========================================================

    - name: Verify SSH connectivity
      ansible.builtin.wait_for:
        host: "{{ selected_firewall.management_ip }}"
        port: "{{ ssh_port }}"
        state: started
        timeout: 10

    # =========================================================
    # 5. Change hostname
    # =========================================================

    - name: Change FortiGate hostname
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ selected_firewall.management_ip }}

        responses:

          # First SSH connection
          '(?i)are you sure you want to continue connecting':
            - "yes"

          # SSH password
          '(?i)password:':
            - "{{ fortigate_password }}"

          # Normal FortiGate CLI prompt
          '(?m)[>#]\s*$':
            - "config system global"

          # Global configuration prompt
          '(?m)\(global\)\s*[>#]\s*$':
            - "set hostname {{ selected_firewall.hostname }}"
            - "end"

          # Back to normal CLI prompt
          '(?m)[>#]\s*$':
            - "exit"

        timeout: 20
        echo: false

      register: hostname_change

    # =========================================================
    # 6. Show result
    # =========================================================

    - name: Display hostname change result
      ansible.builtin.debug:
        msg:
          - "Hostname change completed."
          - "Serial        : {{ selected_firewall.serial }}"
          - "Hostname      : {{ selected_firewall.hostname }}"
          - "Management IP : {{ selected_firewall.management_ip }}"
          - "Return code   : {{ hostname_change.rc | default('N/A') }}"
