---
- name: Debug NetBox serial matching
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  tasks:

    - name: Display NetBox inventory values
      ansible.builtin.debug:
        msg:
          - "Inventory hostname : {{ inventory_hostname }}"
          - "ansible_host       : {{ ansible_host | default('UNDEFINED') }}"
          - "asset_tag          : {{ asset_tag | default('UNDEFINED') }}"

    - name: Display firewalls.vars serials
      ansible.builtin.debug:
        msg: "{{ firewalls | map(attribute='serial') | list }}"

    - name: Find matching firewall
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
          }}

    - name: Display matching result
      ansible.builtin.debug:
        msg:
          - "NetBox asset_tag: {{ asset_tag | default('UNDEFINED') }}"
          - "Matching entries: {{ selected_firewall }}"

    - name: Validate exactly one firewall was found
      ansible.builtin.assert:
        that:
          - selected_firewall | length == 1
        fail_msg: >-
          No unique firewall match found.
          NetBox asset_tag={{ asset_tag | default('UNDEFINED') }}.
          firewalls.vars serials={{ firewalls | map(attribute='serial') | list }}
