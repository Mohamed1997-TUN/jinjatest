---
- name: Diagnose FortiGate hostname SSH session
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    - name: Display target
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Serial: {{ asset_tag | default('N/A') }}"

    - name: Test FortiGate SSH session
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ ansible_host }}

        responses:

          '(?i)are you sure you want to continue connecting':
            - "yes"

          '(?i)password:':
            - "{{ fortigate_password }}"

          '(?i)[#>$]\s*$':
            - "get system status"
            - "exit"

        timeout: 30
        echo: false

      register: ssh_test
      failed_when: false
      no_log: true

    - name: Show SSH diagnostic safely
      ansible.builtin.debug:
        msg:
          - "rc: {{ ssh_test.rc | default('N/A') }}"
          - "changed: {{ ssh_test.changed | default(false) }}"
          - "failed: {{ ssh_test.failed | default(false) }}"
          - "msg: {{ ssh_test.msg | default('') }}"
          - "stdout: {{ ssh_test.stdout | default('') }}"
          - "stderr: {{ ssh_test.stderr | default('') }}"
