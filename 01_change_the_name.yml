---
- name: Configure FortiGate hostname
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    - name: Find firewall configuration using NetBox serial
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr('serial', 'equalto', asset_tag)
            | list
            | first
          }}

    - name: Validate firewall was found
      ansible.builtin.assert:
        that:
          - selected_firewall is defined
          - selected_firewall is not none
        fail_msg: >-
          No firewall was found in firewalls.vars with serial
          {{ asset_tag }}

    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "NetBox serial      : {{ asset_tag }}"
          - "Configured hostname: {{ selected_firewall.hostname }}"
          - "Management IP      : {{ selected_firewall.management_ip }}"

    - name: Configure FortiGate hostname
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ selected_firewall.management_ip }}

        responses:

          '(?i)are you sure you want to continue connecting':
            - "yes"

          '(?i)password:':
            - "{{ fortigate_password }}"

          '[#>$]\s*$':
            - "config system global"
            - "set hostname {{ selected_firewall.hostname }}"
            - "end"
            - "get system status"
            - "exit"

        timeout: 30
        echo: false

      register: hostname_change
      no_log: true

    - name: Confirm hostname configuration
      ansible.builtin.debug:
        msg:
          - "Hostname configured successfully."
          - "Serial    : {{ asset_tag }}"
          - "Hostname  : {{ selected_firewall.hostname }}"
          - "Management: {{ selected_firewall.management_ip }}"
