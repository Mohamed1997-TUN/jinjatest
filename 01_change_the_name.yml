---
- name: Configure FortiGate hostname
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    # ---------------------------------------------------------
    # 1. Find the firewall in firewalls.vars using NetBox serial
    #    (asset_tag). default(None, true) prevents a Jinja
    #    "sequence was empty" error when nothing matches, so
    #    the skip/assert below can handle it cleanly instead.
    # ---------------------------------------------------------
    - name: Find firewall configuration
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr('serial', 'equalto', asset_tag | default(''))
            | list
            | first
            | default(None, true)
          }}

    # ---------------------------------------------------------
    # 2. Skip hosts NetBox returned that aren't in firewalls.vars
    #    (routine, since hosts: all pulls in non-firewall devices
    #    too) rather than failing the whole run on them.
    # ---------------------------------------------------------
    - name: Skip hosts not found in firewalls.vars
      ansible.builtin.meta: end_host
      when: selected_firewall is none

    # ---------------------------------------------------------
    # 3. Validate the match (catches a malformed entry in
    #    firewalls.vars for a serial that DID match)
    # ---------------------------------------------------------
    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
        fail_msg: >-
          Firewall entry for serial {{ asset_tag | default('UNDEFINED') }}
          is missing required fields in firewalls.vars

    # ---------------------------------------------------------
    # 4. Display what we are going to configure
    # ---------------------------------------------------------
    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "NetBox serial         : {{ asset_tag }}"
          - "Firewall serial        : {{ selected_firewall.serial }}"
          - "Current inventory IP   : {{ ansible_host | default('N/A') }}"
          - "SSH management IP      : {{ selected_firewall.management_ip }}"
          - "New hostname           : {{ selected_firewall.hostname }}"

    # ---------------------------------------------------------
    # 5. Change FortiGate hostname
    # ---------------------------------------------------------
    - name: Change FortiGate hostname
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ selected_firewall.management_ip }}

        responses:

          '(?i)are you sure you want to continue connecting':
            - "yes"

          '(?i)password:':
            - "{{ fortigate_password }}"

          'FortiGate.*[#>$]\s*$':
            - "config system global"
            - "set hostname {{ selected_firewall.hostname }}"
            - "end"
            - "get system status"
            - "exit"

        timeout: 30
        echo: false

      register: hostname_change
      no_log: true

    # ---------------------------------------------------------
    # 6. Report success
    # ---------------------------------------------------------
    - name: Confirm hostname configuration
      ansible.builtin.debug:
        msg:
          - "FortiGate hostname configured successfully."
          - "Serial        : {{ selected_firewall.serial }}"
          - "Hostname      : {{ selected_firewall.hostname }}"
          - "Management IP : {{ selected_firewall.management_ip }}"
