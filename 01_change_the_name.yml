---
- name: Configure FortiGate hostname
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    # ---------------------------------------------------------
    # 1. Find the firewall in firewalls.vars using NetBox serial
    # ---------------------------------------------------------
    - name: Find firewall configuration
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
          }}

    # ---------------------------------------------------------
    # 2. Validate the match
    # ---------------------------------------------------------
    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - selected_firewall is defined
          - selected_firewall is not none
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
        fail_msg: >-
          No valid firewall configuration found in firewalls.vars
          for NetBox serial {{ asset_tag | default('UNDEFINED') }}

    # ---------------------------------------------------------
    # 3. Display what we are going to configure
    # ---------------------------------------------------------
    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "NetBox serial       : {{ asset_tag }}"
          - "Firewall serial     : {{ selected_firewall.serial }}"
          - "Current inventory IP : {{ ansible_host | default('N/A') }}"
          - "SSH management IP   : {{ selected_firewall.management_ip }}"
          - "New hostname        : {{ selected_firewall.hostname }}"

    # ---------------------------------------------------------
    # 4. Change FortiGate hostname
    # ---------------------------------------------------------
    - name: Change FortiGate hostname
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ selected_firewall.management_ip }}

        responses:

          '(?i)are you sure you want to continue connecting':
            - "yes"

          '(?i)password:':
            - "{{ fortigate_password }}"

          'FortiGate.*[#>$]\s*$':
            - "config system global"
            - "set hostname {{ selected_firewall.hostname }}"
            - "end"
            - "get system status"
            - "exit"

        timeout: 30
        echo: false

      register: hostname_change
      no_log: true

    # ---------------------------------------------------------
    # 5. Report success
    # ---------------------------------------------------------
    - name: Confirm hostname configuration
      ansible.builtin.debug:
        msg:
          - "FortiGate hostname configured successfully."
          - "Serial       : {{ selected_firewall.serial }}"
          - "Hostname     : {{ selected_firewall.hostname }}"
          - "Management IP: {{ selected_firewall.management_ip }}"
