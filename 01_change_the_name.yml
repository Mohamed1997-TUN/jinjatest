---
- name: Configure FortiGate hostname from NetBox
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10

  tasks:

    - name: Display target FortiGate
      ansible.builtin.debug:
        msg:
          - "FortiGate hostname : {{ inventory_hostname }}"
          - "Management IP      : {{ ansible_host }}"
          - "Serial             : {{ asset_tag | default('N/A') }}"

    - name: Configure FortiGate hostname
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ ansible_host }}

        responses:

          '(?i)are you sure you want to continue connecting':
            - "yes"

          '(?i)password:':
            - "{{ fortigate_password }}"

          '[#>$]\s*$':
            - "config system global"
            - "set hostname {{ inventory_hostname }}"
            - "end"
            - "get system status"
            - "exit"

        timeout: 30
        echo: false

      register: hostname_change
      no_log: true

    - name: Confirm hostname command completed
      ansible.builtin.debug:
        msg:
          - "Hostname configuration completed"
          - "FortiGate: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Serial: {{ asset_tag | default('N/A') }}"
