---
- name: Configure FortiGate hostname
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    # =========================================================
    # 1. Display information received from NetBox
    # =========================================================

    - name: Display NetBox firewall information
      ansible.builtin.debug:
        msg:
          - "NetBox hostname : {{ inventory_hostname }}"
          - "NetBox IP       : {{ ansible_host | default('UNDEFINED') }}"
          - "NetBox serial    : {{ asset_tag | default('UNDEFINED') }}"

    # =========================================================
    # 2. Find the firewall in firewalls.vars
    # =========================================================

    - name: Find firewall configuration using NetBox serial
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}

    # =========================================================
    # 3. Validate that the firewall was found
    # =========================================================

    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - selected_firewall | length > 0
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
        fail_msg: >-
          No valid firewall configuration was found in
          firewalls.vars for NetBox serial
          {{ asset_tag | default('UNDEFINED') }}

    # =========================================================
    # 4. Display the selected configuration
    # =========================================================

    - name: Display selected firewall configuration
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Selected FortiGate"
          - "=========================================="
          - "NetBox serial       : {{ asset_tag }}"
          - "firewalls.vars serial: {{ selected_firewall.serial }}"
          - "SSH management IP   : {{ selected_firewall.management_ip }}"
          - "New hostname        : {{ selected_firewall.hostname }}"
          - "=========================================="

    # =========================================================
    # 5. Test TCP connectivity to SSH port
    # =========================================================

    - name: Test SSH port connectivity
      ansible.builtin.wait_for:
        host: "{{ selected_firewall.management_ip }}"
        port: "{{ ssh_port }}"
        timeout: 10
        state: started

    # =========================================================
    # 6. Connect to FortiGate and change hostname
    # =========================================================

    - name: Change FortiGate hostname
      ansible.builtin.expect:

        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ selected_firewall.management_ip }}

        responses:

          # SSH first connection confirmation
          '(?i)are you sure you want to continue connecting':
            - "yes"

          # FortiGate password prompt
          '(?i)password:':
            - "{{ fortigate_password }}"

          # FortiGate CLI prompt
          '[#>$]\s*$':
            - "config system global"
            - "set hostname {{ selected_firewall.hostname }}"
            - "end"
            - "get system status"
            - "exit"

        timeout: 30
        echo: false

      register: hostname_change

    # =========================================================
    # 7. Display expect result
    # =========================================================

    - name: Display hostname change result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "SSH / EXPECT RESULT"
          - "=========================================="
          - "Return code : {{ hostname_change.rc | default('N/A') }}"
          - "Changed     : {{ hostname_change.changed | default(false) }}"
          - "Failed      : {{ hostname_change.failed | default(false) }}"
          - "Message     : {{ hostname_change.msg | default('N/A') }}"
          - "Stdout      : {{ hostname_change.stdout | default('N/A') }}"
          - "Stderr      : {{ hostname_change.stderr | default('N/A') }}"
          - "=========================================="

    # =========================================================
    # 8. Confirm successful execution
    # =========================================================

    - name: Confirm hostname configuration
      ansible.builtin.assert:
        that:
          - hostname_change.failed | default(false) == false
        fail_msg: >-
          The SSH/expect operation failed while configuring
          hostname {{ selected_firewall.hostname }}
          on {{ selected_firewall.management_ip }}.

        success_msg: >-
          FortiGate hostname {{ selected_firewall.hostname }}
          was configured successfully.
