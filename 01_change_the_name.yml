---
- name: Configure FortiGate hostname from firewalls.vars
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml
    - vars/firewalls.vars
    - vars/fortigate.vars

  vars:
    ssh_port: 22

    ssh_options: >-
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no

  tasks:

    # =========================================================
    # 1. NetBox provides ONLY the serial number
    # =========================================================

    - name: Display NetBox serial
      ansible.builtin.debug:
        msg:
          - "NetBox asset_tag (serial): {{ asset_tag | default('UNDEFINED') }}"

    # =========================================================
    # 2. Find the firewall in firewalls.vars
    # =========================================================

    - name: Find firewall configuration in firewalls.vars
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}

    # =========================================================
    # 3. Validate the serial match
    # =========================================================

    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - selected_firewall | length > 0
          - selected_firewall.serial is defined
          - selected_firewall.management_ip is defined
          - selected_firewall.hostname is defined

        fail_msg: >-
          Serial {{ asset_tag | default('UNDEFINED') }}
          was not found in firewalls.vars, or the matching
          firewall is missing hostname/management_ip.

    # =========================================================
    # 4. Display the configuration obtained from firewalls.vars
    # =========================================================

    - name: Display selected firewall configuration
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Firewall configuration"
          - "=========================================="
          - "NetBox serial        : {{ asset_tag }}"
          - "Matched serial       : {{ selected_firewall.serial }}"
          - "Management IP        : {{ selected_firewall.management_ip }}"
          - "Target hostname      : {{ selected_firewall.hostname }}"
          - "=========================================="

    # =========================================================
    # 5. Verify SSH connectivity using IP from firewalls.vars
    # =========================================================

    - name: Verify SSH connectivity
      ansible.builtin.wait_for:
        host: "{{ selected_firewall.management_ip }}"
        port: "{{ ssh_port }}"
        state: started
        timeout: 10

    # =========================================================
    # 6. Connect to FortiGate and change hostname
    # =========================================================

    - name: Change FortiGate hostname
      ansible.builtin.expect:
        command: >-
          ssh {{ ssh_options }}
          -p {{ ssh_port }}
          {{ fortigate_user }}@{{ selected_firewall.management_ip }}

        responses:

          # ---------------------------------------------------
          # SSH host-key confirmation
          # ---------------------------------------------------
          '(?i)are you sure you want to continue connecting':
            - "yes"

          # ---------------------------------------------------
          # SSH password
          # ---------------------------------------------------
          '(?i)password:':
            - "{{ fortigate_password }}"

          # ---------------------------------------------------
          # FortiGate CLI prompt
          # ---------------------------------------------------
          '(?m)[#>$]\s*$':
            - "config system global"
            - "set hostname {{ selected_firewall.hostname }}"
            - "end"
            - "exit"

        timeout: 20
        echo: false

      register: hostname_change

    # =========================================================
    # 7. Display operation result
    # =========================================================

    - name: Display hostname change result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Hostname configuration completed"
          - "=========================================="
          - "Serial        : {{ selected_firewall.serial }}"
          - "Management IP : {{ selected_firewall.management_ip }}"
          - "Hostname      : {{ selected_firewall.hostname }}"
          - "Return code   : {{ hostname_change.rc | default('N/A') }}"
          - "Changed       : {{ hostname_change.changed | default(false) }}"
          - "=========================================="
