---
# ============================================================
# STEP 04 - FortiManager Authorization + Installation Target
# ============================================================
#
# Source of truth:
#   NetBox asset_tag
#       ↓
#   vars/firewalls.vars
#
# Responsibilities:
#   1. Select firewall from firewalls.vars using NetBox asset_tag
#   2. Validate required variables
#   3. Login to FortiManager
#   4. Check whether device is already managed in target ADOM
#   5. If not managed:
#        - Find unauthorized device globally by SERIAL
#        - Normalize serial only for comparison
#        - Authorize/promote it
#        - Wait for task completion
#   6. Refresh the managed device information
#   7. Verify FMG device metadata
#   8. Verify policy package exists
#   9. Add device as Installation Target if missing
#  10. Verify Installation Target
#  11. Logout
#
# IMPORTANT:
#   - Do NOT use vars_files for firewalls.vars
#   - FortiManager serial may contain "_"
#       Example:
#         NetBox/firewalls.vars : FGVMEVP1E5VM0ED
#         FortiManager          : FGVMEVP1_E5VM0ED
#   - Serial is normalized ONLY for comparison.
#   - Do NOT modify the real serial value.
#   - Installation Target API uses:
#         name
#         vdom
#   - No independent VDOM verification is performed.
# ============================================================

- name: STEP 04 - FortiManager authorization and Installation Target
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:

    # --------------------------------------------------------
    # FortiManager API
    # --------------------------------------------------------
    fmg_jsonrpc_url: "https://{{ fortimanager_host }}/jsonrpc"

    # --------------------------------------------------------
    # Read firewalls.vars as RAW YAML.
    #
    # We intentionally DO NOT use:
    #
    # vars_files:
    #   - vars/firewalls.vars
    #
    # because unrelated Jinja/vault variables in that file
    # would otherwise be evaluated before we select our device.
    # --------------------------------------------------------
    firewall_data: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir + '/vars/firewalls.vars'
        )
        | from_yaml
      }}

    # Supports both:
    #
    # firewalls:
    #   - ...
    #
    # and a direct list.
    firewall_records: >-
      {{
        firewall_data.firewalls
        | default(firewall_data)
      }}

    # --------------------------------------------------------
    # NetBox is the source of the serial.
    # --------------------------------------------------------
    netbox_asset_tag: >-
      {{
        hostvars[inventory_hostname]['asset_tag']
        | default('')
        | string
        | trim
      }}

  tasks:

    # ========================================================
    # 1. BASIC INPUT VALIDATION
    # ========================================================

    - name: Display NetBox asset_tag
      ansible.builtin.debug:
        msg:
          - "STEP 04"
          - "NetBox inventory host : {{ inventory_hostname }}"
          - "NetBox asset_tag      : {{ netbox_asset_tag }}"

    - name: Fail if NetBox asset_tag is missing
      ansible.builtin.assert:
        that:
          - netbox_asset_tag | length > 0
        fail_msg: >-
          NetBox asset_tag is empty for inventory host
          '{{ inventory_hostname }}'.
          The asset_tag must contain the FortiGate serial.

    # ========================================================
    # 2. SELECT FIREWALL FROM firewalls.vars
    # ========================================================

    - name: Select firewall definition using NetBox asset_tag
      ansible.builtin.set_fact:
        selected_firewalls: >-
          {{
            firewall_records
            | selectattr('serial', 'defined')
            | selectattr(
                'serial',
                'equalto',
                netbox_asset_tag
              )
            | list
          }}

    - name: Verify exactly one firewall definition was selected
      ansible.builtin.assert:
        that:
          - selected_firewalls | length == 1
        fail_msg: >-
          Expected exactly one firewall definition in
          vars/firewalls.vars for NetBox asset_tag
          '{{ netbox_asset_tag }}',
          but found {{ selected_firewalls | length }}.

    - name: Set selected firewall
      ansible.builtin.set_fact:
        selected_firewall: "{{ selected_firewalls[0] }}"

    # ========================================================
    # 3. REQUIRED FIREWALL VARIABLES
    # ========================================================

    - name: Validate selected firewall definition
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | length > 0

          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | length > 0

          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | length > 0

          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | length > 0

          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | length > 0

          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | length > 0

        fail_msg: >-
          The firewall definition for serial
          '{{ selected_firewall.serial }}'
          is missing one or more required attributes:
          hostname, management_ip, target_adom,
          target_vdom or policy_package.

    # ========================================================
    # 4. NORMALIZE SERIAL ONLY FOR COMPARISON
    # ========================================================
    #
    # Example:
    #
    # firewalls.vars:
    #   FGVMEVP1E5VM0ED
    #
    # FortiManager:
    #   FGVMEVP1_E5VM0ED
    #
    # Both become:
    #   FGVMEVP1E5VM0ED
    #
    # The original values are NEVER modified.
    # ========================================================

    - name: Normalize target serial for comparison
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            selected_firewall.serial
            | string
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}

    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "Selected firewall"
          - "Serial          : {{ selected_firewall.serial }}"
          - "Normalized      : {{ normalized_device_serial }}"
          - "Hostname        : {{ selected_firewall.hostname }}"
          - "Management IP   : {{ selected_firewall.management_ip }}"
          - "Target ADOM     : {{ selected_firewall.target_adom }}"
          - "Target VDOM     : {{ selected_firewall.target_vdom }}"
          - "Policy Package  : {{ selected_firewall.policy_package }}"

    # ========================================================
    # 5. LOGIN TO FORTIMANAGER
    # ========================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "{{ fmg_jsonrpc_url }}"
        method: POST
        validate_certs: false
        return_content: true
        body_format: json
        body:
          id: 1
          method: exec
          params:
            - url: "/sys/login/user"
              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"
          verbose: 1
        status_code: 200
      register: fmg_login
      no_log: true

    - name: Validate FortiManager login
      ansible.builtin.assert:
        that:
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.result[0].data.session is defined
        fail_msg: >-
          FortiManager login failed.

    - name: Save FortiManager session
      ansible.builtin.set_fact:
        fmg_session: "{{ fmg_login.json.result[0].data.session }}"

    - name: Display login success
      ansible.builtin.debug:
        msg: "FortiManager login successful."

    # ========================================================
    # Everything after login is inside a block so that the
    # logout task always executes.
    # ========================================================

    - name: Execute Step 04 operations
      block:

        # ====================================================
        # 6. GET TARGET ADOM DEVICES
        # ====================================================

        - name: Get managed devices from target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 10
              method: get
              params:
                - url: "/dvmdb/adom/{{ selected_firewall.target_adom }}/device"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: target_adom_devices

        - name: Validate target ADOM API response
          ansible.builtin.assert:
            that:
              - target_adom_devices.json.result is defined
              - target_adom_devices.json.result | length > 0
              - target_adom_devices.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve devices from ADOM
              '{{ selected_firewall.target_adom }}'.

        - name: Build target ADOM device list
          ansible.builtin.set_fact:
            target_adom_device_list: >-
              {{
                target_adom_devices.json.result[0].data
                | default([])
              }}

        # ====================================================
        # 7. FIND DEVICE IN TARGET ADOM BY NORMALIZED SERIAL
        # ====================================================

        - name: Find target device in target ADOM
          ansible.builtin.set_fact:
            target_adom_matches: >-
              {{
                target_adom_device_list
                | selectattr('sn', 'defined')
                | selectattr(
                    'sn',
                    'match',
                    '.*'
                  )
                | list
                | selectattr(
                    'sn',
                    'defined'
                  )
                | list
              }}

        - name: Filter target ADOM device using normalized serial
          ansible.builtin.set_fact:
            authorized_devices: >-
              {{
                target_adom_matches
                | selectattr(
                    'sn',
                    'defined'
                  )
                | select(
                    'extract',
                    hostvars,
                    inventory_hostname
                  )
                | list
              }}
          when: false

        # ----------------------------------------------------
        # Jinja selectattr cannot directly perform our regex
        # normalization reliably in all Ansible versions.
        #
        # Build normalized serials explicitly.
        # ----------------------------------------------------

        - name: Initialize target ADOM serial matches
          ansible.builtin.set_fact:
            target_adom_serial_matches: []

        - name: Build normalized serial list from target ADOM
          ansible.builtin.set_fact:
            target_adom_serial_matches: >-
              {{
                target_adom_serial_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    ==
                    normalized_device_serial
                  )
                  else
                  []
                )
              }}
          loop: "{{ target_adom_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Verify target ADOM serial uniqueness
          ansible.builtin.assert:
            that:
              - target_adom_serial_matches | length <= 1
            fail_msg: >-
              Multiple devices in ADOM
              '{{ selected_firewall.target_adom }}'
              match serial '{{ selected_firewall.serial }}'.
              FortiManager data is ambiguous; refusing to continue.

        - name: Set authorization state
          ansible.builtin.set_fact:
            device_already_authorized: >-
              {{
                target_adom_serial_matches | length == 1
              }}

        # ====================================================
        # 8. IF ALREADY AUTHORIZED
        # ====================================================

        - name: Set already authorized device
          ansible.builtin.set_fact:
            authorized_device: "{{ target_adom_serial_matches[0] }}"
          when: device_already_authorized

        - name: Display already authorized device
          ansible.builtin.debug:
            msg:
              - "Device is already authorized."
              - "FMG name : {{ authorized_device.name }}"
              - "Serial   : {{ authorized_device.sn }}"
              - "IP       : {{ authorized_device.ip | default('unknown') }}"
              - "Platform : {{ authorized_device.platform_str | default('unknown') }}"
              - "OID      : {{ authorized_device.oid | default('unknown') }}"
          when: device_already_authorized

        # ====================================================
        # 9. IF NOT AUTHORIZED:
        #    SEARCH GLOBAL DEVICE DATABASE BY SERIAL
        # ====================================================

        - name: Get global FortiManager device database
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 20
              method: get
              params:
                - url: "/dvmdb/device"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: global_devices
          when: not device_already_authorized

        - name: Validate global device API response
          ansible.builtin.assert:
            that:
              - global_devices.json.result is defined
              - global_devices.json.result | length > 0
              - global_devices.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve the global device database.
          when: not device_already_authorized

        - name: Build global device list
          ansible.builtin.set_fact:
            global_device_list: >-
              {{
                global_devices.json.result[0].data
                | default([])
              }}
          when: not device_already_authorized

        # ====================================================
        # 10. FIND UNAUTHORIZED DEVICE BY SERIAL
        #
        # IMPORTANT:
        # Do NOT depend on mgmt_mode == "unreg".
        #
        # We already observed that FMG can expose:
        #
        #   mgmt_mode: 0
        #
        # while the device is visible under Unauthorized Devices.
        #
        # Therefore serial is the authoritative matching key.
        # ====================================================

        - name: Initialize global serial matches
          ansible.builtin.set_fact:
            global_serial_matches: []
          when: not device_already_authorized

        - name: Find global device using normalized serial
          ansible.builtin.set_fact:
            global_serial_matches: >-
              {{
                global_serial_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    ==
                    normalized_device_serial
                  )
                  else
                  []
                )
              }}
          loop: "{{ global_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: not device_already_authorized

        - name: Verify global serial uniqueness
          ansible.builtin.assert:
            that:
              - global_serial_matches | length == 1
            fail_msg: >-
              Expected exactly one FortiManager device matching serial
              '{{ selected_firewall.serial }}',
              but found {{ global_serial_matches | length }}.

              The device may not be connected to FortiManager,
              may have an unexpected serial, or may not be present
              in the Unauthorized Devices database.
          when: not device_already_authorized

        - name: Set unauthorized device
          ansible.builtin.set_fact:
            unauthorized_device: "{{ global_serial_matches[0] }}"
          when: not device_already_authorized

        - name: Display unauthorized device selected for authorization
          ansible.builtin.debug:
            msg:
              - "Unauthorized device found."
              - "FMG name : {{ unauthorized_device.name }}"
              - "Serial   : {{ unauthorized_device.sn }}"
              - "IP       : {{ unauthorized_device.ip | default('unknown') }}"
              - "Platform : {{ unauthorized_device.platform_str | default('unknown') }}"
              - "OID      : {{ unauthorized_device.oid | default('unknown') }}"
          when: not device_already_authorized

        # ====================================================
        # 11. AUTHORIZE / PROMOTE
        # ====================================================
        #
        # FortiManager requires the DEVICE NAME here, not the
        # serial number.
        #
        # This is why we first locate the device by serial and
        # then use unauthorized_device.name.
        # ====================================================

        - name: Authorize FortiGate in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 30
              method: exec
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ selected_firewall.target_adom }}"
                    device:
                      name: "{{ unauthorized_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: authorization_response
          when: not device_already_authorized

        - name: Validate authorization response
          ansible.builtin.assert:
            that:
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - >-
                (
                  authorization_response.json.result[0].data.task
                  is defined
                )
                or
                (
                  authorization_response.json.result[0].data.taskid
                  is defined
                )
            fail_msg: >-
              FortiManager authorization request failed.
          when: not device_already_authorized

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.task
                | default(
                    authorization_response.json.result[0].data.taskid
                  )
              }}
          when: not device_already_authorized

        - name: Display authorization task
          ansible.builtin.debug:
            msg: >-
              Authorization task ID:
              {{ authorization_task_id }}
          when: not device_already_authorized

        # ====================================================
        # 12. MONITOR AUTHORIZATION TASK
        # ====================================================

        - name: Wait for authorization task to complete
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 31
              method: get
              params:
                - url: "/task/task/{{ authorization_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: authorization_task_status
          until:
            - authorization_task_status.json.result is defined
            - authorization_task_status.json.result | length > 0
            - authorization_task_status.json.result[0].status.code | int == 0
            - >-
              (
                authorization_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: 36
          delay: 5
          when: not device_already_authorized

        - name: Validate authorization task result
          ansible.builtin.assert:
            that:
              - authorization_task_status.json.result[0].data.num_err | default(0) | int == 0
              - >-
                authorization_task_status.json.result[0].data.percent
                | default(0)
                | int >= 100
          fail_msg: >-
            FortiManager authorization task completed with errors.

            Task:
            {{ authorization_task_status.json.result[0].data | to_nice_json }}
          when: not device_already_authorized

        - name: Display authorization success
          ansible.builtin.debug:
            msg: "FortiGate authorization completed successfully."
          when: not device_already_authorized

        # ====================================================
        # 13. WAIT UNTIL DEVICE APPEARS IN TARGET ADOM
        # ====================================================

        - name: Wait for device to appear in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 40
              method: get
              params:
                - url: "/dvmdb/adom/{{ selected_firewall.target_adom }}/device"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: target_adom_devices_after_authorization
          until:
            - target_adom_devices_after_authorization.json.result is defined
            - target_adom_devices_after_authorization.json.result | length > 0
            - target_adom_devices_after_authorization.json.result[0].status.code | int == 0
            - >-
              (
                target_adom_devices_after_authorization.json.result[0].data
                | default([])
                | selectattr('sn', 'defined')
                | list
                | length
              ) > 0
          retries: 12
          delay: 5
          when: not device_already_authorized

        # ====================================================
        # 14. REFRESH DEVICE INFORMATION
        # ====================================================
        #
        # THIS IS THE IMPORTANT ADDITION.
        #
        # It reproduces the FortiManager "Refresh Device"
        # operation and allows FMG to update its device metadata
        # from the FortiGate.
        #
        # This should help ensure IP/platform information is
        # populated before we create the Installation Target.
        # ====================================================

        - name: Get current managed device from target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 50
              method: get
              params:
                - url: "/dvmdb/adom/{{ selected_firewall.target_adom }}/device"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: refreshed_adom_devices

        - name: Build refreshed ADOM device list
          ansible.builtin.set_fact:
            refreshed_adom_device_list: >-
              {{
                refreshed_adom_devices.json.result[0].data
                | default([])
              }}

        - name: Initialize refreshed device matches
          ansible.builtin.set_fact:
            refreshed_device_matches: []

        - name: Find refreshed device by normalized serial
          ansible.builtin.set_fact:
            refreshed_device_matches: >-
              {{
                refreshed_device_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    ==
                    normalized_device_serial
                  )
                  else
                  []
                )
              }}
          loop: "{{ refreshed_adom_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Verify exactly one managed device exists
          ansible.builtin.assert:
            that:
              - refreshed_device_matches | length == 1
            fail_msg: >-
              After authorization, FortiManager does not contain exactly
              one managed device matching serial
              '{{ selected_firewall.serial }}'.

              Matches found:
              {{ refreshed_device_matches | to_nice_json }}

        - name: Set managed device
          ansible.builtin.set_fact:
            authorized_device: "{{ refreshed_device_matches[0] }}"

        - name: Display managed device before refresh
          ansible.builtin.debug:
            msg:
              - "Managed device found."
              - "Name     : {{ authorized_device.name }}"
              - "Serial   : {{ authorized_device.sn }}"
              - "IP       : {{ authorized_device.ip | default('unknown') }}"
              - "Platform : {{ authorized_device.platform_str | default('unknown') }}"
              - "OID      : {{ authorized_device.oid | default('unknown') }}"

        # ====================================================
        # 15. REFRESH DEVICE
        # ====================================================

        - name: Refresh managed FortiGate information
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 60
              method: exec
              params:
                - url: "/dvm/cmd/update/device"
                  data:
                    adom: "{{ selected_firewall.target_adom }}"
                    device: "{{ authorized_device.name }}"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: refresh_device_response

        - name: Validate refresh response
          ansible.builtin.assert:
            that:
              - refresh_device_response.json.result is defined
              - refresh_device_response.json.result | length > 0
              - refresh_device_response.json.result[0].status.code | int == 0
              - >-
                (
                  refresh_device_response.json.result[0].data.taskid
                  is defined
                )
                or
                (
                  refresh_device_response.json.result[0].data.task
                  is defined
                )
            fail_msg: >-
              FortiManager failed to start device refresh.

        - name: Save refresh task ID
          ansible.builtin.set_fact:
            refresh_task_id: >-
              {{
                refresh_device_response.json.result[0].data.taskid
                | default(
                    refresh_device_response.json.result[0].data.task
                  )
              }}

        - name: Display refresh task ID
          ansible.builtin.debug:
            msg:
              - "FortiManager device refresh started."
              - "Refresh task ID: {{ refresh_task_id }}"

        # ====================================================
        # 16. MONITOR REFRESH TASK
        # ====================================================

        - name: Wait for device refresh to complete
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 61
              method: get
              params:
                - url: "/task/task/{{ refresh_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: refresh_task_status
          until:
            - refresh_task_status.json.result is defined
            - refresh_task_status.json.result | length > 0
            - refresh_task_status.json.result[0].status.code | int == 0
            - >-
              (
                refresh_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: 36
          delay: 5

        - name: Validate refresh task result
          ansible.builtin.assert:
            that:
              - refresh_task_status.json.result[0].data.num_err | default(0) | int == 0
              - >-
                refresh_task_status.json.result[0].data.percent
                | default(0)
                | int >= 100
          fail_msg: >-
            FortiManager device refresh completed with errors.

            Task:
            {{ refresh_task_status.json.result[0].data | to_nice_json }}

        # ====================================================
        # 17. RE-READ DEVICE AFTER REFRESH
        # ====================================================

        - name: Re-read managed devices after refresh
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 70
              method: get
              params:
                - url: "/dvmdb/adom/{{ selected_firewall.target_adom }}/device"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: devices_after_refresh

        - name: Build device list after refresh
          ansible.builtin.set_fact:
            devices_after_refresh_list: >-
              {{
                devices_after_refresh.json.result[0].data
                | default([])
              }}

        - name: Initialize device matches after refresh
          ansible.builtin.set_fact:
            final_device_matches: []

        - name: Find final managed device by normalized serial
          ansible.builtin.set_fact:
            final_device_matches: >-
              {{
                final_device_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    ==
                    normalized_device_serial
                  )
                  else
                  []
                )
              }}
          loop: "{{ devices_after_refresh_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Verify final managed device
          ansible.builtin.assert:
            that:
              - final_device_matches | length == 1
            fail_msg: >-
              The managed device could not be uniquely identified after
              FortiManager refresh.

        - name: Save final managed device
          ansible.builtin.set_fact:
            authorized_device_final: "{{ final_device_matches[0] }}"

        # ====================================================
        # 18. VERIFY DEVICE IDENTITY
        # ====================================================

        - name: Verify managed device identity
          ansible.builtin.assert:
            that:
              - authorized_device_final.name is defined
              - authorized_device_final.sn is defined
              - >-
                (
                  authorized_device_final.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                )
                ==
                normalized_device_serial
          fail_msg: >-
            FortiManager managed-device identity verification failed.

        - name: Display final managed device metadata
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "FORTIMANAGER MANAGED DEVICE"
              - "=========================================="
              - "Name          : {{ authorized_device_final.name }}"
              - "Serial        : {{ authorized_device_final.sn }}"
              - "IP            : {{ authorized_device_final.ip | default('unknown') }}"
              - "Platform      : {{ authorized_device_final.platform_str | default('unknown') }}"
              - "OID           : {{ authorized_device_final.oid | default('unknown') }}"
              - "Target ADOM   : {{ selected_firewall.target_adom }}"
              - "Target VDOM   : {{ selected_firewall.target_vdom }}"
              - "=========================================="

        # ====================================================
        # 19. VERIFY MANAGEMENT IP
        # ====================================================
        #
        # We DO verify the management IP because this is device
        # metadata, not an independent VDOM verification.
        #
        # If FMG exposes the IP, it must match firewalls.vars.
        # ====================================================

        - name: Verify management IP when FortiManager provides it
          ansible.builtin.assert:
            that:
              - >-
                (
                  authorized_device_final.ip
                  | default('')
                  | string
                  | trim
                )
                ==
                (
                  selected_firewall.management_ip
                  | string
                  | trim
                )
            fail_msg: >-
              FortiManager management IP does not match firewalls.vars.

              Expected:
                {{ selected_firewall.management_ip }}

              FortiManager:
                {{ authorized_device_final.ip | default('not available') }}

              Refusing to continue because the Installation Target could
              otherwise point to the wrong FortiGate.
          when:
            - authorized_device_final.ip is defined
            - authorized_device_final.ip | string | length > 0

        # ====================================================
        # 20. VERIFY POLICY PACKAGE EXISTS
        # ====================================================

        - name: Get policy package
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 80
              method: get
              params:
                - url: >-
                    /pm/pkg/adom/{{ selected_firewall.target_adom }}/{{
                    selected_firewall.policy_package }}
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: policy_package_response

        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name is defined
              - >-
                policy_package_response.json.result[0].data.name
                ==
                selected_firewall.policy_package
            fail_msg: >-
              Policy package
              '{{ selected_firewall.policy_package }}'
              does not exist in ADOM
              '{{ selected_firewall.target_adom }}'.

              Step 04 will NOT create a policy package automatically.

              Create/manage the package with the dedicated policy-package
              management step first.

        - name: Save policy package data
          ansible.builtin.set_fact:
            policy_package_data: >-
              {{
                policy_package_response.json.result[0].data
              }}

        # ====================================================
        # 21. READ EXISTING INSTALLATION TARGETS
        # ====================================================

        - name: Read existing Installation Targets
          ansible.builtin.set_fact:
            existing_scope_members: >-
              {{
                policy_package_data['scope member']
                | default([])
              }}

        - name: Display existing Installation Targets
          ansible.builtin.debug:
            msg:
              - "Policy Package       : {{ selected_firewall.policy_package }}"
              - "Existing targets     : {{ existing_scope_members }}"

        # ====================================================
        # 22. DETERMINE WHETHER TARGET ALREADY EXISTS
        # ====================================================

        - name: Check whether managed device is already an Installation Target
          ansible.builtin.set_fact:
            installation_target_exists: >-
              {{
                existing_scope_members
                | selectattr(
                    'name',
                    'equalto',
                    authorized_device_final.name
                  )
                | selectattr(
                    'vdom',
                    'equalto',
                    selected_firewall.target_vdom
                  )
                | list
                | length > 0
              }}

        # ====================================================
        # 23. ADD INSTALLATION TARGET
        # ====================================================
        #
        # IMPORTANT:
        #
        # The documented API is:
        #
        #   add
        #   /pm/pkg/adom/<adom>/<pkg>/scope member
        #
        # data:
        #   name: <managed device name>
        #   vdom: <target vdom>
        #
        # Do NOT use:
        #   oid
        #   vdom_oid
        #
        # here.
        #
        # OID/vdom_oid are relevant to other FortiManager APIs,
        # not this scope-member assignment.
        # ========================================================

        - name: Add managed device as Installation Target
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 90
              method: add
              params:
                - url: >-
                    /pm/pkg/adom/{{ selected_firewall.target_adom }}/{{
                    selected_firewall.policy_package }}/scope member
                  data:
                    name: "{{ authorized_device_final.name }}"
                    vdom: "{{ selected_firewall.target_vdom }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: installation_target_add_response
          when: not installation_target_exists

        - name: Validate Installation Target API response
          ansible.builtin.assert:
            that:
              - installation_target_add_response.json.result is defined
              - installation_target_add_response.json.result | length > 0
              - >-
                installation_target_add_response.json.result[0].status.code
                | int == 0
            fail_msg: >-
              Failed to add
              '{{ authorized_device_final.name }}'
              as an Installation Target for policy package
              '{{ selected_firewall.policy_package }}'.
          when: not installation_target_exists

        - name: Display Installation Target status
          ansible.builtin.debug:
            msg: >-
              {{
                'Installation Target already exists.'
                if installation_target_exists
                else
                'Installation Target added successfully.'
              }}

        # ====================================================
        # 24. RE-READ POLICY PACKAGE
        # ====================================================

        - name: Re-read policy package after Installation Target operation
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 100
              method: get
              params:
                - url: >-
                    /pm/pkg/adom/{{ selected_firewall.target_adom }}/{{
                    selected_firewall.policy_package }}
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: final_policy_package_response

        - name: Validate final policy package response
          ansible.builtin.assert:
            that:
              - final_policy_package_response.json.result is defined
              - final_policy_package_response.json.result | length > 0
              - final_policy_package_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to read policy package after Installation Target
              configuration.

        - name: Save final Installation Targets
          ansible.builtin.set_fact:
            final_scope_members: >-
              {{
                final_policy_package_response.json.result[0].data['scope member']
                | default([])
              }}

        # ====================================================
        # 25. FINAL INSTALLATION TARGET VERIFICATION
        # ====================================================
        #
        # IMPORTANT:
        # We intentionally verify:
        #
        #   package name
        #   managed device name
        #
        # We do NOT perform an independent VDOM verification,
        # as requested.
        #
        # The API itself stores the target as name + vdom.
        # ========================================================

        - name: Verify Installation Target exists
          ansible.builtin.assert:
            that:
              - >-
                final_scope_members
                | selectattr(
                    'name',
                    'equalto',
                    authorized_device_final.name
                  )
                | list
                | length > 0
            fail_msg: >-
              Installation Target verification failed.

              Policy Package:
                {{ selected_firewall.policy_package }}

              Expected managed device:
                {{ authorized_device_final.name }}

              Actual scope:
                {{ final_scope_members | to_nice_json }}

        - name: Display final Installation Target
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "INSTALLATION TARGET VERIFIED"
              - "=========================================="
              - "Policy Package : {{ selected_firewall.policy_package }}"
              - "Device         : {{ authorized_device_final.name }}"
              - "VDOM           : {{ selected_firewall.target_vdom }}"
              - "IP             : {{ authorized_device_final.ip | default('unknown') }}"
              - "Platform       : {{ authorized_device_final.platform_str | default('unknown') }}"
              - "OID            : {{ authorized_device_final.oid | default('unknown') }}"
              - "=========================================="

        # ====================================================
        # 26. FINAL SUMMARY
        # ====================================================

        - name: STEP 04 final success
          ansible.builtin.debug:
            msg:
              - ""
              - "===================================================="
              - "STEP 04 STATUS: SUCCESS"
              - "===================================================="
              - "FortiGate serial : {{ selected_firewall.serial }}"
              - "FMG serial       : {{ authorized_device_final.sn }}"
              - "FMG device name  : {{ authorized_device_final.name }}"
              - "Management IP    : {{ authorized_device_final.ip | default('unknown') }}"
              - "Platform         : {{ authorized_device_final.platform_str | default('unknown') }}"
              - "Target ADOM      : {{ selected_firewall.target_adom }}"
              - "Target VDOM      : {{ selected_firewall.target_vdom }}"
              - "Policy Package   : {{ selected_firewall.policy_package }}"
              - "Installation Target: VERIFIED"
              - "===================================================="

      # ======================================================
      # ERROR HANDLING
      # ======================================================

      rescue:

        - name: Display Step 04 failure information
          ansible.builtin.debug:
            msg:
              - ""
              - "===================================================="
              - "STEP 04 STATUS: FAILED"
              - "===================================================="
              - "NetBox asset_tag : {{ netbox_asset_tag }}"
              - "Serial           : {{ selected_firewall.serial }}"
              - "Target ADOM      : {{ selected_firewall.target_adom }}"
              - "Target VDOM      : {{ selected_firewall.target_vdom }}"
              - "Policy Package   : {{ selected_firewall.policy_package }}"
              - ""
              - "The workflow was stopped intentionally."
              - "No installation was triggered by Step 04."
              - "===================================================="

        - name: Fail Step 04
          ansible.builtin.fail:
            msg: >-
              Step 04 failed. See the previous task output for details.

      # ======================================================
      # ALWAYS LOGOUT
      # ======================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            body:
              id: 999
              method: exec
              params:
                - url: "/sys/logout"
              session: "{{ fmg_session }}"
            status_code: 200
          when:
            - fmg_session is defined
          no_log: true

        - name: Display logout status
          ansible.builtin.debug:
            msg: "FortiManager API session closed."
          when:
            - fmg_session is defined
