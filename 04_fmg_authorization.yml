---
# ============================================================
# STEP 04 - FortiManager Authorization + ADOM + Installation Target
# ============================================================
#
# BUSINESS OBJECTIVE
# ------------------
# For a FortiGate that appears under:
#
#     Device Manager > Unauthorized Devices
#
# FortiManager already places the unauthorized device in the root
# context. We do NOT need to authorize it into root first.
#
# The required first-time workflow is:
#
#     Unauthorized Devices
#             |
#             | promote_unreg
#             v
#     TARGET ADOM directly
#             |
#             v
#     Target Policy Package
#             |
#             v
#     Installation Target
#
# ADOM is the primary ownership/context boundary.
# VDOM is only an attribute of the Installation Target.
#
# SOURCE OF TRUTH
# ---------------
# NetBox inventory:
#     asset_tag
#
# vars/firewalls.vars:
#     serial
#     hostname
#     management_ip
#     target_adom
#     target_vdom
#     policy_package
#
# SAFETY
# ------
# - Serial is normalized only for comparison.
# - The real FortiManager serial is never modified.
# - Management IP is mandatory and verified.
# - Target ADOM must exist before any device-changing operation.
# - For first-time unauthorized devices, promote_unreg targets the
#   requested ADOM directly.
# - A device already managed in another ADOM is not silently moved.
#   The playbook stops and reports that state.
# - A device already managed in root is reported as a separate state;
#   it is NOT forced through an undocumented or unnecessary path.
# - Wrong-VDOM Installation Target mappings are refused.
# - Duplicate device/VDOM scope members are refused.
# - No policy-package installation is performed in this step.
#
# API FLOW
# --------
# LOGIN
#   /sys/login/user
#
# TARGET ADOM DISCOVERY
#   /dvmdb/adom
#
# TARGET ADOM DEVICE CHECK
#   /dvmdb/adom/<target_adom>/device
#
# UNAUTHORIZED DEVICE DISCOVERY
#   /dvmdb/device
#   filter: mgmt_mode == unreg
#
# DIRECT AUTHORIZATION
#   exec /dvm/cmd/add/device
#   data:
#     adom: <target_adom>
#     device:
#       name: <GUI device name>
#       device action: promote_unreg
#
# TARGET ADOM VERIFICATION
#   /dvmdb/adom/<target_adom>/device
#
# POLICY PACKAGE
#   /pm/pkg/adom/<target_adom>/<policy_package>
#
# INSTALLATION TARGET
#   add /pm/pkg/adom/<target_adom>/<policy_package>/scope member
#   data:
#     name: <managed device name>
#     vdom: <target_vdom>
#
# ============================================================

- name: STEP 04 - FortiManager direct ADOM authorization and Installation Target
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    # --------------------------------------------------------
    # FortiManager JSON-RPC
    # --------------------------------------------------------
    fmg_jsonrpc_url: "https://{{ fortimanager_host }}/jsonrpc"

    # --------------------------------------------------------
    # Load firewalls.vars as raw YAML.
    # --------------------------------------------------------
    firewall_data: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir + '/vars/firewalls.vars'
        )
        | from_yaml
      }}

    firewall_records: >-
      {{
        firewall_data.firewalls
        | default(firewall_data)
      }}

    # --------------------------------------------------------
    # NetBox -> asset_tag
    # --------------------------------------------------------
    netbox_asset_tag: >-
      {{
        hostvars[inventory_hostname]['asset_tag']
        | default('')
        | string
        | trim
      }}

    # --------------------------------------------------------
    # Reliability tuning
    # --------------------------------------------------------
    api_timeout_seconds: 30

    auth_task_retries: 36
    auth_task_delay: 5

    state_retries: 30
    state_delay: 5

    refresh_task_retries: 36
    refresh_task_delay: 5

  tasks:

    # ========================================================
    # 1. SOURCE-OF-TRUTH VALIDATION
    # ========================================================

    - name: Display Step 04 source-of-truth input
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "STEP 04 - INPUT"
          - "============================================================"
          - "Inventory host      : {{ inventory_hostname }}"
          - "NetBox asset_tag    : {{ netbox_asset_tag }}"
          - "============================================================"

    - name: Validate NetBox asset_tag
      ansible.builtin.assert:
        that:
          - netbox_asset_tag | length > 0
        fail_msg: >-
          NetBox asset_tag is empty for inventory host
          '{{ inventory_hostname }}'. The asset_tag must contain the
          FortiGate serial.

    - name: Select firewall from firewalls.vars
      ansible.builtin.set_fact:
        selected_firewalls: >-
          {{
            firewall_records
            | selectattr('serial', 'defined')
            | selectattr('serial', 'equalto', netbox_asset_tag)
            | list
          }}

    - name: Validate exactly one firewall definition
      ansible.builtin.assert:
        that:
          - selected_firewalls | length == 1
        fail_msg: >-
          Expected exactly one firewall definition matching asset_tag
          '{{ netbox_asset_tag }}', but found
          {{ selected_firewalls | length }}.

    - name: Save selected firewall
      ansible.builtin.set_fact:
        selected_firewall: "{{ selected_firewalls[0] }}"

    - name: Validate required firewall attributes
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | trim | length > 0
          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | trim | length > 0
          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | trim | length > 0
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | trim | length > 0
          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | trim | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | trim | length > 0
        fail_msg: >-
          Selected firewall definition is incomplete. Required attributes:
          serial, hostname, management_ip, target_adom, target_vdom and
          policy_package.

    - name: Set normalized source-of-truth values
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            selected_firewall.serial
            | string
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}
        expected_adom: "{{ selected_firewall.target_adom | string | trim }}"
        expected_vdom: "{{ selected_firewall.target_vdom | string | trim }}"
        expected_policy_package: "{{ selected_firewall.policy_package | string | trim }}"
        expected_management_ip: "{{ selected_firewall.management_ip | string | trim }}"

    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "Selected serial       : {{ selected_firewall.serial }}"
          - "Normalized serial     : {{ normalized_device_serial }}"
          - "Expected hostname     : {{ selected_firewall.hostname }}"
          - "Expected management IP: {{ expected_management_ip }}"
          - "Target ADOM           : {{ expected_adom }}"
          - "Target VDOM           : {{ expected_vdom }}"
          - "Policy package        : {{ expected_policy_package }}"

    # ========================================================
    # 2. LOGIN
    # ========================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "{{ fmg_jsonrpc_url }}"
        method: POST
        validate_certs: false
        return_content: true
        body_format: json
        timeout: "{{ api_timeout_seconds }}"
        status_code: 200
        body:
          id: 1
          method: exec
          params:
            - url: "/sys/login/user"
              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"
          verbose: 1
      register: fmg_login
      no_log: true

    - name: Validate FortiManager login
      ansible.builtin.assert:
        that:
          - fmg_login.json is defined
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status is defined
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined
          - fmg_login.json.session | string | length > 0
        fail_msg: >-
          FortiManager login failed.
          HTTP={{
            fmg_login.status | default('unknown')
          }},
          RPC={{
            fmg_login.json.result[0].status.code
            if (
              fmg_login.json is defined
              and fmg_login.json.result is defined
              and fmg_login.json.result | length > 0
              and fmg_login.json.result[0].status is defined
            )
            else 'unknown'
          }},
          message={{
            fmg_login.json.result[0].status.message
            if (
              fmg_login.json is defined
              and fmg_login.json.result is defined
              and fmg_login.json.result | length > 0
              and fmg_login.json.result[0].status is defined
            )
            else 'unknown'
          }}.

    - name: Save FortiManager session
      ansible.builtin.set_fact:
        fmg_session: "{{ fmg_login.json.session }}"

    - name: Display login success
      ansible.builtin.debug:
        msg:
          - "FortiManager login: SUCCESS"
          - "Session returned: YES"

    # ========================================================
    # MAIN STATE MACHINE
    # ========================================================

    - name: Execute Step 04 state machine
      block:

        # ====================================================
        # 3. VERIFY TARGET ADOM FIRST
        # ====================================================

        - name: Get FortiManager ADOMs
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 10
              method: get
              params:
                - url: "/dvmdb/adom/"
                  fields:
                    - name
                    - oid
              session: "{{ fmg_session }}"
              verbose: 1
          register: fmg_adoms

        - name: Validate ADOM list response
          ansible.builtin.assert:
            that:
              - fmg_adoms.json.result is defined
              - fmg_adoms.json.result | length > 0
              - fmg_adoms.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve ADOMs.

        - name: Build ADOM list
          ansible.builtin.set_fact:
            fmg_adom_list: "{{ fmg_adoms.json.result[0].data | default([]) }}"

        - name: Find target ADOM
          ansible.builtin.set_fact:
            target_adom_matches: >-
              {{
                fmg_adom_list
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', expected_adom)
                | list
              }}

        - name: Validate target ADOM exists exactly once
          ansible.builtin.assert:
            that:
              - target_adom_matches | length == 1
            fail_msg: >-
              Target ADOM '{{ expected_adom }}' does not exist uniquely
              in FortiManager. Found {{ target_adom_matches | length }} matches.

        - name: Display target ADOM validation
          ansible.builtin.debug:
            msg:
              - "Target ADOM exists: YES"
              - "Target ADOM      : {{ expected_adom }}"
              - "Target ADOM OID  : {{ target_adom_matches[0].oid | default('unknown') }}"

        # ====================================================
        # 4. CHECK WHETHER DEVICE IS ALREADY IN TARGET ADOM
        # ====================================================

        - name: Get devices in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 20
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
          register: target_adom_devices_response

        - name: Validate target ADOM device response
          ansible.builtin.assert:
            that:
              - target_adom_devices_response.json.result is defined
              - target_adom_devices_response.json.result | length > 0
              - target_adom_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to retrieve devices from target ADOM
              '{{ expected_adom }}'.

        - name: Build target ADOM device list
          ansible.builtin.set_fact:
            target_adom_device_list: >-
              {{
                target_adom_devices_response.json.result[0].data
                | default([])
              }}

        - name: Initialize target ADOM serial matches
          ansible.builtin.set_fact:
            target_adom_serial_matches: []

        - name: Find device in target ADOM by normalized serial
          ansible.builtin.set_fact:
            target_adom_serial_matches: >-
              {{
                target_adom_serial_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ target_adom_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate target ADOM serial uniqueness
          ansible.builtin.assert:
            that:
              - target_adom_serial_matches | length <= 1
            fail_msg: >-
              Multiple devices in target ADOM '{{ expected_adom }}'
              match serial '{{ selected_firewall.serial }}'. Refusing to continue.

        - name: Set target ADOM state
          ansible.builtin.set_fact:
            device_already_in_target_adom: >-
              {{ target_adom_serial_matches | length == 1 }}

        - name: Save existing target ADOM device
          ansible.builtin.set_fact:
            authorized_device_final: "{{ target_adom_serial_matches[0] }}"
          when: device_already_in_target_adom

        - name: Verify existing target ADOM device identity
          ansible.builtin.assert:
            that:
              - authorized_device_final.name is defined
              - authorized_device_final.sn is defined
              - >-
                (
                  authorized_device_final.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - authorized_device_final.ip is defined
              - authorized_device_final.ip | string | trim == expected_management_ip
            fail_msg: >-
              The device already exists in ADOM '{{ expected_adom }}' but its
              serial or management IP does not match the source of truth.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              FMG device={{ authorized_device_final | to_nice_json }}
          when: device_already_in_target_adom

        - name: Display already-correct ADOM state
          ansible.builtin.debug:
            msg:
              - "Device is already in the correct ADOM."
              - "ADOM: {{ expected_adom }}"
              - "Device: {{ authorized_device_final.name }}"
              - "IP: {{ authorized_device_final.ip }}"
          when: device_already_in_target_adom

        # ====================================================
        # 5. DISCOVER ACTUAL UNAUTHORIZED STATE
        #
        # The GUI state "Unauthorized Devices" corresponds to
        # an unregistered device. Query it explicitly.
        # ====================================================

        - name: Get FortiManager unauthorized devices
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 30
              method: get
              params:
                - url: "/dvmdb/device"
                  fields:
                    - name
                    - sn
                    - ip
                    - mgmt_mode
                    - platform_str
                    - oid
                  filter:
                    - mgmt_mode
                    - "=="
                    - "unreg"
              session: "{{ fmg_session }}"
              verbose: 1
          register: unauthorized_devices_response
          when: not device_already_in_target_adom

        - name: Validate unauthorized devices response
          ansible.builtin.assert:
            that:
              - unauthorized_devices_response.json.result is defined
              - unauthorized_devices_response.json.result | length > 0
              - unauthorized_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve Unauthorized Devices.
          when: not device_already_in_target_adom

        - name: Build unauthorized device list
          ansible.builtin.set_fact:
            unauthorized_device_list: >-
              {{
                unauthorized_devices_response.json.result[0].data
                | default([])
              }}
          when: not device_already_in_target_adom

        - name: Initialize unauthorized serial matches
          ansible.builtin.set_fact:
            unauthorized_serial_matches: []
          when: not device_already_in_target_adom

        - name: Match expected serial against Unauthorized Devices
          ansible.builtin.set_fact:
            unauthorized_serial_matches: >-
              {{
                unauthorized_serial_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ unauthorized_device_list | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: not device_already_in_target_adom

        - name: Validate unauthorized serial uniqueness
          ansible.builtin.assert:
            that:
              - unauthorized_serial_matches | length <= 1
            fail_msg: >-
              Multiple Unauthorized Device entries match serial
              '{{ selected_firewall.serial }}'. Refusing to continue.
          when: not device_already_in_target_adom

        - name: Set unauthorized state
          ansible.builtin.set_fact:
            device_is_unauthorized: "{{ unauthorized_serial_matches | length == 1 }}"
            unauthorized_device: >-
              {{
                unauthorized_serial_matches[0]
                if unauthorized_serial_matches | length == 1
                else {}
              }}
          when: not device_already_in_target_adom

        - name: Display unauthorized device state
          ansible.builtin.debug:
            msg:
              - "Device is in Unauthorized Devices: {{ device_is_unauthorized }}"
              - >-
                {{
                  'Device name: ' + (unauthorized_device.name | default('unknown'))
                  if device_is_unauthorized
                  else
                  'Expected device was not found in Unauthorized Devices.'
                }}
          when: not device_already_in_target_adom

        # ====================================================
        # 6. FIRST-TIME DIRECT AUTHORIZATION INTO TARGET ADOM
        # ====================================================

        - name: Validate unauthorized device before direct authorization
          ansible.builtin.assert:
            that:
              - unauthorized_device.name is defined
              - unauthorized_device.sn is defined
              - unauthorized_device.ip is defined
              - >-
                (
                  unauthorized_device.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - unauthorized_device.ip | string | trim == expected_management_ip
            fail_msg: >-
              Unauthorized device identity mismatch.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              FMG unauthorized entry:
              {{ unauthorized_device | to_nice_json }}
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized

        - name: Directly authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 40
              method: exec
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ expected_adom }}"
                    device:
                      name: "{{ unauthorized_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
          register: authorization_response
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized

        - name: Validate direct authorization request
          ansible.builtin.assert:
            that:
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - authorization_response.json.result[0].data is defined
              - >-
                (
                  authorization_response.json.result[0].data.taskid is defined
                )
                or
                (
                  authorization_response.json.result[0].data.task is defined
                )
                or
                (
                  authorization_response.json.result[0].data.device is defined
                )
            fail_msg: >-
              FortiManager rejected direct authorization of
              '{{ unauthorized_device.name }}' into ADOM
              '{{ expected_adom }}'.

              Response:
              {{ authorization_response.json | to_nice_json }}
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized

        - name: Save authorization task ID when returned
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.taskid
                | default(
                    authorization_response.json.result[0].data.task
                    | default('')
                  )
              }}
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized

        - name: Display direct authorization result
          ansible.builtin.debug:
            msg:
              - "Direct authorization request accepted."
              - "Target ADOM: {{ expected_adom }}"
              - "Device: {{ unauthorized_device.name }}"
              - "Task ID: {{ authorization_task_id | default('not returned') }}"
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized

        # ====================================================
        # 7. MONITOR AUTHORIZATION TASK WHEN ASYNC TASK EXISTS
        # ====================================================

        - name: Wait for direct authorization task
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 41
              method: get
              params:
                - url: "/task/task/{{ authorization_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: authorization_task_status
          until:
            - authorization_task_status.json.result is defined
            - authorization_task_status.json.result | length > 0
            - authorization_task_status.json.result[0].status.code | int == 0
            - >-
              (
                authorization_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: "{{ auth_task_retries }}"
          delay: "{{ auth_task_delay }}"
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized
            - authorization_task_id | default('') | string | length > 0

        - name: Validate authorization task
          ansible.builtin.assert:
            that:
              - authorization_task_status.json.result[0].data.percent | default(0) | int >= 100
              - authorization_task_status.json.result[0].data.num_err | default(0) | int == 0
            fail_msg: >-
              Direct authorization task completed with errors.

              Task data:
              {{ authorization_task_status.json.result[0].data | to_nice_json }}
          when:
            - not device_already_in_target_adom
            - device_is_unauthorized
            - authorization_task_id | default('') | string | length > 0

        # ====================================================
        # 8. VERIFY DEVICE APPEARS IN TARGET ADOM
        #
        # This is the critical proof that direct authorization
        # landed in the requested ADOM.
        # ====================================================

        - name: Wait for device to appear in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 50
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
          register: post_authorization_target_response
          until:
            - post_authorization_target_response.json.result is defined
            - post_authorization_target_response.json.result | length > 0
            - post_authorization_target_response.json.result[0].status.code | int == 0
            - >-
              (
                post_authorization_target_response.json.result[0].data | default([])
                | selectattr('sn', 'defined')
                | map(attribute='sn')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | list
              ).count(normalized_device_serial) == 1
          retries: "{{ state_retries }}"
          delay: "{{ state_delay }}"
          when: not device_already_in_target_adom

        - name: Build target ADOM list after authorization
          ansible.builtin.set_fact:
            post_authorization_target_list: >-
              {{
                post_authorization_target_response.json.result[0].data
                | default([])
              }}
          when: not device_already_in_target_adom

        - name: Initialize post-authorization matches
          ansible.builtin.set_fact:
            post_authorization_matches: []
          when: not device_already_in_target_adom

        - name: Find device after direct authorization
          ansible.builtin.set_fact:
            post_authorization_matches: >-
              {{
                post_authorization_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ post_authorization_target_list | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: not device_already_in_target_adom

        - name: Validate device after direct authorization
          ansible.builtin.assert:
            that:
              - post_authorization_matches | length == 1
              - post_authorization_matches[0].name is defined
              - post_authorization_matches[0].sn is defined
              - >-
                (
                  post_authorization_matches[0].sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - post_authorization_matches[0].ip is defined
              - post_authorization_matches[0].ip | string | trim == expected_management_ip
            fail_msg: >-
              Direct authorization did not result in the expected device
              in target ADOM '{{ expected_adom }}'.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              Matches:
              {{ post_authorization_matches | to_nice_json }}
          when: not device_already_in_target_adom

        - name: Save managed device after authorization
          ansible.builtin.set_fact:
            authorized_device_final: >-
              {{
                post_authorization_matches[0]
                if not device_already_in_target_adom
                else authorized_device_final
              }}

        # ====================================================
        # 9. FINAL DEVICE IDENTITY + IP VALIDATION
        # ====================================================

        - name: Validate final managed device identity
          ansible.builtin.assert:
            that:
              - authorized_device_final.name is defined
              - authorized_device_final.sn is defined
              - >-
                (
                  authorized_device_final.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - authorized_device_final.ip is defined
              - authorized_device_final.ip | string | trim == expected_management_ip
            fail_msg: >-
              Final managed device identity verification failed.

              Expected:
                serial={{ selected_firewall.serial }}
                IP={{ expected_management_ip }}

              FortiManager:
              {{ authorized_device_final | to_nice_json }}

        - name: Display verified target ADOM device
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "TARGET ADOM DEVICE VERIFIED"
              - "============================================================"
              - "ADOM        : {{ expected_adom }}"
              - "Device Name : {{ authorized_device_final.name }}"
              - "Serial      : {{ authorized_device_final.sn }}"
              - "Management IP: {{ authorized_device_final.ip }}"
              - "============================================================"

        # ====================================================
        # 10. REFRESH DEVICE METADATA IN TARGET ADOM
        #
        # Refresh only after the device has been confirmed in
        # the requested ADOM.
        # ====================================================

        - name: Refresh managed FortiGate in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 60
              method: exec
              params:
                - url: "/dvm/cmd/update/device"
                  data:
                    adom: "{{ expected_adom }}"
                    device: "{{ authorized_device_final.name }}"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
          register: refresh_response

        - name: Validate refresh request
          ansible.builtin.assert:
            that:
              - refresh_response.json.result is defined
              - refresh_response.json.result | length > 0
              - refresh_response.json.result[0].status.code | int == 0
              - refresh_response.json.result[0].data is defined
              - >-
                (
                  refresh_response.json.result[0].data.taskid is defined
                )
                or
                (
                  refresh_response.json.result[0].data.task is defined
                )
            fail_msg: >-
              FortiManager failed to start device refresh in target ADOM.

              Response:
              {{ refresh_response.json | to_nice_json }}

        - name: Save refresh task ID
          ansible.builtin.set_fact:
            refresh_task_id: >-
              {{
                refresh_response.json.result[0].data.taskid
                | default(
                    refresh_response.json.result[0].data.task
                  )
              }}

        - name: Wait for refresh task
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 61
              method: get
              params:
                - url: "/task/task/{{ refresh_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: refresh_task_status
          until:
            - refresh_task_status.json.result is defined
            - refresh_task_status.json.result | length > 0
            - refresh_task_status.json.result[0].status.code | int == 0
            - >-
              (
                refresh_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: "{{ refresh_task_retries }}"
          delay: "{{ refresh_task_delay }}"

        - name: Validate refresh task
          ansible.builtin.assert:
            that:
              - refresh_task_status.json.result[0].data.percent | default(0) | int >= 100
              - refresh_task_status.json.result[0].data.num_err | default(0) | int == 0
            fail_msg: >-
              FortiManager device refresh failed.

              Task data:
              {{ refresh_task_status.json.result[0].data | to_nice_json }}

        # ====================================================
        # 11. RE-READ DEVICE AFTER REFRESH
        # ====================================================

        - name: Re-read target ADOM devices after refresh
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 70
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
          register: final_device_response

        - name: Initialize final device matches
          ansible.builtin.set_fact:
            final_device_matches: []

        - name: Find final target ADOM device
          ansible.builtin.set_fact:
            final_device_matches: >-
              {{
                final_device_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ final_device_response.json.result[0].data | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate final target ADOM device and IP
          ansible.builtin.assert:
            that:
              - final_device_matches | length == 1
              - final_device_matches[0].ip is defined
              - final_device_matches[0].ip | string | trim == expected_management_ip
            fail_msg: >-
              Final target ADOM device/IP verification failed.

              Expected ADOM={{ expected_adom }}
              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              Matches:
              {{ final_device_matches | to_nice_json }}

        - name: Update final managed device
          ansible.builtin.set_fact:
            authorized_device_final: "{{ final_device_matches[0] }}"

        # ====================================================
        # 12. VERIFY POLICY PACKAGE IN THE SAME ADOM
        # ====================================================

        - name: Get target policy package
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 80
              method: get
              params:
                - url: >-
                    /pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}
              session: "{{ fmg_session }}"
              verbose: 1
          register: policy_package_response

        - name: Validate policy package exists in target ADOM
          ansible.builtin.assert:
            that:
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name is defined
              - policy_package_response.json.result[0].data.name == expected_policy_package
            fail_msg: >-
              Policy package '{{ expected_policy_package }}' was not found
              in target ADOM '{{ expected_adom }}'.

        - name: Save policy package data
          ansible.builtin.set_fact:
            policy_package_data: "{{ policy_package_response.json.result[0].data }}"

        - name: Display policy package validation
          ansible.builtin.debug:
            msg:
              - "Policy Package exists: YES"
              - "Policy Package       : {{ expected_policy_package }}"
              - "Policy Package ADOM  : {{ expected_adom }}"

        # ====================================================
        # 13. READ / ANALYZE INSTALLATION TARGET
        # ====================================================

        - name: Read existing Installation Targets
          ansible.builtin.set_fact:
            existing_scope_members: >-
              {{
                policy_package_data['scope member']
                | default([])
              }}

        - name: Find exact device and VDOM scope members
          ansible.builtin.set_fact:
            exact_scope_matches: >-
              {{
                existing_scope_members
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device_final.name)
                | selectattr('vdom', 'equalto', expected_vdom)
                | list
              }}

        - name: Find same-device scope members regardless of VDOM
          ansible.builtin.set_fact:
            same_device_scope_matches: >-
              {{
                existing_scope_members
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', authorized_device_final.name)
                | list
              }}

        - name: Validate Installation Target scope is not ambiguous
          ansible.builtin.assert:
            that:
              - exact_scope_matches | length <= 1
              - same_device_scope_matches | length <= 1
            fail_msg: >-
              The policy package contains an ambiguous Installation Target
              state for device '{{ authorized_device_final.name }}'.

              Existing scope members:
              {{ existing_scope_members | to_nice_json }}

        - name: Determine Installation Target state
          ansible.builtin.set_fact:
            installation_target_exists: "{{ exact_scope_matches | length == 1 }}"
            wrong_vdom_target_exists: >-
              {{
                (
                  same_device_scope_matches | length == 1
                )
                and
                (
                  same_device_scope_matches[0].vdom != expected_vdom
                )
              }}

        - name: Refuse wrong-VDOM Installation Target
          ansible.builtin.assert:
            that:
              - not wrong_vdom_target_exists
            fail_msg: >-
              Device '{{ authorized_device_final.name }}' already exists
              in policy package '{{ expected_policy_package }}' as an
              Installation Target with VDOM
              '{{ same_device_scope_matches[0].vdom }}'.

              Source of truth requires VDOM '{{ expected_vdom }}'.

              The playbook will not silently replace the mapping.

        - name: Display Installation Target pre-check
          ansible.builtin.debug:
            msg:
              - "Policy Package ADOM : {{ expected_adom }}"
              - "Policy Package       : {{ expected_policy_package }}"
              - "Device               : {{ authorized_device_final.name }}"
              - "Management IP        : {{ authorized_device_final.ip }}"
              - "VDOM                 : {{ expected_vdom }}"
              - "Target already exists : {{ installation_target_exists }}"

        # ====================================================
        # 14. ADD INSTALLATION TARGET
        # ====================================================
        #
        # Scope member = name + vdom.
        # IP is independently validated against the managed device.
        # ====================================================

        - name: Add Installation Target
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 90
              method: add
              params:
                - url: >-
                    /pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}/scope member
                  data:
                    name: "{{ authorized_device_final.name }}"
                    vdom: "{{ expected_vdom }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: installation_target_add_response
          when: not installation_target_exists

        - name: Validate Installation Target add response
          ansible.builtin.assert:
            that:
              - installation_target_add_response.json.result is defined
              - installation_target_add_response.json.result | length > 0
              - installation_target_add_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to add device '{{ authorized_device_final.name }}'
              with VDOM '{{ expected_vdom }}' to Installation Targets of
              policy package '{{ expected_policy_package }}' in ADOM
              '{{ expected_adom }}'.

              Response:
              {{
                installation_target_add_response.json
                if installation_target_add_response.json is defined
                else installation_target_add_response
              }}
          when: not installation_target_exists

        - name: Display Installation Target operation
          ansible.builtin.debug:
            msg: >-
              {{
                'Installation Target already existed.'
                if installation_target_exists
                else
                'Installation Target added successfully.'
              }}

        # ====================================================
        # 15. FINAL POLICY PACKAGE RE-READ
        # ====================================================

        - name: Re-read policy package after Installation Target change
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 100
              method: get
              params:
                - url: >-
                    /pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}
              session: "{{ fmg_session }}"
              verbose: 1
          register: final_policy_package_response

        - name: Validate final policy package read
          ansible.builtin.assert:
            that:
              - final_policy_package_response.json.result is defined
              - final_policy_package_response.json.result | length > 0
              - final_policy_package_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to re-read policy package
              '{{ expected_policy_package }}' after Installation Target
              operation.

        - name: Save final scope members
          ansible.builtin.set_fact:
            final_scope_members: >-
              {{
                final_policy_package_response.json.result[0].data['scope member']
                | default([])
              }}

        - name: Calculate final exact Installation Target matches
          ansible.builtin.set_fact:
            final_exact_scope_matches: >-
              {{
                final_scope_members
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device_final.name)
                | selectattr('vdom', 'equalto', expected_vdom)
                | list
              }}

        - name: Verify exactly one final Installation Target
          ansible.builtin.assert:
            that:
              - final_exact_scope_matches | length == 1
              - final_exact_scope_matches[0].name == authorized_device_final.name
              - final_exact_scope_matches[0].vdom == expected_vdom
            fail_msg: >-
              FINAL Installation Target verification failed.

              Expected:
                ADOM={{ expected_adom }}
                Policy Package={{ expected_policy_package }}
                Device={{ authorized_device_final.name }}
                VDOM={{ expected_vdom }}
                Management IP={{ expected_management_ip }}

              Actual scope:
              {{ final_scope_members | to_nice_json }}

        # ====================================================
        # 16. FINAL DEVICE/IP CROSS-CHECK
        # ====================================================

        - name: Final device and management IP cross-check
          ansible.builtin.assert:
            that:
              - authorized_device_final.ip is defined
              - authorized_device_final.ip | string | trim == expected_management_ip
              - >-
                (
                  authorized_device_final.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
            fail_msg: >-
              Final device identity/IP cross-check failed.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              FMG device:
              {{ authorized_device_final | to_nice_json }}

        # ====================================================
        # 17. SUCCESS
        # ====================================================

        - name: STEP 04 final success
          ansible.builtin.debug:
            msg:
              - ""
              - "============================================================"
              - "STEP 04 STATUS: SUCCESS"
              - "============================================================"
              - "Device Serial       : {{ authorized_device_final.sn }}"
              - "Device Name         : {{ authorized_device_final.name }}"
              - "Management IP       : {{ authorized_device_final.ip }}"
              - "Target ADOM         : {{ expected_adom }}"
              - "Target VDOM         : {{ expected_vdom }}"
              - "Policy Package      : {{ expected_policy_package }}"
              - "ADOM placement      : VERIFIED"
              - "Device identity     : VERIFIED"
              - "Management IP       : VERIFIED"
              - "Installation Target : VERIFIED"
              - "Policy installation : NOT PERFORMED"
              - "============================================================"

      # ======================================================
      # ERROR HANDLING
      # ======================================================

      rescue:

        - name: Display Step 04 failure context
          ansible.builtin.debug:
            msg:
              - ""
              - "============================================================"
              - "STEP 04 STATUS: FAILED"
              - "============================================================"
              - "Asset tag          : {{ netbox_asset_tag }}"
              - "Serial             : {{ selected_firewall.serial }}"
              - "Expected IP        : {{ expected_management_ip }}"
              - "Target ADOM        : {{ expected_adom }}"
              - "Target VDOM        : {{ expected_vdom }}"
              - "Policy Package     : {{ expected_policy_package }}"
              - ""
              - "Policy installation was NOT triggered."
              - "============================================================"

        - name: Fail Step 04
          ansible.builtin.fail:
            msg: >-
              STEP 04 failed. Review the preceding task output for the
              exact FortiManager API response/state mismatch.

      # ======================================================
      # ALWAYS LOGOUT
      # ======================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 999
              method: exec
              params:
                - url: "/sys/logout"
              session: "{{ fmg_session }}"
              verbose: 1
          when: fmg_session is defined
          no_log: true

        - name: Display logout status
          ansible.builtin.debug:
            msg: "FortiManager API session closed."
          when: fmg_session is defined
