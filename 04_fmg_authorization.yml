---
# ============================================================
# STEP 04 - FORTIGATE AUTHORIZATION + POLICY PACKAGE MAPPING
# ============================================================
#
# Purpose
# -------
# 1. Select one firewall from NetBox asset_tag.
# 2. Read its desired values from vars/firewalls.vars.
# 3. Find/authorize the FortiGate from FMG root ADOM.
# 4. Verify the FortiGate in the target ADOM.
# 5. Ensure the FortiGate is assigned to the configured policy
#    package as an Installation Target.
#
# Important terminology
# ---------------------
# source_adom : FortiManager root ADOM where unauthorized devices
#               are presented.
#
# target_adom : FortiManager destination ADOM.
#
# target_vdom : VDOM on the FortiGate.
#
# policy_package : Policy package in target_adom.
#
# The policy-package Installation Targets are represented by the
# package "scope member" field.
#
# ============================================================

- name: Step 04 - FortiGate Authorization and Package Mapping
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

    source_adom: "root"

    authorization_poll_retries: 30
    authorization_poll_delay: 5

    target_verify_retries: 12
    target_verify_delay: 5

  tasks:

    # ==========================================================
    # 1. READ FIREWALL DATABASE
    # ==========================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ==========================================================
    # 2. SELECT FIREWALL FROM NETBOX ASSET TAG
    # ==========================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    - name: Skip unknown firewall
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action            : SKIPPED"
          - "============================================================"
      when:
        - selected_firewall | length == 0


    - name: End unknown firewall host
      ansible.builtin.meta: end_host
      when:
        - selected_firewall | length == 0


    # ==========================================================
    # 3. VALIDATE FIREWALL DATA
    # ==========================================================

    - name: Validate selected firewall
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | length > 0
          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | length > 0
          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | length > 0
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | length > 0
          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | length > 0
        fail_msg: >-
          Firewall '{{ asset_tag }}' exists in firewalls.vars, but one or
          more required fields are missing.

          Required:
            serial
            hostname
            management_ip
            target_adom
            target_vdom
            policy_package


    # ==========================================================
    # 4. SAVE PARAMETERS
    # ==========================================================

    - name: Save provisioning parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        desired_hostname: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    - name: Display provisioning target
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE PROVISIONING TARGET"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag }}"
          - "Serial           : {{ device_serial }}"
          - "Expected Name    : {{ desired_hostname }}"
          - "Source ADOM      : {{ source_adom }}"
          - "Target ADOM      : {{ target_adom }}"
          - "Target VDOM      : {{ target_vdom }}"
          - "Policy Package   : {{ policy_package }}"
          - "============================================================"


    # ==========================================================
    # 5. FORTIMANAGER WORKFLOW
    # ==========================================================

    - name: Execute FortiManager provisioning workflow
      block:

        # ======================================================
        # 5.1 LOGIN
        # ======================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 1
              method: "exec"
              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"
            return_content: true
          register: fmg_login
          no_log: true


        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.status | int == 200
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined
              - fmg_login.json.session | string | length > 0
            fail_msg: "FortiManager authentication failed."
            success_msg: "FortiManager authentication successful."


        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"
          no_log: true


        # ======================================================
        # 5.2 CHECK TARGET ADOM
        # ======================================================
        #
        # Idempotency:
        # If the device is already in target_adom, do not send
        # another promote_unreg operation.
        # ======================================================

        - name: Get devices from target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: target_adom_before_auth
          no_log: true


        - name: Verify target ADOM query
          ansible.builtin.assert:
            that:
              - target_adom_before_auth.status | int == 200
              - target_adom_before_auth.json.result is defined
              - target_adom_before_auth.json.result | length > 0
              - target_adom_before_auth.json.result[0].status.code | int == 0
            fail_msg: >-
              Unable to retrieve devices from target ADOM
              '{{ target_adom }}'.


        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        - name: Find device already in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              target_adom_before_auth.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Determine whether authorization is required
          ansible.builtin.set_fact:
            authorization_needed: "{{ authorized_device | length == 0 }}"


        - name: Display authorization state
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "AUTHORIZATION STATE"
              - "============================================================"
              - "FortiGate       : {{ device_serial }}"
              - "Target ADOM     : {{ target_adom }}"
              - "Already present : {{ not authorization_needed }}"
              - "============================================================"


        # ======================================================
        # 5.3 FIND DEVICE IN ROOT / UNAUTHORIZED DEVICES
        # ======================================================

        - name: Get devices from FortiManager root ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ source_adom }}/device"
                  loadsub: 0
            return_content: true
          register: root_devices_response
          no_log: true
          when:
            - authorization_needed


        - name: Verify root ADOM query
          ansible.builtin.assert:
            that:
              - root_devices_response.status | int == 200
              - root_devices_response.json.result is defined
              - root_devices_response.json.result | length > 0
              - root_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Unable to retrieve FortiManager root ADOM devices.
          when:
            - authorization_needed


        - name: Save root ADOM devices
          ansible.builtin.set_fact:
            root_devices: >-
              {{
                root_devices_response.json.result[0].data
                | default([])
              }}
          when:
            - authorization_needed


        - name: Match unauthorized FortiGate by normalized serial
          ansible.builtin.set_fact:
            root_device_matches: >-
              {%- set ns = namespace(matches=[]) -%}
              {%- for device in root_devices -%}
                {%- if device.sn is defined -%}
                  {%- if (
                    device.sn
                    | regex_replace('[^A-Za-z0-9]', '')
                    | upper
                  ) == normalized_device_serial -%}
                    {%- set ns.matches = ns.matches + [device] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.matches }}
          when:
            - authorization_needed


        - name: Verify exactly one root device matches
          ansible.builtin.assert:
            that:
              - root_device_matches | length == 1
            fail_msg: >-
              Expected exactly one root-ADOM device with serial
              '{{ device_serial }}', but found
              {{ root_device_matches | length }}.
          when:
            - authorization_needed


        - name: Save unauthorized FortiGate
          ansible.builtin.set_fact:
            unauthorized_device: "{{ root_device_matches[0] }}"
          when:
            - authorization_needed


        # ======================================================
        # 5.4 AUTHORIZE
        # ======================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ target_adom }}"
                    device:
                      name: "{{ unauthorized_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
            return_content: true
          register: authorization_response
          no_log: true
          when:
            - authorization_needed


        - name: Verify authorization request
          ansible.builtin.assert:
            that:
              - authorization_response.status | int == 200
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - authorization_response.json.result[0].data.taskid is defined
            fail_msg: >-
              FortiManager rejected authorization of
              '{{ device_serial }}' into '{{ target_adom }}'.
          when:
            - authorization_needed


        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.taskid
              }}
          when:
            - authorization_needed


        # ======================================================
        # 5.5 WAIT FOR AUTHORIZATION
        # ======================================================

        - name: Wait for authorization task
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/task/task/{{ authorization_task_id }}"
            return_content: true
          register: authorization_task
          retries: "{{ authorization_poll_retries }}"
          delay: "{{ authorization_poll_delay }}"
          until:
            - authorization_task.json.result is defined
            - authorization_task.json.result | length > 0
            - authorization_task.json.result[0].status.code | int == 0
            - authorization_task.json.result[0].data is defined
            - authorization_task.json.result[0].data.percent | default(0) | int >= 100
          no_log: true
          when:
            - authorization_needed


        - name: Verify authorization task succeeded
          ansible.builtin.assert:
            that:
              - authorization_task.json.result[0].data.percent | int >= 100
              - authorization_task.json.result[0].data.num_err | default(0) | int == 0
            fail_msg: >-
              Authorization task failed for '{{ device_serial }}'.
          when:
            - authorization_needed


        # ======================================================
        # 5.6 REFRESH TARGET ADOM
        # ======================================================

        - name: Get target ADOM devices after authorization
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: final_target_devices
          retries: "{{ target_verify_retries }}"
          delay: "{{ target_verify_delay }}"
          until:
            - final_target_devices.json.result is defined
            - final_target_devices.json.result | length > 0
            - final_target_devices.json.result[0].status.code | int == 0
            - >-
              (
                final_target_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) == 1
          no_log: true


        - name: Save authorized FortiGate
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              final_target_devices.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Verify FortiGate is in target ADOM
          ansible.builtin.assert:
            that:
              - authorized_device | length > 0
            fail_msg: >-
              FortiGate '{{ device_serial }}' is not present in
              target ADOM '{{ target_adom }}'.


        # ======================================================
        # 5.7 POLICY PACKAGE
        # ======================================================
        #
        # VDOM discovery/verification is intentionally NOT performed.
        #
        # target_vdom comes directly from firewalls.vars and is used
        # only as the Installation Target attribute.
        # ======================================================

        # ======================================================
        # 5.7 GET POLICY PACKAGE
        # ======================================================

        - name: Get configured policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 7
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: policy_package_response


        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - policy_package_response.status | int == 200
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name == policy_package
            fail_msg: >-
              Policy package '{{ policy_package }}' was not found
              in ADOM '{{ target_adom }}'.


        - name: Save current package scope
          ansible.builtin.set_fact:
            current_scope_members: >-
              {{
                policy_package_response.json.result[0].data['scope member']
                | default([])
              }}


        # ======================================================
        # 5.8 DETERMINE INSTALLATION TARGET STATE
        # ======================================================

        - name: Determine whether exact Installation Target exists
          ansible.builtin.set_fact:
            installation_target_exists: >-
              {{
                (
                  current_scope_members
                  | selectattr('name', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | list
                  | length
                ) >= 1
              }}


        - name: Display package Installation Target state
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "POLICY PACKAGE INSTALLATION TARGET"
              - "============================================================"
              - "ADOM            : {{ target_adom }}"
              - "Policy Package  : {{ policy_package }}"
              - "FortiGate       : {{ authorized_device.name }}"
              - "Device OID      : {{ authorized_device.oid }}"
              - "Target VDOM     : {{ target_vdom }}"
              - "Target Exists   : {{ installation_target_exists }}"
              - "Current Scope   : {{ current_scope_members }}"
              - "============================================================"


        # ======================================================
        # 5.9 BUILD COMPLETE DESIRED SCOPE
        # ======================================================
        #
        # We use the package-level SET pattern that already exists
        # in the user's working FortiManager automation.
        #
        # Existing targets are preserved.
        # The desired device/VDOM is appended only when missing.
        #
        # The payload includes:
        #   name
        #   oid
        #   vdom
        #   vdom_oid
        #
        # This matches the structure previously used successfully
        # against this FortiManager environment.
        # ======================================================

        - name: Initialize desired package scope
          ansible.builtin.set_fact:
            desired_scope_members: []


        - name: Preserve existing package Installation Targets
          ansible.builtin.set_fact:
            desired_scope_members: >-
              {{
                desired_scope_members + [item]
              }}
          loop: "{{ current_scope_members }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}/{{ item.vdom | default('unknown') }}"


        - name: Add desired FortiGate to desired package scope
          ansible.builtin.set_fact:
            desired_scope_members: >-
              {{
                desired_scope_members
                +
                [
                  {
                    'name': authorized_device.name,
                    'oid': authorized_device.oid | string,
                    'vdom': target_vdom,
                  }
                ]
              }}
          when:
            - not installation_target_exists


        # ======================================================
        # 5.10 UPDATE PACKAGE INSTALLATION TARGETS
        # ======================================================

        - name: Set policy package Installation Targets
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 8
              method: "set"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
                  data:
                    "scope member": "{{ desired_scope_members }}"
            return_content: true
          register: package_scope_update
          when:
            - not installation_target_exists


        - name: Verify package scope update request
          ansible.builtin.assert:
            that:
              - package_scope_update.status | int == 200
              - package_scope_update.json.result is defined
              - package_scope_update.json.result | length > 0
              - package_scope_update.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager rejected the Installation Target update for
              '{{ policy_package }}'.

              Code:
              {{
                package_scope_update.json.result[0].status.code
                | default('unknown')
              }}

              Message:
              {{
                package_scope_update.json.result[0].status.message
                | default('unknown')
              }}
          when:
            - not installation_target_exists


        # ======================================================
        # 5.11 AUTHORITATIVE RE-READ
        # ======================================================

        - name: Re-read policy package after scope update
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 9
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: package_after_update
          retries: 10
          delay: 3
          until:
            - package_after_update.json.result is defined
            - package_after_update.json.result | length > 0
            - package_after_update.json.result[0].status.code | int == 0
            - >-
              (
                package_after_update.json.result[0].data['scope member']
                | default([])
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', authorized_device.name)
                | list
                | length
              ) >= 1


        - name: Display final package Installation Targets
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "INSTALLATION TARGET VERIFICATION"
              - "============================================================"
              - "ADOM            : {{ target_adom }}"
              - "Policy Package  : {{ policy_package }}"
              - "FortiGate       : {{ authorized_device.name }}"
              - "VDOM            : {{ target_vdom }}"
              - "Scope Member    : {{ package_after_update.json.result[0].data['scope member'] | default([]) }}"
              - "============================================================"


        - name: Verify Installation Target
          ansible.builtin.assert:
            that:
              - >-
                (
                  package_after_update.json.result[0].data['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | list
                  | length
                ) >= 1
            fail_msg: >-
              FortiGate '{{ authorized_device.name }}/{{ target_vdom }}'
              is NOT assigned to policy package '{{ policy_package }}'.
            success_msg: >-
              FortiGate '{{ authorized_device.name }}/{{ target_vdom }}'
              is confirmed as an Installation Target of
              policy package '{{ policy_package }}'.


        # ======================================================
        # 5.12 FINAL SUMMARY
        # ======================================================

        - name: Display final result
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "STEP 04 - COMPLETED"
              - "============================================================"
              - "NetBox Asset Tag   : {{ asset_tag }}"
              - "FortiGate          : {{ authorized_device.name }}"
              - "Serial             : {{ authorized_device.sn }}"
              - "Target ADOM        : {{ target_adom }}"
              - "Target VDOM        : {{ target_vdom }}"
              - "Policy Package     : {{ policy_package }}"
              - "Authorization      : SUCCESS"
              - "Installation Target: SUCCESS"
              - "============================================================"


      # ==========================================================
      # 6. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            body_format: json
            headers:
              Content-Type: application/json
            body:
              id: 99
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/sys/logout"
            return_content: true
          when:
            - fmg_session is defined
          failed_when: false
          no_log: true
