---
- name: Step 3 - Authorize FortiGate in FortiManager
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:

    # ============================================================
    # FORTIMANAGER
    # ============================================================

    fmg_validate_certs: false

    # Unauthorized devices initially appear in root
    source_adom: "root"

    # Destination ADOM
    target_adom: "dhia"


  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================
    #
    # Do NOT use:
    #
    #   vars_files:
    #     - vars/firewalls.vars
    #
    # because the file contains vault_* references for multiple
    # FortiGates.
    #
    # We read and parse it only after the play starts, then select
    # the firewall using the NetBox asset_tag.
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:

        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:

        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:

        msg:
          - "=============================================="
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action           : SKIPPED"
          - "=============================================="

      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE SELECTED FIREWALL
    # ============================================================

    - name: Validate selected firewall
      ansible.builtin.assert:

        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
          - selected_firewall.target_vdom is defined
          - selected_firewall.policy_package is defined

        fail_msg: >-
          Firewall {{ asset_tag | default('unknown') }}
          exists in firewalls.vars but is missing one or more
          required fields:

          serial
          hostname
          management_ip
          target_vdom
          policy_package

        success_msg: >-
          Firewall {{ selected_firewall.serial }}
          has all required authorization parameters.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 5. SAVE TARGET PARAMETERS
    # ============================================================

    - name: Save target FortiGate parameters
      ansible.builtin.set_fact:

        device_serial: "{{ selected_firewall.serial }}"
        device_name: "{{ selected_firewall.hostname }}"
        device_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 6. DISPLAY TARGET PARAMETERS
    # ============================================================

    - name: Display target FortiGate parameters
      ansible.builtin.debug:

        msg:
          - "=============================================="
          - "FORTIGATE AUTHORIZATION TARGET"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag }}"
          - "Serial           : {{ device_serial }}"
          - "Hostname         : {{ device_name }}"
          - "Management IP    : {{ selected_firewall.management_ip }}"
          - "Target ADOM      : {{ target_adom }}"
          - "Target VDOM      : {{ device_vdom }}"
          - "Policy Package   : {{ policy_package }}"
          - "=============================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 7. LOGIN TO FORTIMANAGER
    # ============================================================

    - name: Login to FortiManager
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:
          id: 1
          method: "exec"

          params:
            - url: "/sys/login/user"

              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"

        return_content: true

      register: fmg_login

      no_log: true

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 8. VERIFY LOGIN
    # ============================================================

    - name: Verify FortiManager authentication
      ansible.builtin.assert:

        that:
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined

        fail_msg: "FortiManager authentication failed."

        success_msg: "FortiManager authentication successful."

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 9. SAVE FORTIMANAGER SESSION
    # ============================================================

    - name: Save FortiManager session
      ansible.builtin.set_fact:

        fmg_session: "{{ fmg_login.json.session }}"

      no_log: true

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 10. GET UNAUTHORIZED FORTIGATES
    # ============================================================
    #
    # FortiManager exposes unauthorized devices using:
    #
    #   mgmt_mode == unreg
    #
    # We retry until the target serial appears.
    #
    # 12 retries x 5 seconds = up to 60 seconds.
    # ============================================================

    - name: Get unauthorized FortiGates from FortiManager
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 2

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvmdb/device"

              fields:
                - "name"
                - "sn"
                - "oid"
                - "mgmt_mode"
                - "ip"
                - "hostname"
                - "platform_str"

              filter:
                - "mgmt_mode"
                - "=="
                - "unreg"

              loadsub: 0

        return_content: true

      register: unauthorized_devices

      no_log: false

      retries: 12

      delay: 5

      until:
        - unauthorized_devices.json.result is defined
        - unauthorized_devices.json.result | length > 0
        - unauthorized_devices.json.result[0].status.code | int == 0
        - >
          (
            unauthorized_devices.json.result[0].data
            | default([])
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', device_serial)
            | list
            | length
          ) > 0

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 11. VERIFY UNAUTHORIZED DEVICE QUERY
    # ============================================================

    - name: Verify unauthorized device query
      ansible.builtin.assert:

        that:
          - unauthorized_devices.json.result is defined
          - unauthorized_devices.json.result | length > 0
          - unauthorized_devices.json.result[0].status.code | int == 0

        fail_msg: >-
          FortiManager unauthorized device query failed.

          Response:
          {{ unauthorized_devices.json }}

        success_msg: >-
          FortiManager unauthorized device query succeeded.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 12. DISPLAY UNAUTHORIZED DEVICES RESPONSE
    # ============================================================

    - name: Display unauthorized FortiGates
      ansible.builtin.debug:

        var: unauthorized_devices.json

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 13. EXTRACT TARGET FORTIGATE BY SERIAL
    # ============================================================

    - name: Extract target FortiGate
      ansible.builtin.set_fact:

        target_device: >-
          {{
            unauthorized_devices.json.result[0].data
            | default([])
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', device_serial)
            | list
            | first
            | default({})
          }}

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 14. DISPLAY TARGET DEVICE
    # ============================================================

    - name: Display target FortiGate
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "UNAUTHORIZED FORTIGATE FOUND"
          - "=============================================="

          - "Requested Serial : {{ device_serial }}"
          - "Device Name      : {{ target_device.name | default('NOT FOUND') }}"
          - "Serial           : {{ target_device.sn | default('NOT FOUND') }}"
          - "IP               : {{ target_device.ip | default('NOT FOUND') }}"
          - "OID              : {{ target_device.oid | default('NOT FOUND') }}"
          - "Management Mode  : {{ target_device.mgmt_mode | default('NOT FOUND') }}"

          - "Target ADOM      : {{ target_adom }}"
          - "Target VDOM      : {{ device_vdom }}"
          - "Policy Package   : {{ policy_package }}"

          - "=============================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 15. VERIFY TARGET FORTIGATE
    # ============================================================

    - name: Verify target FortiGate exists
      ansible.builtin.assert:

        that:
          - target_device | length > 0

        fail_msg: >-
          FortiGate {{ device_serial }}
          was not found in FortiManager Unauthorized Devices.

          The API query was retried for up to 60 seconds.

          Response:
          {{ unauthorized_devices.json }}

        success_msg: >-
          FortiGate {{ device_serial }}
          was found in FortiManager Unauthorized Devices.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 16. DISPLAY DISCOVERED FORTIGATE
    # ============================================================

    - name: Display discovered FortiGate
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "DISCOVERED FORTIGATE"
          - "=============================================="

          - "Name        : {{ target_device.name }}"
          - "Serial      : {{ target_device.sn }}"
          - "Hostname    : {{ target_device.hostname | default('n/a') }}"
          - "IP          : {{ target_device.ip | default('n/a') }}"
          - "OID         : {{ target_device.oid }}"
          - "Platform    : {{ target_device.platform_str | default('n/a') }}"
          - "Mgmt Mode   : {{ target_device.mgmt_mode | default('n/a') }}"

          - "Target ADOM : {{ target_adom }}"
          - "Target VDOM : {{ device_vdom }}"
          - "Policy      : {{ policy_package }}"

          - "=============================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 17. DISPLAY MANAGEMENT MODE
    # ============================================================

    - name: Display FortiGate management mode
      ansible.builtin.debug:

        msg:
          - "FortiGate       : {{ target_device.name }}"
          - "Serial          : {{ target_device.sn }}"
          - "Management Mode : {{ target_device.mgmt_mode | default('undefined') }}"

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 18. AUTHORIZE FORTIGATE
    # ============================================================
    #
    # IMPORTANT:
    # Use the device NAME returned by FortiManager.
    #
    # Do not use device_serial here.
    #
    # FortiManager's GUI device name is expected by
    # promote_unreg.
    # ============================================================

    - name: Authorize FortiGate into target ADOM
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 3

          method: "exec"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvm/cmd/add/device"

              data:

                adom: "{{ target_adom }}"

                device:

                  name: "{{ target_device.name }}"

                  "device action": "promote_unreg"

                flags:
                  - create_task
                  - nonblocking

        return_content: true

      register: authorize_result

      no_log: true

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 19. VERIFY AUTHORIZE REQUEST
    # ============================================================

    - name: Verify authorize request
      ansible.builtin.assert:

        that:
          - authorize_result.json.result is defined
          - authorize_result.json.result | length > 0
          - authorize_result.json.result[0].status.code | int == 0
          - authorize_result.json.result[0].data.taskid is defined

        fail_msg: >-
          FortiManager rejected the authorize request.

          Code:
          {{
            authorize_result.json.result[0].status.code
            | default('N/A')
          }}

          Message:
          {{
            authorize_result.json.result[0].status.message
            | default('N/A')
          }}

        success_msg: >-
          FortiManager accepted the FortiGate authorize request.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 20. SAVE AUTHORIZE TASK ID
    # ============================================================

    - name: Save authorize task ID
      ansible.builtin.set_fact:

        authorize_task_id: >-
          {{
            authorize_result.json.result[0].data.taskid
          }}

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 21. DISPLAY AUTHORIZE TASK ID
    # ============================================================

    - name: Display authorize task ID
      ansible.builtin.debug:

        msg:
          - "=============================================="
          - "AUTHORIZE TASK"
          - "=============================================="
          - "Task ID : {{ authorize_task_id }}"
          - "=============================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 22. WAIT FOR AUTHORIZE TASK
    # ============================================================
    #
    # FortiManager authorization is asynchronous.
    #
    # 30 retries x 5 seconds = up to 150 seconds.
    # ============================================================

    - name: Wait for FortiManager authorize task
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 4

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/task/task/{{ authorize_task_id }}"

        return_content: true

      register: authorize_task

      until:

        - authorize_task.json.result is defined

        - authorize_task.json.result | length > 0

        - authorize_task.json.result[0].data is defined

        - >-
          (
            authorize_task.json.result[0].data.percent
            | default(0)
            | int
          ) >= 100

      retries: 30

      delay: 5

      no_log: true

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 23. DISPLAY AUTHORIZE TASK RESULT
    # ============================================================

    - name: Display authorize task result
      ansible.builtin.debug:

        msg: "{{ authorize_task.json }}"

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 24. VERIFY AUTHORIZE TASK
    # ============================================================

    - name: Verify authorize task completed
      ansible.builtin.assert:

        that:

          - authorize_task.json.result is defined

          - authorize_task.json.result | length > 0

          - >-
            (
              authorize_task.json.result[0].data.percent
              | default(0)
              | int
            ) >= 100

          - >-
            (
              authorize_task.json.result[0].data.num_err
              | default(0)
              | int
            ) == 0

        fail_msg: >-
          FortiManager authorize task did not complete successfully.

        success_msg: >-
          FortiManager authorize task completed successfully.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 25. GET DEVICES FROM TARGET ADOM
    # ============================================================
    #
    # We retry until the authorized device is actually visible
    # inside the target ADOM.
    #
    # 12 retries x 5 seconds = up to 60 seconds.
    # ============================================================

    - name: Get devices from target ADOM
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 5

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvmdb/adom/{{ target_adom }}/device"

        return_content: true

      register: target_devices

      no_log: true

      retries: 12

      delay: 5

      until:
        - target_devices.json.result is defined
        - target_devices.json.result | length > 0
        - target_devices.json.result[0].status.code | int == 0
        - >
          (
            target_devices.json.result[0].data
            | default([])
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', device_serial)
            | list
            | length
          ) > 0

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 26. VERIFY TARGET ADOM QUERY
    # ============================================================

    - name: Verify target ADOM query
      ansible.builtin.assert:

        that:

          - target_devices.json.result is defined

          - target_devices.json.result | length > 0

          - target_devices.json.result[0].status.code | int == 0

        fail_msg: >-
          Unable to query target ADOM {{ target_adom }}.

          Response:
          {{ target_devices.json }}

        success_msg: >-
          Target ADOM {{ target_adom }}
          queried successfully.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 27. FIND FORTIGATE IN TARGET ADOM
    # ============================================================

    - name: Find FortiGate in target ADOM
      ansible.builtin.set_fact:

        authorized_device: >-
          {{
            target_devices.json.result[0].data
            | default([])
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', device_serial)
            | list
            | first
            | default({})
          }}

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 28. VERIFY FORTIGATE IS IN TARGET ADOM
    # ============================================================

    - name: Verify FortiGate is in target ADOM
      ansible.builtin.assert:

        that:
          - authorized_device | length > 0

        fail_msg: >-
          FortiGate {{ device_serial }}
          was not found in ADOM {{ target_adom }}
          after authorization.

          The ADOM lookup was retried for up to 60 seconds.

        success_msg: >-
          FortiGate {{ device_serial }}
          is now present in ADOM {{ target_adom }}.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 29. DISPLAY AUTHORIZED DEVICE
    # ============================================================

    - name: Display authorized device
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "FORTIGATE AUTHORIZED"
          - "=============================================="

          - "Name   : {{ authorized_device.name }}"
          - "Serial : {{ authorized_device.sn }}"
          - "IP     : {{ authorized_device.ip | default('n/a') }}"
          - "OID    : {{ authorized_device.oid }}"
          - "ADOM   : {{ target_adom }}"

          - "=============================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 30. DETERMINE TARGET VDOM OID
    # ============================================================

    - name: Determine target VDOM OID
      ansible.builtin.set_fact:

        target_vdom_oid: >-
          {{
            (
              authorized_device.vdom
              | default([])
              | selectattr('name', 'equalto', device_vdom)
              | map(attribute='oid')
              | list
              | first
            )
            | default(3)
          }}

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 31. DISPLAY VDOM INFORMATION
    # ============================================================

    - name: Display VDOM information
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "VDOM"
          - "=============================================="

          - "VDOM     : {{ device_vdom }}"
          - "VDOM OID : {{ target_vdom_oid }}"

          - "=============================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 32. ASSIGN POLICY PACKAGE
    # ============================================================

    - name: Assign policy package
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 6

          method: "set"

          session: "{{ fmg_session }}"

          params:

            - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

              data:

                "scope member":

                  - name: "{{ authorized_device.name }}"

                    oid: "{{ authorized_device.oid | string }}"

                    vdom: "{{ device_vdom }}"

                    vdom_oid: "{{ target_vdom_oid }}"

        return_content: true

      register: policy_assignment

      no_log: true

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 33. DISPLAY POLICY ASSIGNMENT RESULT
    # ============================================================

    - name: Display policy assignment result
      ansible.builtin.debug:

        msg: "{{ policy_assignment.json }}"

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 34. VERIFY POLICY ASSIGNMENT
    # ============================================================

    - name: Verify policy package assignment
      ansible.builtin.assert:

        that:

          - policy_assignment.json.result is defined

          - policy_assignment.json.result | length > 0

          - policy_assignment.json.result[0].status.code | int == 0

        fail_msg: >-
          Policy package {{ policy_package }}
          assignment failed.

          Code:
          {{
            policy_assignment.json.result[0].status.code
            | default('N/A')
          }}

          Message:
          {{
            policy_assignment.json.result[0].status.message
            | default('N/A')
          }}

        success_msg: >-
          Policy package {{ policy_package }}
          assigned successfully.

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 35. FINAL SUMMARY
    # ============================================================

    - name: Display final Step 3 summary
      ansible.builtin.debug:

        msg:

          - "=================================================="
          - "STEP 3 - FORTIGATE AUTHORIZATION"
          - "=================================================="

          - "NetBox Asset Tag : {{ asset_tag }}"
          - "FortiGate        : {{ authorized_device.name }}"
          - "Serial           : {{ authorized_device.sn }}"

          - "Target ADOM      : {{ target_adom }}"

          - "VDOM             : {{ device_vdom }}"

          - "Policy Package   : {{ policy_package }}"

          - "Authorization    : SUCCESS"

          - "Package Assign   : SUCCESS"

          - "=================================================="

      when:
        - selected_firewall | length > 0


    # ============================================================
    # 36. LOGOUT
    # ============================================================

    - name: Logout from FortiManager
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 7

          method: "exec"

          session: "{{ fmg_session }}"

          params:

            - url: "/sys/logout"

        return_content: true

      no_log: true

      when:
        - selected_firewall | length > 0
