---
# ============================================================
# STEP 04 - FORTIGATE AUTHORIZATION + POLICY PACKAGE MAPPING
# ============================================================
#
# Source of truth:
#   NetBox asset_tag -> vars/firewalls.vars
#
# Responsibilities:
#   1. Identify the FortiGate from NetBox.
#   2. Find an unauthorized device in FMG root ADOM when needed.
#   3. Authorize it into the configured target ADOM.
#   4. Ensure the configured policy package has the FortiGate
#      as an Installation Target.
#
# Important distinction:
#   source_adom = FortiManager root ADOM
#   target_adom = FortiManager destination ADOM
#   target_vdom = FortiGate VDOM
#
# The Installation Target is the policy package "scope member".
#
# ============================================================

- name: Step 04 - FortiGate Authorization and Package Mapping
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

    source_adom: "root"

    authorization_poll_retries: 30
    authorization_poll_delay: 5

    target_verify_retries: 12
    target_verify_delay: 5

    api_timeout: 30

  tasks:

    # ==========================================================
    # 1. READ FIREWALL DATABASE
    # ==========================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ==========================================================
    # 2. SELECT FIREWALL FROM NETBOX ASSET TAG
    # ==========================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action            : SKIPPED"
          - "============================================================"
      when:
        - selected_firewall | length == 0


    - name: End unknown firewall host
      ansible.builtin.meta: end_host
      when:
        - selected_firewall | length == 0


    # ==========================================================
    # 3. VALIDATE FIREWALL DATA
    # ==========================================================

    - name: Validate selected firewall
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | length > 0
          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | length > 0
          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | length > 0
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | length > 0
          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | length > 0
        fail_msg: >-
          Firewall '{{ asset_tag }}' exists in firewalls.vars but required
          fields are missing.

          Required:
            serial
            hostname
            management_ip
            target_adom
            target_vdom
            policy_package


    # ==========================================================
    # 4. SAVE TARGET VARIABLES
    # ==========================================================

    - name: Save target parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        desired_hostname: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    - name: Display provisioning target
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE PROVISIONING TARGET"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Expected Name     : {{ desired_hostname }}"
          - "Source ADOM       : {{ source_adom }}"
          - "Target ADOM       : {{ target_adom }}"
          - "Target VDOM       : {{ target_vdom }}"
          - "Policy Package    : {{ policy_package }}"
          - "============================================================"


    # ==========================================================
    # 5. FORTIMANAGER WORKFLOW
    # ==========================================================

    - name: Execute FortiManager provisioning workflow
      block:

        # ======================================================
        # 5.1 LOGIN
        # ======================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 1
              method: "exec"
              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"
              session: null
              verbose: 1
            return_content: true
          register: fmg_login
          no_log: true


        - name: Verify FortiManager login
          ansible.builtin.assert:
            that:
              - fmg_login.status | int == 200
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined
          fail_msg: >-
            FortiManager authentication failed.


        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"
          no_log: true


        # ======================================================
        # 5.2 CHECK TARGET ADOM FIRST
        # ======================================================
        #
        # Idempotency:
        #   If the device is already in target_adom, do not promote
        #   it again.
        # ======================================================

        - name: Get devices from target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: target_adom_devices
          no_log: true


        - name: Verify target ADOM query
          ansible.builtin.assert:
            that:
              - target_adom_devices.status | int == 200
              - target_adom_devices.json.result is defined
              - target_adom_devices.json.result | length > 0
              - target_adom_devices.json.result[0].status.code | int == 0
          fail_msg: >-
            Unable to retrieve devices from target ADOM '{{ target_adom }}'.


        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        - name: Find device already authorized in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              target_adom_devices.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Determine whether authorization is needed
          ansible.builtin.set_fact:
            authorization_needed: >-
              {{
                (authorized_device | length) == 0
              }}


        - name: Display authorization state
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "AUTHORIZATION STATE"
              - "============================================================"
              - "FortiGate       : {{ device_serial }}"
              - "Target ADOM     : {{ target_adom }}"
              - "Already present : {{ not authorization_needed }}"
              - "============================================================"


        # ======================================================
        # 5.3 FIND UNAUTHORIZED DEVICE IN ROOT ADOM
        # ======================================================
        #
        # Only executed when authorization is required.
        #
        # Do not use mgmt_mode as the deciding condition. This
        # environment has already shown that the GUI state and
        # returned mgmt_mode can differ.
        # ======================================================

        - name: Get devices from root ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ source_adom }}/device"
                  loadsub: 0
            return_content: true
          register: root_devices_response
          no_log: true
          when:
            - authorization_needed


        - name: Verify root ADOM query
          ansible.builtin.assert:
            that:
              - root_devices_response.status | int == 200
              - root_devices_response.json.result is defined
              - root_devices_response.json.result | length > 0
              - root_devices_response.json.result[0].status.code | int == 0
          when:
            - authorization_needed
          fail_msg: >-
            Unable to retrieve devices from FortiManager root ADOM.


        - name: Save root ADOM devices
          ansible.builtin.set_fact:
            root_devices: >-
              {{
                root_devices_response.json.result[0].data
                | default([])
              }}
          when:
            - authorization_needed


        - name: Build normalized root device matches
          ansible.builtin.set_fact:
            root_device_matches: >-
              {%- set ns = namespace(matches=[]) -%}
              {%- for device in root_devices -%}
                {%- if device.sn is defined -%}
                  {%- if (
                    device.sn
                    | regex_replace('[^A-Za-z0-9]', '')
                    | upper
                  ) == normalized_device_serial -%}
                    {%- set ns.matches = ns.matches + [device] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.matches }}
          when:
            - authorization_needed


        - name: Verify unique unauthorized device match
          ansible.builtin.assert:
            that:
              - root_device_matches | length == 1
          when:
            - authorization_needed
          fail_msg: >-
            Expected exactly one device with serial '{{ device_serial }}'
            in FortiManager root ADOM, but found
            {{ root_device_matches | length }}.


        - name: Save unauthorized device
          ansible.builtin.set_fact:
            unauthorized_device: "{{ root_device_matches[0] }}"
          when:
            - authorization_needed


        # ======================================================
        # 5.4 AUTHORIZE
        # ======================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ target_adom }}"
                    device:
                      name: "{{ unauthorized_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
            return_content: true
          register: authorization_response
          no_log: true
          when:
            - authorization_needed


        - name: Verify authorization request
          ansible.builtin.assert:
            that:
              - authorization_response.status | int == 200
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - authorization_response.json.result[0].data.taskid is defined
          when:
            - authorization_needed
          fail_msg: >-
            FortiManager rejected authorization of '{{ device_serial }}'
            into ADOM '{{ target_adom }}'.

            Code:
            {{
              authorization_response.json.result[0].status.code
              | default('unknown')
            }}

            Message:
            {{
              authorization_response.json.result[0].status.message
              | default('unknown')
            }}


        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.taskid
              }}
          when:
            - authorization_needed


        - name: Wait for authorization task
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/task/task/{{ authorization_task_id }}"
            return_content: true
          register: authorization_task
          retries: "{{ authorization_poll_retries }}"
          delay: "{{ authorization_poll_delay }}"
          until:
            - authorization_task.json.result is defined
            - authorization_task.json.result | length > 0
            - authorization_task.json.result[0].status.code | int == 0
            - authorization_task.json.result[0].data is defined
            - authorization_task.json.result[0].data.percent | default(0) | int >= 100
          no_log: true
          when:
            - authorization_needed


        - name: Verify authorization task succeeded
          ansible.builtin.assert:
            that:
              - authorization_task.json.result[0].data.percent | default(0) | int >= 100
              - authorization_task.json.result[0].data.num_err | default(0) | int == 0
          when:
            - authorization_needed
          fail_msg: >-
            Authorization task failed for '{{ device_serial }}'.

            Task:
            {{ authorization_task_id }}

            Errors:
            {{
              authorization_task.json.result[0].data.num_err
              | default(0)
            }}

            Detail:
            {{
              authorization_task.json.result[0].data.detail
              | default('')
            }}


        # ======================================================
        # 5.5 REFRESH TARGET ADOM AND SAVE AUTHORIZED DEVICE
        # ======================================================

        - name: Get target ADOM devices after authorization
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: final_target_devices
          retries: "{{ target_verify_retries }}"
          delay: "{{ target_verify_delay }}"
          until:
            - final_target_devices.json.result is defined
            - final_target_devices.json.result | length > 0
            - final_target_devices.json.result[0].status.code | int == 0
            - >-
              (
                final_target_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) == 1
          no_log: true


        - name: Find final authorized device
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              final_target_devices.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Verify final authorized device
          ansible.builtin.assert:
            that:
              - authorized_device is defined
              - authorized_device | length > 0
            fail_msg: >-
              FortiGate '{{ device_serial }}' was not found in target
              ADOM '{{ target_adom }}'.


        # ======================================================
        # 5.6 VERIFY TARGET VDOM AND GET ITS OID
        # ======================================================

        - name: Determine target VDOM
          ansible.builtin.set_fact:
            target_vdom_objects: >-
              {{
                authorized_device.vdom
                | default([])
                | selectattr('name', 'equalto', target_vdom)
                | list
              }}


        - name: Verify target VDOM exists on FortiGate
          ansible.builtin.assert:
            that:
              - target_vdom_objects | length == 1
          fail_msg: >-
            VDOM '{{ target_vdom }}' was not found on FortiGate
            '{{ authorized_device.name }}'.

            Available VDOM data:
            {{ authorized_device.vdom | default([]) }}


        - name: Save target VDOM OID
          ansible.builtin.set_fact:
            target_vdom_oid: "{{ target_vdom_objects[0].oid }}"


        - name: Display authorized device details
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "AUTHORIZED FORTIGATE"
              - "============================================================"
              - "FortiGate         : {{ authorized_device.name }}"
              - "Serial            : {{ authorized_device.sn }}"
              - "Device OID        : {{ authorized_device.oid }}"
              - "Target ADOM       : {{ target_adom }}"
              - "Target VDOM       : {{ target_vdom }}"
              - "VDOM OID          : {{ target_vdom_oid }}"
              - "Policy Package    : {{ policy_package }}"
              - "============================================================"


        # ======================================================
        # 5.7 GET POLICY PACKAGE
        # ======================================================

        - name: Get configured policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 7
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: policy_package_response


        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - policy_package_response.status | int == 200
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name == policy_package
          fail_msg: >-
            Policy package '{{ policy_package }}' was not found in
            ADOM '{{ target_adom }}'.


        - name: Save policy package state
          ansible.builtin.set_fact:
            current_policy_package: >-
              {{
                policy_package_response.json.result[0].data
              }}


        # ======================================================
        # 5.8 CHECK CURRENT INSTALLATION TARGETS
        # ======================================================

        - name: Save current package scope members
          ansible.builtin.set_fact:
            current_scope_members: >-
              {{
                current_policy_package['scope member']
                | default([])
              }}


        - name: Determine whether target already exists
          ansible.builtin.set_fact:
            installation_target_exists: >-
              {{
                (
                  current_scope_members
                  | selectattr('name', 'defined')
                  | selectattr('vdom', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) == 1
              }}


        - name: Display current policy package scope
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "POLICY PACKAGE CURRENT STATE"
              - "============================================================"
              - "ADOM            : {{ target_adom }}"
              - "Policy Package  : {{ policy_package }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "Target VDOM     : {{ target_vdom }}"
              - "Existing Scope  : {{ current_scope_members }}"
              - "Target Exists   : {{ installation_target_exists }}"
              - "============================================================"


        # ======================================================
        # 5.9 CASE A - EMPTY SCOPE
        # ======================================================
        #
        # This is the important case for your current lab.
        #
        # We use SET on the package object and reproduce the
        # GUI-style scope member structure including OID values.
        #
        # This avoids the problem where the package exists but
        # the GUI Installation Targets table remains empty.
        #
        # ======================================================

        - name: Create first policy package Installation Target
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 8
              method: "set"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
                  data:
                    "scope member":
                      - name: "{{ authorized_device.name }}"
                        oid: "{{ authorized_device.oid | string }}"
                        vdom: "{{ target_vdom }}"
                        vdom_oid: "{{ target_vdom_oid | string }}"
            return_content: true
          register: create_first_installation_target
          when:
            - not installation_target_exists
            - current_scope_members | length == 0


        - name: Verify first Installation Target request
          ansible.builtin.assert:
            that:
              - create_first_installation_target.status | int == 200
              - create_first_installation_target.json.result is defined
              - create_first_installation_target.json.result | length > 0
              - create_first_installation_target.json.result[0].status.code | int == 0
          when:
            - not installation_target_exists
            - current_scope_members | length == 0
          fail_msg: >-
            Failed to create the first Installation Target for
            policy package '{{ policy_package }}'.

            Code:
            {{
              create_first_installation_target.json.result[0].status.code
              | default('unknown')
            }}

            Message:
            {{
              create_first_installation_target.json.result[0].status.message
              | default('unknown')
            }}


        # ======================================================
        # 5.10 CASE B - SCOPE ALREADY EXISTS BUT TARGET MISSING
        # ======================================================
        #
        # Preserve existing targets. Use documented ADD operation
        # instead of overwriting the package scope.
        # ======================================================

        - name: Add Installation Target to existing package scope
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 9
              method: "add"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}/scope member"
                  data:
                    name: "{{ authorized_device.name }}"
                    vdom: "{{ target_vdom }}"
            return_content: true
          register: add_installation_target
          when:
            - not installation_target_exists
            - current_scope_members | length > 0


        - name: Verify additional Installation Target request
          ansible.builtin.assert:
            that:
              - add_installation_target.status | int == 200
              - add_installation_target.json.result is defined
              - add_installation_target.json.result | length > 0
              - add_installation_target.json.result[0].status.code | int == 0
          when:
            - not installation_target_exists
            - current_scope_members | length > 0
          fail_msg: >-
            Failed to add '{{ authorized_device.name }}/{{ target_vdom }}'
            to the Installation Targets of policy package
            '{{ policy_package }}'.

            Code:
            {{
              add_installation_target.json.result[0].status.code
              | default('unknown')
            }}

            Message:
            {{
              add_installation_target.json.result[0].status.message
              | default('unknown')
            }}


        # ======================================================
        # 5.11 RE-READ PACKAGE - AUTHORITATIVE VERIFICATION
        # ======================================================

        - name: Re-read policy package after Installation Target update
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 10
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: policy_package_after_target
          retries: 10
          delay: 3
          until:
            - policy_package_after_target.json.result is defined
            - policy_package_after_target.json.result | length > 0
            - policy_package_after_target.json.result[0].status.code | int == 0
            - >-
              (
                policy_package_after_target.json.result[0].data['scope member']
                | default([])
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device.name)
                | selectattr('vdom', 'equalto', target_vdom)
                | list
                | length
              ) == 1


        - name: Display final Installation Target state
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "INSTALLATION TARGET VERIFICATION"
              - "============================================================"
              - "ADOM            : {{ target_adom }}"
              - "Policy Package  : {{ policy_package }}"
              - "FortiGate       : {{ authorized_device.name }}"
              - "VDOM            : {{ target_vdom }}"
              - "Scope Member    : {{ policy_package_after_target.json.result[0].data['scope member'] | default([]) }}"
              - "============================================================"


        - name: Verify Installation Target
          ansible.builtin.assert:
            that:
              - >-
                (
                  policy_package_after_target.json.result[0].data['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('vdom', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) == 1

            fail_msg: >-
              The FortiGate is still not assigned as an Installation Target
              of policy package '{{ policy_package }}'.

            success_msg: >-
              FortiGate '{{ authorized_device.name }}/{{ target_vdom }}'
              is confirmed as an Installation Target of
              policy package '{{ policy_package }}'.


        # ======================================================
        # 5.12 FINAL RESULT
        # ======================================================

        - name: Display final result
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "STEP 04 - COMPLETED"
              - "============================================================"
              - "NetBox Asset Tag   : {{ asset_tag }}"
              - "FortiGate          : {{ authorized_device.name }}"
              - "Serial             : {{ authorized_device.sn }}"
              - "Target ADOM        : {{ target_adom }}"
              - "Target VDOM        : {{ target_vdom }}"
              - "Policy Package     : {{ policy_package }}"
              - "Authorization      : SUCCESS"
              - "Installation Target: SUCCESS"
              - "============================================================"


      # ==========================================================
      # 6. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 99
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/sys/logout"
            return_content: true
          when:
            - fmg_session is defined
          failed_when: false
          no_log: true
