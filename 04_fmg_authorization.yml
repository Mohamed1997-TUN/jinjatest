---
- name: Step 3 - Authorize FortiGate in FortiManager
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:

    # ============================================================
    # FORTIMANAGER
    # ============================================================

    fmg_validate_certs: false

    # Unauthorized/unregistered devices always land in root, this
    # is only used for the initial lookup
    source_adom: "root"

    # Destination ADOM - the device is authorized directly into
    # this ADOM, no intermediate move step needed
    target_adom: "dhia"


    # ============================================================
    # FORTIGATE
    # ============================================================

    device_serial: "FGVMEVP1_E5VM0ED"

    device_vdom: "root"


    # ============================================================
    # POLICY PACKAGE
    # ============================================================

    policy_package: "dhia_staline"


  tasks:

    # ============================================================
    # 1. LOGIN TO FORTIMANAGER
    # ============================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:
          id: 1
          method: "exec"

          params:
            - url: "/sys/login/user"

              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"

        return_content: true

      register: fmg_login

      no_log: true


    # ============================================================
    # 2. VERIFY LOGIN
    # ============================================================

    - name: Verify FortiManager authentication
      ansible.builtin.assert:

        that:
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined

        fail_msg: "FortiManager authentication failed."

        success_msg: "FortiManager authentication successful."


    # ============================================================
    # 3. SAVE SESSION
    # ============================================================

    - name: Save FortiManager session
      ansible.builtin.set_fact:

        fmg_session: "{{ fmg_login.json.session }}"

      no_log: true


    # ============================================================
    # 4. FIND TARGET FORTIGATE (GLOBAL DEVICE TABLE)
    #
    # Unauthorized devices can drop out of the ADOM-scoped
    # /dvmdb/adom/<adom>/device listing if they're flagged hidden
    # (Device Manager > "Display Hidden Devices"). Querying the
    # global /dvmdb/device table filtered by serial is the
    # documented way to look up a device before authorization.
    #
    # ============================================================

    - name: Find target FortiGate by serial
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 2

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvmdb/device"

              filter:
                - "sn"
                - "=="
                - "{{ device_serial }}"

        return_content: true

      register: device_lookup

      no_log: true


    # ============================================================
    # 5. EXTRACT TARGET FORTIGATE
    # ============================================================

    - name: Extract target FortiGate
      ansible.builtin.set_fact:

        target_device: >-
          {{
            (device_lookup.json.result[0].data | default([]))
            | first
            | default({})
          }}


    # ============================================================
    # 6. VERIFY TARGET FORTIGATE
    # ============================================================

    - name: Verify target FortiGate exists
      ansible.builtin.assert:

        that:
          - target_device | length > 0

        fail_msg: >-
          FortiGate {{ device_serial }}
          was not found via /dvmdb/device.

          If it's showing under "Display Hidden Devices" in the
          GUI, it may be hidden at the database level - authorize
          it once via the GUI to clear that state, then re-run.

        success_msg: >-
          FortiGate {{ device_serial }}
          was found.


    # ============================================================
    # 7. DISPLAY DISCOVERED FORTIGATE
    # ============================================================

    - name: Display discovered FortiGate
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "DISCOVERED FORTIGATE"
          - "=============================================="

          - "Name        : {{ target_device.name }}"
          - "Serial      : {{ target_device.sn }}"
          - "Hostname    : {{ target_device.hostname | default('n/a') }}"
          - "IP          : {{ target_device.ip | default('n/a') }}"
          - "OID         : {{ target_device.oid }}"
          - "Platform    : {{ target_device.platform_str | default('n/a') }}"
          - "Mgmt Mode   : {{ target_device.mgmt_mode }}"

          - "Target ADOM : {{ target_adom }}"

          - "=============================================="


    # ============================================================
    # 8. AUTHORIZE FORTIGATE DIRECTLY INTO TARGET ADOM
    #
    # /dvm/cmd/add/device with "device action": "promote_unreg"
    # authorizes an already-connected, currently-unauthorized
    # device straight into the ADOM given in "adom" - matches the
    # GUI's "Authorize Device" > "Add to ADOM: dhia" flow exactly.
    #
    # No adm_usr/adm_pass needed here since the FortiGate already
    # trusts this FortiManager (it has an active FGFM tunnel and
    # shows up in Unauthorized Devices already). Add them back in
    # if this FortiManager isn't yet trusted by the device.
    #
    # ============================================================

    - name: Authorize FortiGate into target ADOM
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 3

          method: "exec"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvm/cmd/add/device"

              data:

                adom: "{{ target_adom }}"

                device:

                  name: "{{ target_device.name }}"

                  "device action": "promote_unreg"

                flags:
                  - create_task
                  - nonblocking

        return_content: true

      register: authorize_result

      no_log: true


    # ============================================================
    # 9. VERIFY AUTHORIZE REQUEST
    # ============================================================

    - name: Verify authorize request
      ansible.builtin.assert:

        that:
          - authorize_result.json.result is defined
          - authorize_result.json.result | length > 0
          - authorize_result.json.result[0].status.code | int == 0
          - authorize_result.json.result[0].data.taskid is defined

        fail_msg: >-
          FortiManager rejected the authorize request.

          Code:
          {{
            authorize_result.json.result[0].status.code
            | default('N/A')
          }}

          Message:
          {{
            authorize_result.json.result[0].status.message
            | default('N/A')
          }}

        success_msg: >-
          FortiManager accepted the FortiGate authorize request.


    # ============================================================
    # 10. SAVE AUTHORIZE TASK ID
    # ============================================================

    - name: Save authorize task ID
      ansible.builtin.set_fact:

        authorize_task_id: >-
          {{
            authorize_result.json.result[0].data.taskid
          }}


    # ============================================================
    # 11. DISPLAY AUTHORIZE TASK ID
    # ============================================================

    - name: Display authorize task ID
      ansible.builtin.debug:

        msg:
          - "=============================================="
          - "AUTHORIZE TASK"
          - "=============================================="
          - "Task ID : {{ authorize_task_id }}"
          - "=============================================="


    # ============================================================
    # 12. WAIT FOR AUTHORIZE TASK
    # ============================================================

    - name: Wait for FortiManager authorize task
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 4

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/task/task/{{ authorize_task_id }}"

        return_content: true

      register: authorize_task

      until:

        - authorize_task.json.result is defined

        - authorize_task.json.result | length > 0

        - authorize_task.json.result[0].data is defined

        - >
          (
            authorize_task.json.result[0].data.percent
            | default(0)
            | int
          ) >= 100

      retries: 30

      delay: 5

      no_log: true


    # ============================================================
    # 13. DISPLAY AUTHORIZE TASK RESULT
    # ============================================================

    - name: Display authorize task result
      ansible.builtin.debug:

        msg: "{{ authorize_task.json }}"


    # ============================================================
    # 14. VERIFY AUTHORIZE TASK
    # ============================================================

    - name: Verify authorize task completed
      ansible.builtin.assert:

        that:

          - authorize_task.json.result is defined

          - authorize_task.json.result | length > 0

          - >
            (
              authorize_task.json.result[0].data.percent
              | default(0)
              | int
            ) >= 100

          - >
            (
              authorize_task.json.result[0].data.num_err
              | default(0)
              | int
            ) == 0

        fail_msg: >-
          FortiManager authorize task did not complete successfully.

        success_msg: >-
          FortiManager authorize task completed successfully.


    # ============================================================
    # 15. WAIT FOR DVM CACHE SYNCHRONIZATION
    # ============================================================

    - name: Wait for DVM cache synchronization
      ansible.builtin.pause:

        seconds: 5


    # ============================================================
    # 16. GET DEVICES FROM TARGET ADOM
    # ============================================================

    - name: Get devices from target ADOM
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 5

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvmdb/adom/{{ target_adom }}/device"

        return_content: true

      register: target_devices

      no_log: true


    # ============================================================
    # 17. VERIFY TARGET ADOM QUERY
    # ============================================================

    - name: Verify target ADOM query
      ansible.builtin.assert:

        that:
          - target_devices.json.result is defined
          - target_devices.json.result | length > 0
          - target_devices.json.result[0].status.code | int == 0

        fail_msg: >-
          Unable to query target ADOM {{ target_adom }}.

        success_msg: >-
          Target ADOM {{ target_adom }} queried successfully.


    # ============================================================
    # 18. FIND FORTIGATE IN TARGET ADOM
    # ============================================================

    - name: Find FortiGate in target ADOM
      ansible.builtin.set_fact:

        authorized_device: >-
          {{
            target_devices.json.result[0].data
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', device_serial)
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 19. VERIFY FORTIGATE IS IN TARGET ADOM
    # ============================================================

    - name: Verify FortiGate is in target ADOM
      ansible.builtin.assert:

        that:
          - authorized_device | length > 0

        fail_msg: >-
          FortiGate {{ device_serial }}
          was not found in ADOM {{ target_adom }}
          after authorization.

        success_msg: >-
          FortiGate {{ device_serial }}
          is now present in ADOM {{ target_adom }}.


    # ============================================================
    # 20. DISPLAY AUTHORIZED DEVICE
    # ============================================================

    - name: Display authorized device
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "FORTIGATE AUTHORIZED"
          - "=============================================="

          - "Name   : {{ authorized_device.name }}"
          - "Serial : {{ authorized_device.sn }}"
          - "IP     : {{ authorized_device.ip }}"
          - "OID    : {{ authorized_device.oid }}"
          - "ADOM   : {{ target_adom }}"

          - "=============================================="


    # ============================================================
    # 21. DETERMINE VDOM OID
    # ============================================================

    - name: Determine target VDOM OID
      ansible.builtin.set_fact:

        target_vdom_oid: >-
          {{
            (
              authorized_device.vdom
              | selectattr('name', 'equalto', device_vdom)
              | map(attribute='oid')
              | list
              | first
            )
            | default(3)
          }}


    # ============================================================
    # 22. DISPLAY VDOM INFORMATION
    # ============================================================

    - name: Display VDOM information
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "VDOM"
          - "=============================================="

          - "VDOM     : {{ device_vdom }}"
          - "VDOM OID : {{ target_vdom_oid }}"

          - "=============================================="


    # ============================================================
    # 23. ASSIGN POLICY PACKAGE
    #
    # GUI captured:
    #
    # pm/pkg/adom/dhia/dhia_staline
    #
    # scope member:
    #   name
    #   oid
    #   vdom
    #   vdom_oid
    #
    # ============================================================

    - name: Assign policy package
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 6

          method: "set"

          session: "{{ fmg_session }}"

          params:

            - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

              data:

                "scope member":

                  - name: "{{ authorized_device.name }}"

                    oid: "{{ authorized_device.oid | string }}"

                    vdom: "{{ device_vdom }}"

                    vdom_oid: "{{ target_vdom_oid }}"

        return_content: true

      register: policy_assignment

      no_log: true


    # ============================================================
    # 24. DISPLAY POLICY ASSIGNMENT RESULT
    # ============================================================

    - name: Display policy assignment result
      ansible.builtin.debug:

        msg: "{{ policy_assignment.json }}"


    # ============================================================
    # 25. VERIFY POLICY ASSIGNMENT
    # ============================================================

    - name: Verify policy package assignment
      ansible.builtin.assert:

        that:
          - policy_assignment.json.result is defined
          - policy_assignment.json.result | length > 0
          - policy_assignment.json.result[0].status.code | int == 0

        fail_msg: >-
          Policy package {{ policy_package }}
          assignment failed.

          Code:
          {{
            policy_assignment.json.result[0].status.code
            | default('N/A')
          }}

          Message:
          {{
            policy_assignment.json.result[0].status.message
            | default('N/A')
          }}

        success_msg: >-
          Policy package {{ policy_package }}
          assigned successfully.


    # ============================================================
    # 26. FINAL SUMMARY
    # ============================================================

    - name: Display final Step 3 summary
      ansible.builtin.debug:

        msg:

          - "=================================================="
          - "STEP 3 - FORTIGATE AUTHORIZATION"
          - "=================================================="

          - "FortiGate       : {{ authorized_device.name }}"
          - "Serial          : {{ authorized_device.sn }}"

          - "Target ADOM     : {{ target_adom }}"

          - "VDOM            : {{ device_vdom }}"
          - "Policy Package  : {{ policy_package }}"

          - "Authorization   : SUCCESS"
          - "Package Assign  : SUCCESS"

          - "=================================================="


    # ============================================================
    # 27. LOGOUT
    # ============================================================

    - name: Logout from FortiManager
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 7

          method: "exec"

          session: "{{ fmg_session }}"

          params:

            - url: "/sys/logout"

        return_content: true

      no_log: true