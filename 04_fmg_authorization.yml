---
- name: Step 3 - Authorize FortiGate in FortiManager
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action           : SKIPPED"
          - "=============================================="

      when:
        - selected_firewall | length == 0


    - name: End host for unknown firewall
      ansible.builtin.meta: end_host

      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE REQUIRED DATA
    # ============================================================

    - name: Validate selected firewall
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
          - selected_firewall.target_adom is defined
          - selected_firewall.target_vdom is defined
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | length > 0

        fail_msg: >-
          Firewall {{ asset_tag }}
          exists in firewalls.vars but one or more required fields
          are missing.

          Required:
          serial
          hostname
          management_ip
          target_adom

        success_msg: >-
          Firewall {{ selected_firewall.serial }}
          contains all authorization parameters.


    # ============================================================
    # 5. SAVE TARGET PARAMETERS
    # ============================================================

    - name: Save target FortiGate parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        device_name: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    # ============================================================
    # 6. NORMALIZE SERIAL
    # ============================================================
    #
    # NetBox:
    #   FGVMEVP1E5VM0ED
    #
    # FortiManager:
    #   FGVMEVP1_E5VM0ED
    #
    # The normalization is used only for comparison.
    # ============================================================

    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    # ============================================================
    # 7. DISPLAY TARGET
    # ============================================================

    - name: Display authorization target
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE AUTHORIZATION TARGET"
          - "=============================================="
          - "NetBox Asset Tag  : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Normalized Serial : {{ normalized_device_serial }}"
          - "Hostname          : {{ device_name }}"
          - "Management IP     : {{ selected_firewall.management_ip }}"
          - "Target ADOM       : {{ target_adom }}"
          - "=============================================="


    # ============================================================
    # 8. FORTIMANAGER WORKFLOW
    # ============================================================

    - name: Execute FortiManager authorization workflow
      block:

        # ========================================================
        # 8.1 LOGIN
        # ========================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            status_code: "{{ range(200, 600) | list }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 1
              method: "exec"

              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"

            return_content: true

          register: fmg_login
          failed_when: false
          no_log: true


        # ========================================================
        # 8.2 DIAGNOSE LOGIN RESULT
        # ========================================================

        - name: Display safe FortiManager login diagnostics
          ansible.builtin.debug:
            msg:
              - "=============================================================="
              - "FORTIMANAGER LOGIN DIAGNOSTICS"
              - "=============================================================="
              - "Execution controller : 127.0.0.1"
              - "FortiManager         : {{ fortimanager_host }}"
              - "HTTP status          : {{ fmg_login.status | default('NO_HTTP_RESPONSE') }}"
              - >-
                JSON-RPC code:
                {{
                  fmg_login.json.result[0].status.code
                  | default('NO_JSONRPC_CODE')
                }}
              - >-
                JSON-RPC message:
                {{
                  fmg_login.json.result[0].status.message
                  | default(fmg_login.msg | default('NO_MESSAGE'))
                }}
              - "Session received     : {{ fmg_login.json.session is defined }}"
              - "=============================================================="

        # ========================================================
        # 8.3 VERIFY LOGIN
        # ========================================================

        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined

            fail_msg: "FortiManager authentication failed."

            success_msg: "FortiManager authentication successful."


        # ========================================================
        # 8.4 SAVE SESSION
        # ========================================================

        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"

          no_log: true


        # ========================================================
        # 8.5 CHECK IF ALREADY AUTHORIZED
        # ========================================================

        - name: Check target ADOM for existing FortiGate
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"

            return_content: true

          register: target_adom_devices
          no_log: true


        # ========================================================
        # 8.6 INITIALIZE AUTHORIZED DEVICE
        # ========================================================

        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        # ========================================================
        # 8.7 FIND DEVICE IN TARGET ADOM
        # ========================================================

        - name: Find existing FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"

          loop: >-
            {{
              target_adom_devices.json.result[0].data
              | default([])
            }}

          when:
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.8 DISPLAY ALREADY AUTHORIZED
        # ========================================================

        - name: Display already authorized FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE ALREADY AUTHORIZED"
              - "=============================================="
              - "Device Name : {{ authorized_device.name }}"
              - "Serial      : {{ authorized_device.sn }}"
              - "ADOM        : {{ target_adom }}"
              - "Action      : AUTHORIZATION SKIPPED"
              - "=============================================="

          when:
            - authorized_device | length > 0


        # ========================================================
        # 8.9 GET GLOBAL DVM DATABASE
        # ========================================================

        - name: Get FortiGates from global DVM database
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/device"

                  fields:
                    - "name"
                    - "sn"
                    - "oid"
                    - "mgmt_mode"
                    - "ip"
                    - "hostname"
                    - "platform_str"

                  loadsub: 0

            return_content: true

          register: all_devices
          no_log: true

          retries: 12
          delay: 5

          until:
            - all_devices.json.result is defined
            - all_devices.json.result | length > 0
            - all_devices.json.result[0].status.code | int == 0
            - >
              (
                all_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.10 INITIALIZE TARGET DEVICE
        # ========================================================

        - name: Initialize target device
          ansible.builtin.set_fact:
            target_device: {}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.11 FIND TARGET DEVICE
        # ========================================================

        - name: Find target FortiGate in DVM database
          ansible.builtin.set_fact:
            target_device: "{{ item }}"

          loop: >-
            {{
              all_devices.json.result[0].data
              | default([])
            }}

          when:
            - authorized_device | length == 0
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.12 VERIFY TARGET DEVICE
        # ========================================================

        - name: Verify target FortiGate exists
          ansible.builtin.assert:
            that:
              - target_device | length > 0

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in the FortiManager DVM database.

            success_msg: >-
              FortiGate {{ device_serial }}
              was found in the FortiManager DVM database.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.13 DISPLAY DEVICE
        # ========================================================

        - name: Display discovered FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE READY FOR AUTHORIZATION"
              - "=============================================="
              - "FortiManager Name : {{ target_device.name }}"
              - "FortiManager Serial: {{ target_device.sn }}"
              - "IP                : {{ target_device.ip | default('n/a') }}"
              - "OID               : {{ target_device.oid }}"
              - "Target ADOM       : {{ target_adom }}"
              - "=============================================="

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.14 AUTHORIZE / PROMOTE DEVICE
        # ========================================================
        #
        # The device name is taken from FortiManager.
        # ========================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvm/cmd/add/device"

                  data:
                    adom: "{{ target_adom }}"

                    device:
                      name: "{{ target_device.name }}"
                      "device action": "promote_unreg"

                    flags:
                      - create_task
                      - nonblocking

            return_content: true

          register: authorize_result
          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.15 VERIFY AUTHORIZATION REQUEST
        # ========================================================

        - name: Verify authorization request
          ansible.builtin.assert:
            that:
              - authorize_result.json.result is defined
              - authorize_result.json.result | length > 0
              - authorize_result.json.result[0].status.code | int == 0
              - authorize_result.json.result[0].data.taskid is defined

            fail_msg: >-
              FortiManager rejected the authorization request.

              Code:
              {{
                authorize_result.json.result[0].status.code
                | default('N/A')
              }}

              Message:
              {{
                authorize_result.json.result[0].status.message
                | default('N/A')
              }}

            success_msg: >-
              FortiManager accepted the authorization request.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.16 SAVE TASK ID
        # ========================================================

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorize_task_id: >-
              {{
                authorize_result.json.result[0].data.taskid
              }}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.17 DISPLAY TASK
        # ========================================================

        - name: Display authorization task ID
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "AUTHORIZATION TASK"
              - "=============================================="
              - "Task ID : {{ authorize_task_id }}"
              - "=============================================="

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.18 POLL AUTHORIZATION TASK
        # ========================================================

        - name: Wait for FortiManager authorization task
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/task/task/{{ authorize_task_id }}"

            return_content: true

          register: authorize_task

          retries: 30
          delay: 5

          until:
            - authorize_task.json.result is defined
            - authorize_task.json.result | length > 0
            - authorize_task.json.result[0].data is defined
            - >
              (
                authorize_task.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100

          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.19 VERIFY AUTHORIZATION TASK
        # ========================================================

        - name: Verify authorization task completed
          ansible.builtin.assert:
            that:
              - authorize_task.json.result is defined
              - authorize_task.json.result | length > 0
              - >
                (
                  authorize_task.json.result[0].data.percent
                  | default(0)
                  | int
                ) >= 100
              - >
                (
                  authorize_task.json.result[0].data.num_err
                  | default(0)
                  | int
                ) == 0

            fail_msg: >-
              FortiManager authorization task failed.

            success_msg: >-
              FortiManager authorization task completed successfully.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.20 VERIFY DEVICE IN TARGET ADOM
        # ========================================================
        #
        # No VDOM logic here.
        #
        # We simply verify that the device itself reached
        # the target ADOM.
        #
        # 12 retries x 5 seconds = up to 60 seconds.
        # ========================================================

        - name: Wait for FortiGate to appear in target ADOM
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"

            return_content: true

          register: target_adom_devices_after_auth

          retries: 12
          delay: 5

          until:
            - target_adom_devices_after_auth.json.result is defined
            - target_adom_devices_after_auth.json.result | length > 0
            - target_adom_devices_after_auth.json.result[0].status.code | int == 0
            - >
              (
                target_adom_devices_after_auth.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.21 FIND FINAL DEVICE
        # ========================================================

        - name: Initialize final authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        - name: Find authorized FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"

          loop: >-
            {{
              target_adom_devices_after_auth.json.result[0].data
              | default([])
            }}

          when:
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.22 VERIFY FINAL DEVICE
        # ========================================================

        - name: Verify FortiGate authorization
          ansible.builtin.assert:
            that:
              - authorized_device | length > 0

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in target ADOM {{ target_adom }}
              after authorization.

            success_msg: >-
              FortiGate {{ device_serial }}
              is successfully authorized in ADOM {{ target_adom }}.


        # ========================================================
        # 8.23 ENSURE POLICY PACKAGE INSTALLATION TARGET
        # ========================================================
        #
        # IMPORTANT:
        # FortiManager represents a package Installation Target
        # through the package "scope member" table.
        #
        # The FortiManager API expects the scope-member data as a LIST:
        #
        #   data:
        #     - name: "<device>"
        #       vdom: "<vdom>"
        #
        # This is deliberately handled here, immediately after
        # authorization, so Step 06 can install the package later.
        # ========================================================

        - name: Get target policy package
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json

            body:
              id: 8
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

            return_content: true

          register: target_policy_package

          failed_when:
            - target_policy_package.status != 200
            - target_policy_package.json.result is not defined
            - target_policy_package.json.result | length == 0
            - target_policy_package.json.result[0].status.code | int != 0


        - name: Display target policy package state
          ansible.builtin.debug:
            msg:
              - "=============================================================="
              - "POLICY PACKAGE STATE"
              - "=============================================================="
              - "ADOM            : {{ target_adom }}"
              - "Policy package  : {{ policy_package }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "VDOM            : {{ target_vdom }}"
              - >-
                Current scope member:
                {{
                  target_policy_package.json.result[0].data['scope member']
                  | default([])
                }}
              - "=============================================================="


        - name: Verify target policy package exists
          ansible.builtin.assert:
            that:
              - target_policy_package.json.result[0].data is defined
              - target_policy_package.json.result[0].data.name == policy_package

            fail_msg: >-
              Policy package '{{ policy_package }}' was not found
              in ADOM '{{ target_adom }}'.

              The authorization step cannot create an Installation Target
              for a package that does not exist.

            success_msg: >-
              Policy package '{{ policy_package }}' exists in
              ADOM '{{ target_adom }}'.


        - name: Determine whether Installation Target already exists
          ansible.builtin.set_fact:
            installation_target_exists: >-
              {{
                (
                  target_policy_package.json.result[0].data['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('vdom', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) > 0
              }}


        - name: Display Installation Target decision
          ansible.builtin.debug:
            msg:
              - "=============================================================="
              - "INSTALLATION TARGET DECISION"
              - "=============================================================="
              - "Policy package  : {{ policy_package }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "VDOM            : {{ target_vdom }}"
              - "Already exists  : {{ installation_target_exists }}"
              - >-
                Action:
                {{
                  'SKIP - target already exists'
                  if installation_target_exists
                  else 'ADD - target is missing'
                }}
              - "=============================================================="


        - name: Add FortiGate to policy package Installation Targets
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json

            body:
              id: 9
              method: "add"
              session: "{{ fmg_session }}"

              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}/scope member"
                  data:
                    - name: "{{ authorized_device.name }}"
                      vdom: "{{ target_vdom }}"

            return_content: true

          register: add_installation_target

          when:
            - not installation_target_exists

          failed_when:
            - add_installation_target.status != 200
            - add_installation_target.json.result is not defined
            - add_installation_target.json.result | length == 0
            - add_installation_target.json.result[0].status.code | int != 0


        - name: Display Installation Target add response
          ansible.builtin.debug:
            msg:
              - "=============================================================="
              - "INSTALLATION TARGET API RESPONSE"
              - "=============================================================="
              - "FortiGate        : {{ authorized_device.name }}"
              - "VDOM            : {{ target_vdom }}"
              - "Policy package  : {{ policy_package }}"
              - >-
                Status code:
                {{
                  add_installation_target.json.result[0].status.code
                  | default('SKIPPED')
                }}
              - >-
                Status message:
                {{
                  add_installation_target.json.result[0].status.message
                  | default('SKIPPED')
                }}
              - "=============================================================="

          when:
            - not installation_target_exists


        - name: Re-read policy package after Installation Target update
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json

            body:
              id: 10
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

            return_content: true

          register: policy_package_after_target

          retries: 10
          delay: 3

          until:
            - policy_package_after_target.json.result is defined
            - policy_package_after_target.json.result | length > 0
            - policy_package_after_target.json.result[0].status.code | int == 0
            - >
              (
                policy_package_after_target.json.result[0].data['scope member']
                | default([])
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device.name)
                | selectattr('vdom', 'equalto', target_vdom)
                | list
                | length
              ) > 0


        - name: Verify Installation Target exists in FortiManager
          ansible.builtin.assert:
            that:
              - policy_package_after_target.json.result[0].data is defined
              - >
                (
                  policy_package_after_target.json.result[0].data['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('vdom', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) > 0

            fail_msg: >-
              FortiGate '{{ authorized_device.name }}'
              with VDOM '{{ target_vdom }}' is still not present
              in the Installation Targets of policy package
              '{{ policy_package }}'.

            success_msg: >-
              FortiGate '{{ authorized_device.name }}/{{ target_vdom }}'
              is confirmed as an Installation Target of policy package
              '{{ policy_package }}'.


        # ========================================================
        # 8.24 DISPLAY FINAL RESULT
        # ========================================================

        - name: Display authorization result
          ansible.builtin.debug:
            msg:
              - "=================================================="
              - "STEP 03 - FORTIGATE AUTHORIZATION + PACKAGE TARGET"
              - "=================================================="
              - "NetBox Asset Tag : {{ asset_tag }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "Serial           : {{ authorized_device.sn }}"
              - "OID              : {{ authorized_device.oid }}"
              - "Target ADOM      : {{ target_adom }}"
              - "Policy Package   : {{ policy_package }}"
              - "Installation Target: {{ authorized_device.name }}/{{ target_vdom }}"
              - "Authorization    : SUCCESS"
              - "Package Target   : SUCCESS"
              - "=================================================="


      # ==========================================================
      # 9. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            delegate_to: 127.0.0.1
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 7
              method: "exec"
              session: "{{ fmg_session }}"

              params:
                - url: "/sys/logout"

            return_content: true

          no_log: true

          when:
            - fmg_session is defined
