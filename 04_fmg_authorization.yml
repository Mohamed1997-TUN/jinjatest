---
- name: Step 04 - Authorize FortiGate and synchronize Installation Target
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action           : SKIPPED"
          - "=============================================="
      when:
        - selected_firewall | length == 0

    - name: End host for unknown firewall
      ansible.builtin.meta: end_host
      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE REQUIRED DATA
    # ============================================================

    - name: Validate selected firewall
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
          - selected_firewall.target_adom is defined
          - selected_firewall.target_vdom is defined
          - selected_firewall.policy_package is defined
          - selected_firewall.serial | string | length > 0
          - selected_firewall.hostname | string | length > 0
          - selected_firewall.management_ip | string | length > 0
          - selected_firewall.target_adom | string | length > 0
          - selected_firewall.target_vdom | string | length > 0
          - selected_firewall.policy_package | string | length > 0
        fail_msg: >-
          Firewall {{ asset_tag }} exists in firewalls.vars but one or more
          required fields are missing.

          Required:
          serial
          hostname
          management_ip
          target_adom
          target_vdom
          policy_package
        success_msg: >-
          Firewall {{ selected_firewall.serial }} contains all
          authorization and installation-target parameters.


    # ============================================================
    # 5. SAVE TARGET PARAMETERS
    # ============================================================

    - name: Save target FortiGate parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        device_name: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"
        expected_management_ip: "{{ selected_firewall.management_ip }}"


    # ============================================================
    # 6. NORMALIZE SERIAL
    # ============================================================

    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    # ============================================================
    # 7. DISPLAY TARGET
    # ============================================================

    - name: Display authorization target
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE AUTHORIZATION TARGET"
          - "=============================================="
          - "NetBox Asset Tag  : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Normalized Serial : {{ normalized_device_serial }}"
          - "Hostname          : {{ device_name }}"
          - "Management IP     : {{ expected_management_ip }}"
          - "Target ADOM       : {{ target_adom }}"
          - "Target VDOM       : {{ target_vdom }}"
          - "Policy Package    : {{ policy_package }}"
          - "=============================================="


    # ============================================================
    # 8. FORTIMANAGER WORKFLOW
    # ============================================================

    - name: Execute FortiManager authorization workflow
      block:

        # ========================================================
        # 8.1 LOGIN
        # ========================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 1
              method: "exec"
              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"
            return_content: true
          register: fmg_login
          no_log: true


        # ========================================================
        # 8.2 VERIFY LOGIN
        # ========================================================

        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.status | int == 200
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined
              - fmg_login.json.session | string | length > 0
            fail_msg: "FortiManager authentication failed."
            success_msg: "FortiManager authentication successful."


        # ========================================================
        # 8.3 SAVE SESSION
        # ========================================================

        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"
          no_log: true


        # ========================================================
        # 8.4 CHECK IF ALREADY AUTHORIZED
        # ========================================================

        - name: Check target ADOM for existing FortiGate
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
            return_content: true
          register: target_adom_devices
          no_log: true


        # ========================================================
        # 8.5 INITIALIZE AUTHORIZED DEVICE
        # ========================================================

        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        # ========================================================
        # 8.6 FIND DEVICE IN TARGET ADOM
        # ========================================================

        - name: Find existing FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              target_adom_devices.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.7 DISPLAY ALREADY AUTHORIZED
        # ========================================================

        - name: Display already authorized FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE ALREADY AUTHORIZED"
              - "=============================================="
              - "Device Name : {{ authorized_device.name }}"
              - "Serial      : {{ authorized_device.sn }}"
              - "IP          : {{ authorized_device.ip | default('n/a') }}"
              - "OID         : {{ authorized_device.oid | default('n/a') }}"
              - "ADOM        : {{ target_adom }}"
              - "Action      : AUTHORIZATION SKIPPED"
              - "=============================================="
          when:
            - authorized_device | length > 0


        # ========================================================
        # 8.8 GET GLOBAL DVM DATABASE
        # ========================================================

        - name: Get FortiGates from global DVM database
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/device"
                  fields:
                    - "name"
                    - "sn"
                    - "oid"
                    - "mgmt_mode"
                    - "ip"
                    - "hostname"
                    - "platform_str"
                  loadsub: 0
            return_content: true
          register: all_devices
          no_log: true
          retries: 12
          delay: 5
          until:
            - all_devices.json.result is defined
            - all_devices.json.result | length > 0
            - all_devices.json.result[0].status.code | int == 0
            - >-
              (
                all_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.9 INITIALIZE TARGET DEVICE
        # ========================================================

        - name: Initialize target device
          ansible.builtin.set_fact:
            target_device: {}
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.10 FIND TARGET DEVICE
        # ========================================================

        - name: Find target FortiGate in DVM database
          ansible.builtin.set_fact:
            target_device: "{{ item }}"
          loop: >-
            {{
              all_devices.json.result[0].data
              | default([])
            }}
          when:
            - authorized_device | length == 0
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.11 VERIFY TARGET DEVICE
        # ========================================================

        - name: Verify target FortiGate exists
          ansible.builtin.assert:
            that:
              - target_device | length > 0
            fail_msg: >-
              FortiGate {{ device_serial }} was not found in the
              FortiManager DVM database.
            success_msg: >-
              FortiGate {{ device_serial }} was found in the
              FortiManager DVM database.
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.12 DISPLAY DEVICE
        # ========================================================

        - name: Display discovered FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE READY FOR AUTHORIZATION"
              - "=============================================="
              - "FortiManager Name : {{ target_device.name }}"
              - "FortiManager Serial: {{ target_device.sn }}"
              - "IP                : {{ target_device.ip | default('n/a') }}"
              - "OID               : {{ target_device.oid | default('n/a') }}"
              - "Platform          : {{ target_device.platform_str | default('n/a') }}"
              - "Target ADOM       : {{ target_adom }}"
              - "=============================================="
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.13 AUTHORIZE / PROMOTE DEVICE
        # ========================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ target_adom }}"
                    device:
                      name: "{{ target_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
            return_content: true
          register: authorize_result
          no_log: true
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.14 VERIFY AUTHORIZATION REQUEST
        # ========================================================

        - name: Verify authorization request
          ansible.builtin.assert:
            that:
              - authorize_result.json.result is defined
              - authorize_result.json.result | length > 0
              - authorize_result.json.result[0].status.code | int == 0
              - authorize_result.json.result[0].data.taskid is defined
            fail_msg: >-
              FortiManager rejected the authorization request.

              Code:
              {{ authorize_result.json.result[0].status.code | default('N/A') }}

              Message:
              {{ authorize_result.json.result[0].status.message | default('N/A') }}
            success_msg: >-
              FortiManager accepted the authorization request.
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.15 SAVE TASK ID
        # ========================================================

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorize_task_id: >-
              {{ authorize_result.json.result[0].data.taskid }}
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.16 DISPLAY TASK
        # ========================================================

        - name: Display authorization task ID
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "AUTHORIZATION TASK"
              - "=============================================="
              - "Task ID : {{ authorize_task_id }}"
              - "=============================================="
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.17 POLL AUTHORIZATION TASK
        # ========================================================

        - name: Wait for FortiManager authorization task
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/task/task/{{ authorize_task_id }}"
            return_content: true
          register: authorize_task
          retries: 30
          delay: 5
          until:
            - authorize_task.json.result is defined
            - authorize_task.json.result | length > 0
            - authorize_task.json.result[0].data is defined
            - >-
              (
                authorize_task.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          no_log: true
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.18 VERIFY AUTHORIZATION TASK
        # ========================================================

        - name: Verify authorization task completed
          ansible.builtin.assert:
            that:
              - authorize_task.json.result is defined
              - authorize_task.json.result | length > 0
              - >-
                (
                  authorize_task.json.result[0].data.percent
                  | default(0)
                  | int
                ) >= 100
              - >-
                (
                  authorize_task.json.result[0].data.num_err
                  | default(0)
                  | int
                ) == 0
            fail_msg: "FortiManager authorization task failed."
            success_msg: >-
              FortiManager authorization task completed successfully.
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.19 VERIFY DEVICE IN TARGET ADOM
        # ========================================================

        - name: Wait for FortiGate to appear in target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
            return_content: true
          register: target_adom_devices_after_auth
          retries: 12
          delay: 5
          until:
            - target_adom_devices_after_auth.json.result is defined
            - target_adom_devices_after_auth.json.result | length > 0
            - target_adom_devices_after_auth.json.result[0].status.code | int == 0
            - >-
              (
                target_adom_devices_after_auth.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0
          no_log: true
          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.20 FIND FINAL DEVICE
        # ========================================================

        - name: Initialize final authorized device
          ansible.builtin.set_fact:
            authorized_device: {}

        - name: Find authorized FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              target_adom_devices_after_auth.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.21 VERIFY FINAL DEVICE
        # ========================================================

        - name: Verify FortiGate authorization
          ansible.builtin.assert:
            that:
              - authorized_device | length > 0
            fail_msg: >-
              FortiGate {{ device_serial }} was not found in target
              ADOM {{ target_adom }} after authorization.
            success_msg: >-
              FortiGate {{ device_serial }} is successfully authorized
              in ADOM {{ target_adom }}.


        # ========================================================
        # 8.22 REFRESH DEVICE DETAILS
        # ========================================================
        #
        # We deliberately refresh the device object before building
        # the package scope. This gives us the OID and VDOM information
        # required to reproduce the GUI-style Installation Target.
        # ========================================================

        - name: Refresh authorized FortiGate details
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 8
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device/{{ authorized_device.name }}"
                  loadsub: 1
            return_content: true
          register: authorized_device_details
          retries: 6
          delay: 3
          until:
            - authorized_device_details.json.result is defined
            - authorized_device_details.json.result | length > 0
            - authorized_device_details.json.result[0].status.code | int == 0
            - authorized_device_details.json.result[0].data is defined
          no_log: true


        - name: Save refreshed authorized FortiGate
          ansible.builtin.set_fact:
            authorized_device_full: >-
              {{
                authorized_device_details.json.result[0].data
              }}


        # ========================================================
        # 8.23 VERIFY DEVICE IDENTITY
        # ========================================================

        - name: Verify authorized FortiGate identity
          ansible.builtin.assert:
            that:
              - authorized_device_full.name is defined
              - authorized_device_full.oid is defined
              - authorized_device_full.sn is defined
              - >-
                (
                  authorized_device_full.sn
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
            fail_msg: >-
              The authorized FortiGate object could not be refreshed
              correctly from FortiManager.
            success_msg: >-
              Authorized FortiGate identity verified.


        # ========================================================
        # 8.24 DISPLAY MANAGED DEVICE DETAILS
        # ========================================================

        - name: Display managed FortiGate details
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "MANAGED FORTIGATE"
              - "=============================================="
              - "Name        : {{ authorized_device_full.name }}"
              - "Serial      : {{ authorized_device_full.sn }}"
              - "IP          : {{ authorized_device_full.ip | default(expected_management_ip) }}"
              - "OID         : {{ authorized_device_full.oid }}"
              - "Platform    : {{ authorized_device_full.platform_str | default('n/a') }}"
              - "Target ADOM : {{ target_adom }}"
              - "=============================================="


        # ========================================================
        # 8.25 GET TARGET VDOM OID FOR SCOPE OBJECT
        # ========================================================
        #
        # The VDOM is used only to build the FortiManager
        # Installation Target object.
        #
        # IMPORTANT:
        # No VDOM verification/assertion is performed here.
        # ========================================================

        - name: Initialize target VDOM OID
          ansible.builtin.set_fact:
            target_vdom_oid: ""

        - name: Find target VDOM OID
          ansible.builtin.set_fact:
            target_vdom_oid: "{{ item.oid }}"
          loop: >-
            {{
              authorized_device_full.vdom
              | default([])
            }}
          when:
            - item.name is defined
            - item.oid is defined
            - item.name == target_vdom


        # ========================================================
        # 8.26 READ POLICY PACKAGE
        # ========================================================

        - name: Read policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 9
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: package_before_update
          no_log: true


        # ========================================================
        # 8.27 VERIFY POLICY PACKAGE
        # ========================================================

        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - package_before_update.json.result is defined
              - package_before_update.json.result | length > 0
              - package_before_update.json.result[0].status.code | int == 0
              - package_before_update.json.result[0].data is defined
              - package_before_update.json.result[0].data.name == policy_package
            fail_msg: >-
              Policy package '{{ policy_package }}' was not found in
              ADOM '{{ target_adom }}'.

              Step 04 cannot synchronize the Installation Target
              until the policy package exists.
            success_msg: >-
              Policy package '{{ policy_package }}' exists in
              ADOM '{{ target_adom }}'.


        # ========================================================
        # 8.28 SAVE CURRENT PACKAGE SCOPE
        # ========================================================

        - name: Save current package scope
          ansible.builtin.set_fact:
            package_data: >-
              {{
                package_before_update.json.result[0].data
              }}
            current_scope_members: >-
              {{
                package_before_update.json.result[0].data.get(
                  'scope member',
                  []
                )
              }}


        # ========================================================
        # 8.29 DISPLAY CURRENT INSTALLATION TARGETS
        # ========================================================

        - name: Display current Installation Target scope
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "CURRENT INSTALLATION TARGETS"
              - "=============================================="
              - "Policy Package : {{ policy_package }}"
              - "Current Scope  : {{ current_scope_members }}"
              - "=============================================="


        # ========================================================
        # 8.30 BUILD COMPLETE GUI-STYLE SCOPE MEMBER
        # ========================================================
        #
        # IMPORTANT:
        #
        # The GUI-style Installation Target contains:
        #
        #   name
        #   oid
        #   vdom
        #   vdom_oid
        #
        # Previously we only supplied name/vdom. That produced the
        # incomplete GUI entry with empty IP/platform.
        #
        # We now replace only the selected FortiGate entry and keep
        # all other existing package targets unchanged.
        # ========================================================

        - name: Build complete Installation Target object
          ansible.builtin.set_fact:
            desired_scope_member:
              name: "{{ authorized_device_full.name }}"
              oid: "{{ authorized_device_full.oid | string }}"
              vdom: "{{ target_vdom }}"
              vdom_oid: "{{ target_vdom_oid | string }}"


        # ========================================================
        # 8.31 REBUILD PACKAGE SCOPE WITHOUT LOSING OTHER TARGETS
        # ========================================================

        - name: Build synchronized package scope
          ansible.builtin.set_fact:
            synchronized_scope_members: >-
              {{
                (
                  current_scope_members
                  | rejectattr(
                      'name',
                      'defined'
                    )
                  | list
                )
                +
                (
                  current_scope_members
                  | selectattr(
                      'name',
                      'defined'
                    )
                  | rejectattr(
                      'name',
                      'equalto',
                      authorized_device_full.name
                    )
                  | list
                )
                +
                [desired_scope_member]
              }}


        # ========================================================
        # 8.32 DISPLAY TARGET TO BE SYNCHRONIZED
        # ========================================================

        - name: Display Installation Target synchronization plan
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "INSTALLATION TARGET SYNCHRONIZATION"
              - "=============================================="
              - "Policy Package : {{ policy_package }}"
              - "Device         : {{ authorized_device_full.name }}"
              - "IP             : {{ authorized_device_full.ip | default(expected_management_ip) }}"
              - "OID            : {{ authorized_device_full.oid }}"
              - "VDOM           : {{ target_vdom }}"
              - "VDOM OID       : {{ target_vdom_oid }}"
              - "=============================================="


        # ========================================================
        # 8.33 SYNCHRONIZE PACKAGE INSTALLATION TARGET
        # ========================================================
        #
        # SET is intentional here because the existing automated
        # entry may already exist but be incomplete. ADD would return
        # "already exists" and would not repair that entry.
        #
        # The complete existing scope is preserved; only the selected
        # FortiGate entry is replaced.
        # ========================================================

        - name: Synchronize Installation Target with FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 10
              method: "set"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
                  data:
                    "scope member": "{{ synchronized_scope_members }}"
            return_content: true
          register: scope_sync_response
          no_log: true

          failed_when:
            - scope_sync_response.json.result is not defined
              or scope_sync_response.json.result | length == 0
              or scope_sync_response.json.result[0].status.code | int != 0


        # ========================================================
        # 8.34 VERIFY SCOPE SYNCHRONIZATION REQUEST
        # ========================================================

        - name: Verify Installation Target synchronization request
          ansible.builtin.assert:
            that:
              - scope_sync_response.json.result is defined
              - scope_sync_response.json.result | length > 0
              - scope_sync_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager rejected the Installation Target
              synchronization request.

              Package : {{ policy_package }}
              Device  : {{ authorized_device_full.name }}
            success_msg: >-
              FortiManager accepted the Installation Target
              synchronization request.


        # ========================================================
        # 8.35 READ FINAL POLICY PACKAGE STATE
        # ========================================================

        - name: Read final policy package state
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 11
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: final_package_response
          retries: 10
          delay: 3
          until:
            - final_package_response.json.result is defined
            - final_package_response.json.result | length > 0
            - final_package_response.json.result[0].status.code | int == 0
            - final_package_response.json.result[0].data is defined
          no_log: true


        # ========================================================
        # 8.36 SAVE FINAL SCOPE
        # ========================================================

        - name: Save final package scope
          ansible.builtin.set_fact:
            final_package_data: >-
              {{
                final_package_response.json.result[0].data
              }}
            final_scope_members: >-
              {{
                final_package_response.json.result[0].data.get(
                  'scope member',
                  []
                )
              }}


        # ========================================================
        # 8.37 FIND FINAL INSTALLATION TARGET
        # ========================================================

        - name: Initialize final Installation Target
          ansible.builtin.set_fact:
            final_scope_member: {}


        - name: Find final Installation Target
          ansible.builtin.set_fact:
            final_scope_member: "{{ item }}"
          loop: "{{ final_scope_members }}"
          when:
            - item.name is defined
            - item.name == authorized_device_full.name


        # ========================================================
        # 8.38 VERIFY FINAL INSTALLATION TARGET
        # ========================================================

        - name: Verify final Installation Target
          ansible.builtin.assert:
            that:
              - final_package_data.name == policy_package
              - final_scope_member | length > 0
              - final_scope_member.name == authorized_device_full.name
              - final_scope_member.oid | string == authorized_device_full.oid | string
            fail_msg: >-
              Installation Target verification failed.

              Policy Package : {{ policy_package }}
              Expected Device: {{ authorized_device_full.name }}
              Expected OID   : {{ authorized_device_full.oid }}

              Final Scope:
              {{ final_scope_members }}
            success_msg: >-
              Installation Target is correctly synchronized with
              the managed FortiGate.


        # ========================================================
        # 8.39 DISPLAY FINAL INSTALLATION TARGET
        # ========================================================

        - name: Display final Installation Target
          ansible.builtin.debug:
            msg:
              - "=================================================="
              - "FINAL INSTALLATION TARGET"
              - "=================================================="
              - "Policy Package : {{ policy_package }}"
              - "FortiGate      : {{ authorized_device_full.name }}"
              - "IP             : {{ authorized_device_full.ip | default(expected_management_ip) }}"
              - "Serial         : {{ authorized_device_full.sn }}"
              - "OID            : {{ authorized_device_full.oid }}"
              - "VDOM           : {{ final_scope_member.vdom }}"
              - "VDOM OID       : {{ final_scope_member.vdom_oid }}"
              - "=================================================="


        # ========================================================
        # 8.40 FINAL SUCCESS MESSAGE
        # ========================================================

        - name: Display Step 04 success
          ansible.builtin.debug:
            msg:
              - "=========================================================="
              - "STEP 04 - FORTIGATE AUTHORIZATION + TARGET MAPPING"
              - "=========================================================="
              - "NetBox Asset Tag     : {{ asset_tag }}"
              - "FortiGate            : {{ authorized_device_full.name }}"
              - "Serial               : {{ authorized_device_full.sn }}"
              - "IP                   : {{ authorized_device_full.ip | default(expected_management_ip) }}"
              - "Target ADOM          : {{ target_adom }}"
              - "Target VDOM          : {{ target_vdom }}"
              - "Policy Package       : {{ policy_package }}"
              - "VDOM Verification    : NOT PERFORMED"
              - "Authorization        : SUCCESS"
              - "Installation Target  : SUCCESS"
              - "Installation Target  : {{ final_scope_member.name }}"
              - "Target IP            : {{ authorized_device_full.ip | default(expected_management_ip) }}"
              - "Target OID           : {{ final_scope_member.oid }}"
              - "Target VDOM          : {{ final_scope_member.vdom }}"
              - "Target VDOM OID      : {{ final_scope_member.vdom_oid }}"
              - "----------------------------------------------------------"
              - "VERIFICATION COMPLETE - EVERYTHING IS OK"
              - "=========================================================="


      # ==========================================================
      # 9. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              id: 99
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/sys/logout"
            return_content: true
          no_log: true
          when:
            - fmg_session is defined
