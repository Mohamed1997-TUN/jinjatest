---
- name: Step 3 - Authorize FortiGate in FortiManager
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:

    # ============================================================
    # FORTIMANAGER
    # ============================================================

    fmg_validate_certs: false

    # Unauthorized/unregistered devices always land in root.
    # This is only used as the initial lookup context.
    source_adom: "root"

    # Destination ADOM
    target_adom: "dhia"


  tasks:

    # ============================================================
    # 0. READ firewalls.vars AS RAW YAML
    # ============================================================
    #
    # IMPORTANT:
    # Do NOT use firewalls.vars under vars_files.
    #
    # The file contains values such as:
    #
    # api_token: "{{ vault_milano_api_token }}"
    #
    # Those variables are not required for this step.
    #
    # Reading the file as raw YAML prevents Ansible from trying
    # to evaluate those unrelated vault variables.
    # ============================================================

    - name: Read firewalls.vars as raw YAML
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 1. FIND FIREWALL USING NETBOX SERIAL
    # ============================================================
    #
    # NetBox asset_tag = FortiGate serial
    #
    # Only the matching firewall is selected.
    # ============================================================

    - name: Find firewall in firewalls.vars using NetBox asset_tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr('serial', 'defined')
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 2. SKIP FIREWALL NOT DEFINED IN firewalls.vars
    # ============================================================

    - name: Display skipped firewall
      ansible.builtin.debug:
        msg: >-
          SKIPPING {{ inventory_hostname }}.
          NetBox serial {{ asset_tag | default('unknown') }}
          is not defined in firewalls.vars.
      when: selected_firewall | length == 0


    - name: Stop processing firewall not defined in firewalls.vars
      ansible.builtin.meta: end_host
      when: selected_firewall | length == 0


    # ============================================================
    # 3. EXTRACT ONLY REQUIRED INFORMATION
    # ============================================================
    #
    # We deliberately do NOT copy api_token.
    #
    # Required by this workflow:
    #
    #   serial
    #   hostname
    #   management_ip
    #   target_vdom
    #   policy_package
    #
    # management_mask and api_token are ignored.
    # ============================================================

    - name: Extract required firewall information
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        device_hostname: "{{ selected_firewall.hostname }}"
        device_management_ip: "{{ selected_firewall.management_ip }}"
        device_vdom: "{{ selected_firewall.target_vdom | default('') }}"
        policy_package: "{{ selected_firewall.policy_package | default('') }}"


    # ============================================================
    # 4. VERIFY REQUIRED FIREWALL VARIABLES
    # ============================================================

    - name: Verify required firewall variables
      ansible.builtin.assert:
        that:

          - device_serial is defined
          - device_serial | length > 0

          - device_hostname is defined
          - device_hostname | length > 0

          - device_management_ip is defined
          - device_management_ip | length > 0

          - device_vdom is defined
          - device_vdom | length > 0

          - policy_package is defined
          - policy_package | length > 0

        fail_msg: >-
          Firewall {{ asset_tag | default('unknown') }}
          exists in firewalls.vars but one or more required
          fields are missing.

          Required fields:
          serial, hostname, management_ip,
          target_vdom, policy_package.

        success_msg: >-
          Required firewall information is available.


    # ============================================================
    # 5. DISPLAY SELECTED FIREWALL
    # ============================================================

    - name: Display selected firewall
      ansible.builtin.debug:
        msg:

          - "=============================================="
          - "SELECTED FIREWALL"
          - "=============================================="

          - "Inventory Host : {{ inventory_hostname }}"
          - "NetBox Serial  : {{ asset_tag | default('unknown') }}"

          - "Serial         : {{ device_serial }}"
          - "Hostname       : {{ device_hostname }}"
          - "Management IP  : {{ device_management_ip }}"
          - "Target VDOM    : {{ device_vdom }}"
          - "Policy Package : {{ policy_package }}"

          - "=============================================="


    # ============================================================
    # 6. LOGIN TO FORTIMANAGER
    # ============================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "https://{{ fortimanager_host }}/jsonrpc"
        method: POST
        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:
          id: 1
          method: "exec"

          params:
            - url: "/sys/login/user"

              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"

        return_content: true

      register: fmg_login

      no_log: true


    # ============================================================
    # 7. VERIFY LOGIN
    # ============================================================

    - name: Verify FortiManager authentication
      ansible.builtin.assert:

        that:
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined

        fail_msg: "FortiManager authentication failed."

        success_msg: "FortiManager authentication successful."


    # ============================================================
    # 8. SAVE SESSION
    # ============================================================

    - name: Save FortiManager session
      ansible.builtin.set_fact:

        fmg_session: "{{ fmg_login.json.session }}"

      no_log: true


    # ============================================================
    # 9. FIND TARGET FORTIGATE IN GLOBAL DEVICE TABLE
    # ============================================================

    - name: Find target FortiGate by serial
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 2

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvmdb/device"

              filter:
                - "sn"
                - "=="
                - "{{ device_serial }}"

        return_content: true

      register: device_lookup

      no_log: true


    # ============================================================
    # 10. EXTRACT TARGET FORTIGATE
    # ============================================================

    - name: Extract target FortiGate
      ansible.builtin.set_fact:

        target_device: >-
          {{
            (device_lookup.json.result[0].data | default([]))
            | first
            | default({})
          }}


    # ============================================================
    # 11. VERIFY TARGET FORTIGATE
    # ============================================================

    - name: Verify target FortiGate exists
      ansible.builtin.assert:

        that:
          - target_device | length > 0

        fail_msg: >-
          FortiGate {{ device_serial }}
          was not found via /dvmdb/device.

          If it is showing under "Display Hidden Devices" in the
          GUI, it may be hidden at the database level.
          Authorize it once via the GUI to clear that state,
          then re-run.

        success_msg: >-
          FortiGate {{ device_serial }}
          was found.


    # ============================================================
    # 12. DISPLAY DISCOVERED FORTIGATE
    # ============================================================

    - name: Display discovered FortiGate
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "DISCOVERED FORTIGATE"
          - "=============================================="

          - "Name        : {{ target_device.name }}"
          - "Serial      : {{ target_device.sn }}"
          - "Hostname    : {{ target_device.hostname | default('n/a') }}"
          - "IP          : {{ target_device.ip | default('n/a') }}"
          - "OID         : {{ target_device.oid }}"
          - "Platform    : {{ target_device.platform_str | default('n/a') }}"
          - "Mgmt Mode   : {{ target_device.mgmt_mode }}"

          - "Target ADOM : {{ target_adom }}"

          - "=============================================="


    # ============================================================
    # 13. AUTHORIZE FORTIGATE DIRECTLY INTO TARGET ADOM
    # ============================================================

    - name: Authorize FortiGate into target ADOM
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 3

          method: "exec"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvm/cmd/add/device"

              data:

                adom: "{{ target_adom }}"

                device:

                  name: "{{ target_device.name }}"

                  "device action": "promote_unreg"

                flags:
                  - create_task
                  - nonblocking

        return_content: true

      register: authorize_result

      no_log: true


    # ============================================================
    # 14. VERIFY AUTHORIZE REQUEST
    # ============================================================

    - name: Verify authorize request
      ansible.builtin.assert:

        that:
          - authorize_result.json.result is defined
          - authorize_result.json.result | length > 0
          - authorize_result.json.result[0].status.code | int == 0
          - authorize_result.json.result[0].data.taskid is defined

        fail_msg: >-
          FortiManager rejected the authorize request.

          Code:
          {{
            authorize_result.json.result[0].status.code
            | default('N/A')
          }}

          Message:
          {{
            authorize_result.json.result[0].status.message
            | default('N/A')
          }}

        success_msg: >-
          FortiManager accepted the FortiGate authorize request.


    # ============================================================
    # 15. SAVE AUTHORIZE TASK ID
    # ============================================================

    - name: Save authorize task ID
      ansible.builtin.set_fact:

        authorize_task_id: >-
          {{
            authorize_result.json.result[0].data.taskid
          }}


    # ============================================================
    # 16. DISPLAY AUTHORIZE TASK ID
    # ============================================================

    - name: Display authorize task ID
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "AUTHORIZE TASK"
          - "=============================================="

          - "Task ID : {{ authorize_task_id }}"

          - "=============================================="


    # ============================================================
    # 17. WAIT FOR AUTHORIZE TASK
    # ============================================================

    - name: Wait for FortiManager authorize task
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 4

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/task/task/{{ authorize_task_id }}"

        return_content: true

      register: authorize_task

      until:

        - authorize_task.json.result is defined

        - authorize_task.json.result | length > 0

        - authorize_task.json.result[0].data is defined

        - >
          (
            authorize_task.json.result[0].data.percent
            | default(0)
            | int
          ) >= 100

      retries: 30

      delay: 5

      no_log: true


    # ============================================================
    # 18. DISPLAY AUTHORIZE TASK RESULT
    # ============================================================

    - name: Display authorize task result
      ansible.builtin.debug:

        msg: "{{ authorize_task.json }}"


    # ============================================================
    # 19. VERIFY AUTHORIZE TASK
    # ============================================================

    - name: Verify authorize task completed
      ansible.builtin.assert:

        that:

          - authorize_task.json.result is defined

          - authorize_task.json.result | length > 0

          - >
            (
              authorize_task.json.result[0].data.percent
              | default(0)
              | int
            ) >= 100

          - >
            (
              authorize_task.json.result[0].data.num_err
              | default(0)
              | int
            ) == 0

        fail_msg: >-
          FortiManager authorize task did not complete successfully.

        success_msg: >-
          FortiManager authorize task completed successfully.


    # ============================================================
    # 20. WAIT FOR DVM CACHE SYNCHRONIZATION
    # ============================================================

    - name: Wait for DVM cache synchronization
      ansible.builtin.pause:
        seconds: 5


    # ============================================================
    # 21. GET DEVICES FROM TARGET ADOM
    # ============================================================

    - name: Get devices from target ADOM
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 5

          method: "get"

          session: "{{ fmg_session }}"

          params:

            - url: "/dvmdb/adom/{{ target_adom }}/device"

        return_content: true

      register: target_devices

      no_log: true


    # ============================================================
    # 22. VERIFY TARGET ADOM QUERY
    # ============================================================

    - name: Verify target ADOM query
      ansible.builtin.assert:

        that:
          - target_devices.json.result is defined
          - target_devices.json.result | length > 0
          - target_devices.json.result[0].status.code | int == 0

        fail_msg: >-
          Unable to query target ADOM {{ target_adom }}.

        success_msg: >-
          Target ADOM {{ target_adom }} queried successfully.


    # ============================================================
    # 23. FIND FORTIGATE IN TARGET ADOM
    # ============================================================

    - name: Find FortiGate in target ADOM
      ansible.builtin.set_fact:

        authorized_device: >-
          {{
            target_devices.json.result[0].data
            | selectattr('sn', 'defined')
            | selectattr('sn', 'equalto', device_serial)
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 24. VERIFY FORTIGATE IS IN TARGET ADOM
    # ============================================================

    - name: Verify FortiGate is in target ADOM
      ansible.builtin.assert:

        that:
          - authorized_device | length > 0

        fail_msg: >-
          FortiGate {{ device_serial }}
          was not found in ADOM {{ target_adom }}
          after authorization.

        success_msg: >-
          FortiGate {{ device_serial }}
          is now present in ADOM {{ target_adom }}.


    # ============================================================
    # 25. DISPLAY AUTHORIZED DEVICE
    # ============================================================

    - name: Display authorized device
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "FORTIGATE AUTHORIZED"
          - "=============================================="

          - "Name   : {{ authorized_device.name }}"
          - "Serial : {{ authorized_device.sn }}"
          - "IP     : {{ authorized_device.ip }}"
          - "OID    : {{ authorized_device.oid }}"
          - "ADOM   : {{ target_adom }}"

          - "=============================================="


    # ============================================================
    # 26. DETERMINE VDOM OID
    # ============================================================

    - name: Determine target VDOM OID
      ansible.builtin.set_fact:

        target_vdom_oid: >-
          {{
            (
              authorized_device.vdom
              | selectattr('name', 'equalto', device_vdom)
              | map(attribute='oid')
              | list
              | first
            )
            | default(3)
          }}


    # ============================================================
    # 27. DISPLAY VDOM INFORMATION
    # ============================================================

    - name: Display VDOM information
      ansible.builtin.debug:

        msg:

          - "=============================================="
          - "VDOM"
          - "=============================================="

          - "VDOM     : {{ device_vdom }}"
          - "VDOM OID : {{ target_vdom_oid }}"

          - "=============================================="


    # ============================================================
    # 28. ASSIGN POLICY PACKAGE
    # ============================================================

    - name: Assign policy package
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 6

          method: "set"

          session: "{{ fmg_session }}"

          params:

            - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

              data:

                "scope member":

                  - name: "{{ authorized_device.name }}"

                    oid: "{{ authorized_device.oid | string }}"

                    vdom: "{{ device_vdom }}"

                    vdom_oid: "{{ target_vdom_oid }}"

        return_content: true

      register: policy_assignment

      no_log: true


    # ============================================================
    # 29. DISPLAY POLICY ASSIGNMENT RESULT
    # ============================================================

    - name: Display policy assignment result
      ansible.builtin.debug:

        msg: "{{ policy_assignment.json }}"


    # ============================================================
    # 30. VERIFY POLICY ASSIGNMENT
    # ============================================================

    - name: Verify policy package assignment
      ansible.builtin.assert:

        that:
          - policy_assignment.json.result is defined
          - policy_assignment.json.result | length > 0
          - policy_assignment.json.result[0].status.code | int == 0

        fail_msg: >-
          Policy package {{ policy_package }}
          assignment failed.

          Code:
          {{
            policy_assignment.json.result[0].status.code
            | default('N/A')
          }}

          Message:
          {{
            policy_assignment.json.result[0].status.message
            | default('N/A')
          }}

        success_msg: >-
          Policy package {{ policy_package }}
          assigned successfully.


    # ============================================================
    # 31. FINAL SUMMARY
    # ============================================================

    - name: Display final Step 3 summary
      ansible.builtin.debug:

        msg:

          - "=================================================="
          - "STEP 3 - FORTIGATE AUTHORIZATION"
          - "=================================================="

          - "FortiGate       : {{ authorized_device.name }}"
          - "Serial          : {{ authorized_device.sn }}"

          - "Target ADOM     : {{ target_adom }}"

          - "VDOM            : {{ device_vdom }}"

          - "Policy Package  : {{ policy_package }}"

          - "Authorization   : SUCCESS"

          - "Package Assign  : SUCCESS"

          - "=================================================="


    # ============================================================
    # 32. LOGOUT
    # ============================================================

    - name: Logout from FortiManager
      ansible.builtin.uri:

        url: "https://{{ fortimanager_host }}/jsonrpc"

        method: POST

        validate_certs: "{{ fmg_validate_certs }}"

        headers:
          Content-Type: application/json

        body_format: json

        body:

          id: 7

          method: "exec"

          session: "{{ fmg_session }}"

          params:

            - url: "/sys/logout"

        return_content: true

      no_log: true
