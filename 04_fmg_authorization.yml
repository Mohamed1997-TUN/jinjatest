---
# ============================================================
# STEP 04 - FortiManager Device Authorization, ADOM Migration
#           and Installation Target Assignment
# ============================================================
#
# PRIMARY OBJECTIVE
# -----------------
# Guarantee that a FortiGate is:
#
#   1. Identified from NetBox/firewalls.vars by serial
#   2. Authorized in FortiManager when it is still unauthorized
#   3. Present in the ROOT ADOM immediately after first authorization
#   4. Migrated from ROOT ADOM to the requested TARGET ADOM
#   5. Verified in the TARGET ADOM by:
#        - serial
#        - FortiManager device name
#        - management IP
#        - target ADOM
#   6. Assigned to the requested Policy Package as an
#      Installation Target using:
#        - device name
#        - VDOM
#   7. Verified again after the assignment.
#
# SAFETY PRINCIPLES
# -----------------
# - ADOM is the primary ownership/context boundary.
# - VDOM is only a scope attribute of the device/package target.
# - A device already belonging to another non-root ADOM is NOT
#   migrated automatically; the playbook stops to avoid accidental
#   cross-tenant reassignment.
# - Serial normalization is used only for comparison.
# - The real FortiManager serial is never modified.
# - No policy package installation is performed by this playbook.
# - No device is deleted from root manually. FortiManager's
#   supported "move device to ADOM" operation handles the move.
# - API tasks are monitored before the session is closed.
#
# IMPORTANT FORTIMANAGER API BEHAVIOR
# -----------------------------------
# A device may appear in "Unauthorized Devices" under root first.
# In that situation the reliable workflow is:
#
#       Unauthorized/root
#             |
#        promote_unreg
#             |
#       Managed/root
#             |
#       move to target ADOM
#             |
#       Managed/target ADOM
#             |
#       Policy Package Installation Target
#
# The playbook intentionally follows that state machine.
#
# DOCUMENTED API USED
# -------------------
# Login:
#   /sys/login/user
#
# Authorize:
#   exec /dvm/cmd/add/device
#   device action = promote_unreg
#
# List ADOMs:
#   /dvmdb/adom
#
# List devices:
#   /dvmdb/device
#   /dvmdb/adom/<adom>/device
#
# Move device to ADOM:
#   add /dvmdb/adom/<target_adom>/object member
#   data:
#     name: <device name>
#     vdom: <vdom>
#
# Policy package:
#   /pm/pkg/adom/<adom>/<policy_package>
#
# Installation Target:
#   add /pm/pkg/adom/<adom>/<policy_package>/scope member
#   data:
#     name: <device name>
#     vdom: <vdom>
#
# ============================================================

- name: STEP 04 - FortiManager authorization and ADOM migration
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    # --------------------------------------------------------
    # FortiManager JSON-RPC endpoint
    # --------------------------------------------------------
    fmg_jsonrpc_url: "https://{{ fortimanager_host }}/jsonrpc"

    # --------------------------------------------------------
    # Load firewalls.vars as RAW YAML.
    # Do not use vars_files for it because unrelated Jinja/vault
    # variables may be present in that file.
    # --------------------------------------------------------
    firewall_data: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir + '/vars/firewalls.vars'
        )
        | from_yaml
      }}

    firewall_records: >-
      {{
        firewall_data.firewalls
        | default(firewall_data)
      }}

    # --------------------------------------------------------
    # NetBox source key
    # --------------------------------------------------------
    netbox_asset_tag: >-
      {{
        hostvars[inventory_hostname]['asset_tag']
        | default('')
        | string
        | trim
      }}

    # --------------------------------------------------------
    # Operation tuning
    # --------------------------------------------------------
    api_timeout_seconds: 30
    task_retries: 36
    task_delay_seconds: 5
    state_retries: 24
    state_delay_seconds: 5

  tasks:

    # ========================================================
    # 1. INPUT / SOURCE-OF-TRUTH VALIDATION
    # ========================================================

    - name: Display source-of-truth input
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "STEP 04 - INPUT"
          - "===================================================="
          - "Inventory host : {{ inventory_hostname }}"
          - "NetBox asset_tag: {{ netbox_asset_tag }}"
          - "===================================================="

    - name: Validate NetBox asset_tag
      ansible.builtin.assert:
        that:
          - netbox_asset_tag | length > 0
        fail_msg: >-
          NetBox asset_tag is empty for '{{ inventory_hostname }}'.
          The asset_tag must contain the FortiGate serial.

    - name: Select firewall definition from firewalls.vars
      ansible.builtin.set_fact:
        selected_firewalls: >-
          {{
            firewall_records
            | selectattr('serial', 'defined')
            | selectattr('serial', 'equalto', netbox_asset_tag)
            | list
          }}

    - name: Validate exactly one firewall definition
      ansible.builtin.assert:
        that:
          - selected_firewalls | length == 1
        fail_msg: >-
          Expected exactly one firewall definition for asset_tag
          '{{ netbox_asset_tag }}', but found
          {{ selected_firewalls | length }} in vars/firewalls.vars.

    - name: Save selected firewall
      ansible.builtin.set_fact:
        selected_firewall: "{{ selected_firewalls[0] }}"

    - name: Validate selected firewall fields
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | trim | length > 0
          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | trim | length > 0
          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | trim | length > 0
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | trim | length > 0
          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | trim | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | trim | length > 0
        fail_msg: >-
          Selected firewall definition is incomplete.
          Required: serial, hostname, management_ip, target_adom,
          target_vdom and policy_package.

    - name: Set normalized expected values
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            selected_firewall.serial
            | string
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}
        expected_adom: "{{ selected_firewall.target_adom | string | trim }}"
        expected_vdom: "{{ selected_firewall.target_vdom | string | trim }}"
        expected_policy_package: "{{ selected_firewall.policy_package | string | trim }}"
        expected_management_ip: "{{ selected_firewall.management_ip | string | trim }}"

    - name: Display selected firewall
      ansible.builtin.debug:
        msg:
          - "Selected firewall"
          - "Expected serial        : {{ selected_firewall.serial }}"
          - "Normalized serial      : {{ normalized_device_serial }}"
          - "Expected hostname      : {{ selected_firewall.hostname }}"
          - "Expected management IP : {{ expected_management_ip }}"
          - "Target ADOM            : {{ expected_adom }}"
          - "Target VDOM            : {{ expected_vdom }}"
          - "Policy Package         : {{ expected_policy_package }}"

    # ========================================================
    # 2. LOGIN
    # ========================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "{{ fmg_jsonrpc_url }}"
        method: POST
        validate_certs: false
        return_content: true
        body_format: json
        timeout: "{{ api_timeout_seconds }}"
        body:
          id: 1
          method: exec
          params:
            - url: "/sys/login/user"
              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"
          verbose: 1
        status_code: 200
      register: fmg_login
      no_log: true

    - name: Validate FortiManager login response
      ansible.builtin.assert:
        that:
          - fmg_login.json is defined
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status is defined
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined
          - fmg_login.json.session | string | length > 0
        fail_msg: >-
          FortiManager login failed.
          HTTP={{ fmg_login.status | default('unknown') }},
          RPC code={{
            fmg_login.json.result[0].status.code
            if (
              fmg_login.json is defined
              and fmg_login.json.result is defined
              and fmg_login.json.result | length > 0
              and fmg_login.json.result[0].status is defined
            )
            else 'unknown'
          }},
          RPC message={{
            fmg_login.json.result[0].status.message
            if (
              fmg_login.json is defined
              and fmg_login.json.result is defined
              and fmg_login.json.result | length > 0
              and fmg_login.json.result[0].status is defined
            )
            else 'unknown'
          }}.

    - name: Save FortiManager session
      ansible.builtin.set_fact:
        fmg_session: "{{ fmg_login.json.session }}"

    - name: Display login diagnostic
      ansible.builtin.debug:
        msg:
          - "FortiManager login: SUCCESS"
          - "RPC code: {{ fmg_login.json.result[0].status.code }}"
          - "RPC message: {{ fmg_login.json.result[0].status.message }}"
          - "Session returned: YES"

    # ========================================================
    # MAIN OPERATIONS
    # ========================================================

    - name: Execute Step 04
      block:

        # ====================================================
        # 3. VALIDATE TARGET ADOM
        # ====================================================

        - name: Get FortiManager ADOM list
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 10
              method: get
              params:
                - url: "/dvmdb/adom"
                  fields:
                    - name
                    - mr
                    - os_ver
                    - restricted_prds
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: fmg_adoms

        - name: Validate ADOM API response
          ansible.builtin.assert:
            that:
              - fmg_adoms.json.result is defined
              - fmg_adoms.json.result | length > 0
              - fmg_adoms.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve the ADOM database.

        - name: Build ADOM list
          ansible.builtin.set_fact:
            fmg_adom_list: "{{ fmg_adoms.json.result[0].data | default([]) }}"

        - name: Find target ADOM
          ansible.builtin.set_fact:
            target_adom_matches: >-
              {{
                fmg_adom_list
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', expected_adom)
                | list
              }}

        - name: Validate target ADOM exists
          ansible.builtin.assert:
            that:
              - target_adom_matches | length == 1
            fail_msg: >-
              Target ADOM '{{ expected_adom }}' does not exist uniquely
              in FortiManager. Matches={{ target_adom_matches | length }}.

        - name: Display ADOM validation
          ansible.builtin.debug:
            msg:
              - "Target ADOM exists: YES"
              - "Target ADOM: {{ expected_adom }}"
              - "ADOM metadata: {{ target_adom_matches[0] | to_nice_json }}"

        # ====================================================
        # 4. READ ROOT AND TARGET ADOM DEVICES
        # ====================================================

        - name: Get devices from root ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 20
              method: get
              params:
                - url: "/dvmdb/adom/root/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: root_adom_devices_response
          when: expected_adom != 'root'

        - name: Validate root ADOM devices response
          ansible.builtin.assert:
            that:
              - root_adom_devices_response.json.result is defined
              - root_adom_devices_response.json.result | length > 0
              - root_adom_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve devices from root ADOM.
          when: expected_adom != 'root'

        - name: Build root ADOM device list
          ansible.builtin.set_fact:
            root_adom_device_list: >-
              {{
                root_adom_devices_response.json.result[0].data
                | default([])
              }}
          when: expected_adom != 'root'

        - name: Initialize root ADOM serial matches
          ansible.builtin.set_fact:
            root_serial_matches: []
          when: expected_adom != 'root'

        - name: Find expected serial in root ADOM
          ansible.builtin.set_fact:
            root_serial_matches: >-
              {{
                root_serial_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ root_adom_device_list | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: expected_adom != 'root'

        - name: Validate root ADOM serial uniqueness
          ansible.builtin.assert:
            that:
              - root_serial_matches | length <= 1
            fail_msg: >-
              More than one device in root ADOM matches serial
              '{{ selected_firewall.serial }}'. Refusing to continue.
          when: expected_adom != 'root'

        - name: Get devices from target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 21
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: target_adom_devices_response

        - name: Validate target ADOM devices response
          ansible.builtin.assert:
            that:
              - target_adom_devices_response.json.result is defined
              - target_adom_devices_response.json.result | length > 0
              - target_adom_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve devices from target ADOM
              '{{ expected_adom }}'.

        - name: Build target ADOM device list
          ansible.builtin.set_fact:
            target_adom_device_list: >-
              {{
                target_adom_devices_response.json.result[0].data
                | default([])
              }}

        - name: Initialize target ADOM serial matches
          ansible.builtin.set_fact:
            target_adom_serial_matches: []

        - name: Find expected serial in target ADOM
          ansible.builtin.set_fact:
            target_adom_serial_matches: >-
              {{
                target_adom_serial_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ target_adom_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate target ADOM serial uniqueness
          ansible.builtin.assert:
            that:
              - target_adom_serial_matches | length <= 1
            fail_msg: >-
              More than one device in target ADOM '{{ expected_adom }}'
              matches serial '{{ selected_firewall.serial }}'.
              Refusing to continue.

        - name: Set current target ADOM state
          ansible.builtin.set_fact:
            device_in_target_adom: >-
              {{ target_adom_serial_matches | length == 1 }}
            device_in_root_adom: >-
              {{
                root_serial_matches | default([])
                | length == 1
              }}

        - name: Display ADOM placement state
          ansible.builtin.debug:
            msg:
              - "Device in target ADOM: {{ device_in_target_adom }}"
              - "Device in root ADOM  : {{ device_in_root_adom }}"
              - "Target ADOM           : {{ expected_adom }}"

        # ====================================================
        # 5. GLOBAL DISCOVERY
        #
        # Used when the device is not already in the target/root
        # ADOMs. This catches a device that belongs to another ADOM
        # and allows us to STOP safely rather than migrating it.
        # ====================================================

        - name: Get global device database with ADOM information
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 30
              method: get
              params:
                - url: "/dvmdb/device"
                  option:
                    - "extra info"
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: global_devices_response

        - name: Validate global device database response
          ansible.builtin.assert:
            that:
              - global_devices_response.json.result is defined
              - global_devices_response.json.result | length > 0
              - global_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve the global device database.

        - name: Build global device list
          ansible.builtin.set_fact:
            global_device_list: >-
              {{
                global_devices_response.json.result[0].data
                | default([])
              }}

        - name: Initialize global serial matches
          ansible.builtin.set_fact:
            global_serial_matches: []

        - name: Find expected serial globally
          ansible.builtin.set_fact:
            global_serial_matches: >-
              {{
                global_serial_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    )
                    == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ global_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate global serial uniqueness
          ansible.builtin.assert:
            that:
              - global_serial_matches | length <= 1
            fail_msg: >-
              FortiManager contains multiple global entries matching
              serial '{{ selected_firewall.serial }}'.
              Refusing to continue because device identity is ambiguous.

        - name: Save global device if present
          ansible.builtin.set_fact:
            global_device: >-
              {{
                global_serial_matches[0]
                if global_serial_matches | length == 1
                else {}
              }}

        - name: Display global device state
          ansible.builtin.debug:
            msg:
              - "Global device entry found: {{ global_serial_matches | length == 1 }}"
              - "Global device: {{ global_device | default({}) | to_nice_json }}"

        # ====================================================
        # 6. REFUSE CROSS-ADOM ACCIDENTAL MIGRATION
        # ====================================================

        - name: Determine reported global ADOM
          ansible.builtin.set_fact:
            global_device_adom: >-
              {{
                global_device['extra info']['adom']
                if
                (
                  global_device is defined
                  and global_device
                  and global_device['extra info'] is defined
                  and global_device['extra info']['adom'] is defined
                )
                else ''
              }}

        - name: Stop if device already belongs to another non-root ADOM
          ansible.builtin.assert:
            that:
              - >-
                not (
                  (not device_in_target_adom)
                  and (not device_in_root_adom)
                  and (global_device_adom | length > 0)
                  and (global_device_adom != expected_adom)
                  and (global_device_adom != 'root')
                )
            fail_msg: >-
              The FortiGate serial '{{ selected_firewall.serial }}'
              is already associated with another non-root ADOM
              '{{ global_device_adom }}', while the requested ADOM is
              '{{ expected_adom }}'. The playbook refuses to move an
              existing device across ADOM boundaries automatically.

        # ====================================================
        # 7. DETECT TRUE UNAUTHORIZED STATE
        #
        # Do NOT infer unauthorized state from mgmt_mode in the global
        # device database. In practice FortiManager may expose a value
        # such as 0 while the GUI still places the device under
        # "Unauthorized Devices".
        #
        # Therefore query the actual unauthorized-device collection.
        # ====================================================

        - name: Get FortiManager unauthorized device list
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 35
              method: get
              params:
                - url: "/dvmdb/device"
                  filter:
                    - mgmt_mode
                    - "=="
                    - "unreg"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: unauthorized_devices_response

        - name: Validate unauthorized device API response
          ansible.builtin.assert:
            that:
              - unauthorized_devices_response.json.result is defined
              - unauthorized_devices_response.json.result | length > 0
              - unauthorized_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve the Unauthorized Devices
              collection.

        - name: Build unauthorized device list
          ansible.builtin.set_fact:
            unauthorized_device_list: >-
              {{
                unauthorized_devices_response.json.result[0].data
                | default([])
              }}

        - name: Initialize unauthorized serial matches
          ansible.builtin.set_fact:
            unauthorized_serial_matches: []

        - name: Find expected serial in Unauthorized Devices
          ansible.builtin.set_fact:
            unauthorized_serial_matches: >-
              {{
                unauthorized_serial_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ unauthorized_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate unauthorized serial uniqueness
          ansible.builtin.assert:
            that:
              - unauthorized_serial_matches | length <= 1
            fail_msg: >-
              Multiple Unauthorized Device entries match serial
              '{{ selected_firewall.serial }}'. Refusing to continue.

        - name: Set authorization required from actual unauthorized state
          ansible.builtin.set_fact:
            authorization_required: "{{ unauthorized_serial_matches | length == 1 }}"
            unauthorized_device: >-
              {{
                unauthorized_serial_matches[0]
                if unauthorized_serial_matches | length == 1
                else {}
              }}

        - name: Display authorization decision
          ansible.builtin.debug:
            msg:
              - "Authorization required: {{ authorization_required }}"
              - "Current global ADOM  : {{ global_device_adom | default('unknown') }}"
              - "Unauthorized entry   : {{ unauthorized_serial_matches | length == 1 }}"
              - >-
                {{
                  'FMG unauthorized name: ' + (unauthorized_device.name | default('unknown'))
                  if authorization_required
                  else
                  'No unauthorized entry for this serial.'
                }}

        - name: Validate unauthorized device identity before authorization
          ansible.builtin.assert:
            that:
              - unauthorized_device.name is defined
              - unauthorized_device.sn is defined
              - unauthorized_device.ip is defined
              - >-
                (
                  unauthorized_device.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - unauthorized_device.ip | string | trim == expected_management_ip
            fail_msg: >-
              Unauthorized FortiGate identity validation failed before
              authorization.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              FMG unauthorized entry:
              {{ unauthorized_device | to_nice_json }}
          when: authorization_required

        - name: Authorize unauthorized FortiGate into root ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 40
              method: exec
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "root"
                    device:
                      name: "{{ global_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: authorization_response
          when: authorization_required

        - name: Validate authorization request
          ansible.builtin.assert:
            that:
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - authorization_response.json.result[0].data is defined
              - >-
                (
                  authorization_response.json.result[0].data.taskid is defined
                )
                or
                (
                  authorization_response.json.result[0].data.task is defined
                )
            fail_msg: >-
              FortiManager failed to start authorization in root ADOM.

              Response:
              {{
                authorization_response.json
                if authorization_response.json is defined
                else authorization_response
              }}
          when: authorization_required

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.taskid
                | default(
                    authorization_response.json.result[0].data.task
                  )
              }}
          when: authorization_required

        - name: Display authorization task
          ansible.builtin.debug:
            msg: "Authorization task ID: {{ authorization_task_id }}"
          when: authorization_required

        - name: Wait for authorization task
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 41
              method: get
              params:
                - url: "/task/task/{{ authorization_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: authorization_task_status
          until:
            - authorization_task_status.json.result is defined
            - authorization_task_status.json.result | length > 0
            - authorization_task_status.json.result[0].status.code | int == 0
            - >-
              (
                authorization_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: "{{ task_retries }}"
          delay: "{{ task_delay_seconds }}"
          when: authorization_required

        - name: Validate authorization task result
          ansible.builtin.assert:
            that:
              - authorization_task_status.json.result[0].data.percent | default(0) | int >= 100
              - authorization_task_status.json.result[0].data.num_err | default(0) | int == 0
            fail_msg: >-
              FortiManager authorization task completed with errors.

              Task data:
              {{ authorization_task_status.json.result[0].data | to_nice_json }}
          when: authorization_required

        # ====================================================
        # 8. WAIT FOR MANAGED ROOT STATE AFTER AUTHORIZATION
        # ====================================================

        - name: Wait until authorized device is visible in root ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 50
              method: get
              params:
                - url: "/dvmdb/adom/root/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: root_after_authorization
          until:
            - root_after_authorization.json.result is defined
            - root_after_authorization.json.result | length > 0
            - root_after_authorization.json.result[0].status.code | int == 0
            - >-
              (
                root_after_authorization.json.result[0].data | default([])
                | selectattr('sn', 'defined')
                | map(attribute='sn')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | list
              ).count(normalized_device_serial) == 1
          retries: "{{ state_retries }}"
          delay: "{{ state_delay_seconds }}"
          when: authorization_required

        - name: Build root device list after authorization
          ansible.builtin.set_fact:
            root_after_authorization_list: >-
              {{
                root_after_authorization.json.result[0].data
                | default([])
              }}
          when: authorization_required

        - name: Initialize root post-authorization matches
          ansible.builtin.set_fact:
            root_post_auth_matches: []
          when: authorization_required

        - name: Find device in root after authorization
          ansible.builtin.set_fact:
            root_post_auth_matches: >-
              {{
                root_post_auth_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ root_after_authorization_list | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: authorization_required

        - name: Validate post-authorization root device
          ansible.builtin.assert:
            that:
              - root_post_auth_matches | length == 1
              - root_post_auth_matches[0].ip | default('') | string | trim == expected_management_ip
            fail_msg: >-
              After authorization, the FortiGate was not uniquely and
              correctly found in root ADOM.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}
              Matches={{ root_post_auth_matches | to_nice_json }}
          when: authorization_required

        # ====================================================
        # 9. REFRESH DEVICE INFORMATION IN CURRENT ADOM
        #
        # Refresh before moving is useful for making sure FMG has
        # current metadata including management IP/platform.
        # ====================================================

        - name: Determine current managed device name
          ansible.builtin.set_fact:
            current_device_name: >-
              {{
                target_adom_serial_matches[0].name
                if device_in_target_adom
                else
                (
                  root_post_auth_matches[0].name
                  if (authorization_required and root_post_auth_matches | default([]) | length == 1)
                  else
                  (
                    root_serial_matches[0].name
                    if root_serial_matches | default([]) | length == 1
                    else
                    global_device.name
                  )
                )
              }}

        - name: Display current FortiManager device name
          ansible.builtin.debug:
            msg: "Current FortiManager device name: {{ current_device_name }}"

        - name: Determine current ADOM for device
          ansible.builtin.set_fact:
            current_device_adom: >-
              {{
                expected_adom
                if device_in_target_adom
                else
                (
                  'root'
                  if (
                    (root_serial_matches | default([]) | length == 1)
                    or authorization_required
                  )
                  else global_device_adom
                )
              }}

        - name: Validate current ADOM before refresh/move
          ansible.builtin.assert:
            that:
              - current_device_adom | string | length > 0
              - >-
                current_device_adom == expected_adom
                or
                current_device_adom == 'root'
            fail_msg: >-
              Unexpected current ADOM '{{ current_device_adom }}'.
              Expected either target '{{ expected_adom }}' or root.

        - name: Refresh managed FortiGate information
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 60
              method: exec
              params:
                - url: "/dvm/cmd/update/device"
                  data:
                    adom: "{{ current_device_adom }}"
                    device: "{{ current_device_name }}"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: refresh_response

        - name: Validate refresh request
          ansible.builtin.assert:
            that:
              - refresh_response.json.result is defined
              - refresh_response.json.result | length > 0
              - refresh_response.json.result[0].status.code | int == 0
              - refresh_response.json.result[0].data is defined
              - >-
                (
                  refresh_response.json.result[0].data.taskid is defined
                )
                or
                (
                  refresh_response.json.result[0].data.task is defined
                )
            fail_msg: >-
              FortiManager failed to start device refresh.

              Response:
              {{ refresh_response.json | to_nice_json }}

        - name: Save refresh task ID
          ansible.builtin.set_fact:
            refresh_task_id: >-
              {{
                refresh_response.json.result[0].data.taskid
                | default(
                    refresh_response.json.result[0].data.task
                  )
              }}

        - name: Wait for refresh task
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 61
              method: get
              params:
                - url: "/task/task/{{ refresh_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: refresh_task_status
          until:
            - refresh_task_status.json.result is defined
            - refresh_task_status.json.result | length > 0
            - refresh_task_status.json.result[0].status.code | int == 0
            - >-
              (
                refresh_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: "{{ task_retries }}"
          delay: "{{ task_delay_seconds }}"

        - name: Validate refresh task result
          ansible.builtin.assert:
            that:
              - refresh_task_status.json.result[0].data.percent | default(0) | int >= 100
              - refresh_task_status.json.result[0].data.num_err | default(0) | int == 0
            fail_msg: >-
              FortiManager device refresh completed with errors.

              Task data:
              {{ refresh_task_status.json.result[0].data | to_nice_json }}

        # ====================================================
        # 10. IF NOT IN TARGET ADOM, MOVE FROM ROOT TO TARGET
        #
        # Fortinet's documented move operation is:
        #
        #   add /dvmdb/adom/<target>/object member
        #
        #   {
        #       name: <device>,
        #       vdom: <vdom>
        #   }
        #
        # No manual root deletion is performed.
        # ====================================================

        - name: Move managed device from root to target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 70
              method: add
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/object member"
                  data:
                    name: "{{ current_device_name }}"
                    vdom: "{{ expected_vdom }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: move_adom_response
          when:
            - not device_in_target_adom
            - expected_adom != 'root'
            - current_device_adom == 'root'

        - name: Validate ADOM move response
          ansible.builtin.assert:
            that:
              - move_adom_response.json.result is defined
              - move_adom_response.json.result | length > 0
              - move_adom_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to move device '{{ current_device_name }}' from root
              to target ADOM '{{ expected_adom }}'.

              Response:
              {{
                move_adom_response.json
                if move_adom_response.json is defined
                else move_adom_response
              }}
          when:
            - not device_in_target_adom
            - expected_adom != 'root'
            - current_device_adom == 'root'

        # ====================================================
        # 11. WAIT FOR TARGET ADOM PLACEMENT
        # ====================================================

        - name: Wait for device to appear in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 80
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: target_after_move_response
          until:
            - target_after_move_response.json.result is defined
            - target_after_move_response.json.result | length > 0
            - target_after_move_response.json.result[0].status.code | int == 0
            - >-
              (
                target_after_move_response.json.result[0].data | default([])
                | selectattr('sn', 'defined')
                | map(attribute='sn')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | list
              ).count(normalized_device_serial) == 1
          retries: "{{ state_retries }}"
          delay: "{{ state_delay_seconds }}"

        - name: Build target device list after ADOM move
          ansible.builtin.set_fact:
            target_after_move_list: >-
              {{
                target_after_move_response.json.result[0].data
                | default([])
              }}

        - name: Initialize target post-move matches
          ansible.builtin.set_fact:
            target_post_move_matches: []

        - name: Find device in target ADOM after move
          ansible.builtin.set_fact:
            target_post_move_matches: >-
              {{
                target_post_move_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ target_after_move_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate exact target ADOM device identity
          ansible.builtin.assert:
            that:
              - target_post_move_matches | length == 1
              - target_post_move_matches[0].name is defined
              - target_post_move_matches[0].sn is defined
              - >-
                (
                  target_post_move_matches[0].sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - target_post_move_matches[0].ip is defined
              - target_post_move_matches[0].ip | string | trim == expected_management_ip
            fail_msg: >-
              Target ADOM device verification failed.

              Expected ADOM={{ expected_adom }}
              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              Matches:
              {{ target_post_move_matches | to_nice_json }}

        - name: Save final managed device
          ansible.builtin.set_fact:
            authorized_device_final: "{{ target_post_move_matches[0] }}"

        - name: Verify global ADOM ownership after move
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 81
              method: get
              params:
                - url: "/dvmdb/device"
                  option:
                    - "extra info"
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: global_after_move_response

        - name: Initialize global post-move serial matches
          ansible.builtin.set_fact:
            global_post_move_matches: []

        - name: Find device globally after move
          ansible.builtin.set_fact:
            global_post_move_matches: >-
              {{
                global_post_move_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: >-
            {{
              global_after_move_response.json.result[0].data
              | default([])
            }}
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate exact global ADOM ownership
          ansible.builtin.assert:
            that:
              - global_post_move_matches | length == 1
              - global_post_move_matches[0]['extra info'] is defined
              - global_post_move_matches[0]['extra info']['adom'] is defined
              - global_post_move_matches[0]['extra info']['adom'] == expected_adom
            fail_msg: >-
              Global FortiManager ADOM ownership verification failed.

              Expected ADOM={{ expected_adom }}
              Actual matches={{ global_post_move_matches | to_nice_json }}

        # ====================================================
        # 12. VERIFY ROOT NO LONGER CONTAINS THE DEVICE
        #
        # This is an important migration proof.
        # ====================================================

        - name: Re-read root ADOM after migration
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 82
              method: get
              params:
                - url: "/dvmdb/adom/root/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: root_after_move_response
          when: expected_adom != 'root'

        - name: Initialize root post-move matches
          ansible.builtin.set_fact:
            root_post_move_matches: []
          when: expected_adom != 'root'

        - name: Find migrated device in root
          ansible.builtin.set_fact:
            root_post_move_matches: >-
              {{
                root_post_move_matches
                +
                (
                  [item]
                  if
                  (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: >-
            {{
              root_after_move_response.json.result[0].data
              | default([])
            }}
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: expected_adom != 'root'

        - name: Confirm device is no longer in root ADOM
          ansible.builtin.assert:
            that:
              - root_post_move_matches | length == 0
            fail_msg: >-
              Device '{{ authorized_device_final.name }}' is still present
              in root ADOM after the migration to '{{ expected_adom }}'.

              Root matches={{ root_post_move_matches | to_nice_json }}

              No policy-package assignment will be attempted.
          when: expected_adom != 'root'

        # ====================================================
        # 13. VERIFY FINAL DEVICE IP IN TARGET ADOM
        # ====================================================

        - name: Mandatory final management IP verification
          ansible.builtin.assert:
            that:
              - authorized_device_final.ip is defined
              - authorized_device_final.ip | string | trim | length > 0
              - authorized_device_final.ip | string | trim == expected_management_ip
            fail_msg: >-
              Final FortiManager management IP verification failed.

              Expected IP={{ expected_management_ip }}
              FMG IP={{ authorized_device_final.ip | default('not available') }}

              The policy-package Installation Target will NOT be modified.

        - name: Display final managed device identity
          ansible.builtin.debug:
            msg:
              - "===================================================="
              - "TARGET ADOM DEVICE VERIFIED"
              - "===================================================="
              - "ADOM        : {{ expected_adom }}"
              - "Device Name : {{ authorized_device_final.name }}"
              - "Serial      : {{ authorized_device_final.sn }}"
              - "Management IP: {{ authorized_device_final.ip }}"
              - "VDOM target : {{ expected_vdom }}"
              - "===================================================="

        # ====================================================
        # 14. VERIFY POLICY PACKAGE EXISTS IN TARGET ADOM
        # ====================================================

        - name: Get target policy package
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 90
              method: get
              params:
                - url: "/pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: policy_package_response

        - name: Validate policy package
          ansible.builtin.assert:
            that:
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name is defined
              - policy_package_response.json.result[0].data.name == expected_policy_package
            fail_msg: >-
              Policy package '{{ expected_policy_package }}' does not exist
              in target ADOM '{{ expected_adom }}'.
              No Installation Target change will be attempted.

        - name: Save policy package data
          ansible.builtin.set_fact:
            policy_package_data: "{{ policy_package_response.json.result[0].data }}"

        - name: Display policy package validation
          ansible.builtin.debug:
            msg:
              - "Policy package exists: YES"
              - "Policy package: {{ expected_policy_package }}"
              - "Policy package ADOM: {{ expected_adom }}"

        # ====================================================
        # 15. READ EXISTING INSTALLATION TARGETS
        # ====================================================

        - name: Read existing policy package scope members
          ansible.builtin.set_fact:
            existing_scope_members: >-
              {{
                policy_package_data['scope member']
                | default([])
              }}

        - name: Display existing scope members
          ansible.builtin.debug:
            msg:
              - "Policy package: {{ expected_policy_package }}"
              - "Existing Installation Targets:"
              - "{{ existing_scope_members | to_nice_json }}"

        # ====================================================
        # 16. ANALYZE SCOPE MEMBERS SAFELY
        # ====================================================

        - name: Find exact device + VDOM Installation Target matches
          ansible.builtin.set_fact:
            exact_scope_matches: >-
              {{
                existing_scope_members
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device_final.name)
                | selectattr('vdom', 'equalto', expected_vdom)
                | list
              }}

        - name: Find same-device scope entries regardless of VDOM
          ansible.builtin.set_fact:
            same_device_scope_matches: >-
              {{
                existing_scope_members
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', authorized_device_final.name)
                | list
              }}

        - name: Validate scope does not contain an ambiguous VDOM mapping
          ansible.builtin.assert:
            that:
              - same_device_scope_matches | length <= 1
              - exact_scope_matches | length <= 1
            fail_msg: >-
              Policy package '{{ expected_policy_package }}' contains an
              ambiguous Installation Target mapping for device
              '{{ authorized_device_final.name }}'.

              Expected VDOM={{ expected_vdom }}
              Existing same-device entries={{
                same_device_scope_matches | to_nice_json
              }}

              Refusing to add another target.

        - name: Determine whether Installation Target already exists
          ansible.builtin.set_fact:
            installation_target_exists: "{{ exact_scope_matches | length == 1 }}"

        - name: Detect wrong-VDOM existing target
          ansible.builtin.set_fact:
            wrong_vdom_target_exists: >-
              {{
                (
                  same_device_scope_matches | length == 1
                )
                and
                (
                  same_device_scope_matches[0].vdom != expected_vdom
                )
              }}

        - name: Refuse wrong-VDOM Installation Target
          ansible.builtin.assert:
            that:
              - not wrong_vdom_target_exists
            fail_msg: >-
              The policy package already contains device
              '{{ authorized_device_final.name }}' as an Installation Target
              with VDOM '{{ same_device_scope_matches[0].vdom }}', while the
              source of truth requires VDOM '{{ expected_vdom }}'.

              The playbook will not silently replace the existing mapping.

        # ====================================================
        # 17. ADD INSTALLATION TARGET
        # ====================================================
        #
        # IMPORTANT:
        # The Installation Target scope member is created with:
        #
        #   name = validated managed device name
        #   vdom = requested target VDOM
        #
        # The management IP is NOT invented into the scope-member
        # object; IP is validated independently against the device DB.
        # ====================================================

        - name: Add Installation Target to policy package
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 100
              method: add
              params:
                - url: >-
                    /pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}/scope member
                  data:
                    name: "{{ authorized_device_final.name }}"
                    vdom: "{{ expected_vdom }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: installation_target_add_response
          when: not installation_target_exists

        - name: Validate Installation Target add response
          ansible.builtin.assert:
            that:
              - installation_target_add_response.json.result is defined
              - installation_target_add_response.json.result | length > 0
              - installation_target_add_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to add '{{ authorized_device_final.name }}'
              (VDOM='{{ expected_vdom }}') as an Installation Target for
              policy package '{{ expected_policy_package }}'
              in ADOM '{{ expected_adom }}'.

              Response:
              {{
                installation_target_add_response.json
                if installation_target_add_response.json is defined
                else installation_target_add_response
              }}
          when: not installation_target_exists

        - name: Display Installation Target change status
          ansible.builtin.debug:
            msg: >-
              {{
                'Installation Target already existed and was verified.'
                if installation_target_exists
                else
                'Installation Target add request succeeded.'
              }}

        # ====================================================
        # 18. RE-READ POLICY PACKAGE AFTER CHANGE
        # ====================================================

        - name: Re-read policy package after Installation Target operation
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 110
              method: get
              params:
                - url: "/pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: final_policy_package_response

        - name: Validate final policy package response
          ansible.builtin.assert:
            that:
              - final_policy_package_response.json.result is defined
              - final_policy_package_response.json.result | length > 0
              - final_policy_package_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to re-read policy package '{{ expected_policy_package }}'
              after Installation Target operation.

        - name: Save final scope members
          ansible.builtin.set_fact:
            final_scope_members: >-
              {{
                final_policy_package_response.json.result[0].data['scope member']
                | default([])
              }}

        - name: Recalculate exact final Installation Target matches
          ansible.builtin.set_fact:
            final_exact_scope_matches: >-
              {{
                final_scope_members
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device_final.name)
                | selectattr('vdom', 'equalto', expected_vdom)
                | list
              }}

        - name: Verify exactly one final Installation Target
          ansible.builtin.assert:
            that:
              - final_exact_scope_matches | length == 1
            fail_msg: >-
              FINAL Installation Target verification failed.

              Required:
                ADOM={{ expected_adom }}
                Policy Package={{ expected_policy_package }}
                Device={{ authorized_device_final.name }}
                VDOM={{ expected_vdom }}
                Management IP={{ expected_management_ip }}

              Actual scope:
              {{ final_scope_members | to_nice_json }}

        # ====================================================
        # 19. FINAL CROSS-CHECK
        #
        # Re-validate the managed device in target ADOM at the
        # exact end of the operation.
        # ====================================================

        - name: Final re-read of target ADOM devices
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 120
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          register: final_target_device_response

        - name: Find final target ADOM device
          ansible.builtin.set_fact:
            final_target_device_matches: >-
              {{
                final_target_device_response.json.result[0].data
                | default([])
                | selectattr('sn', 'defined')
                | selectattr(
                    'sn',
                    'equalto',
                    authorized_device_final.sn
                  )
                | list
              }}

        - name: Final exact device + IP verification
          ansible.builtin.assert:
            that:
              - final_target_device_matches | length == 1
              - final_target_device_matches[0].ip is defined
              - final_target_device_matches[0].ip | string | trim == expected_management_ip
            fail_msg: >-
              Final target ADOM device/IP verification failed.

              Expected ADOM={{ expected_adom }}
              Expected Device={{ authorized_device_final.name }}
              Expected IP={{ expected_management_ip }}

              Matches:
              {{ final_target_device_matches | to_nice_json }}

        # ====================================================
        # 20. SUCCESS SUMMARY
        # ====================================================

        - name: STEP 04 SUCCESS
          ansible.builtin.debug:
            msg:
              - ""
              - "============================================================"
              - "STEP 04 STATUS: SUCCESS"
              - "============================================================"
              - "FortiGate serial       : {{ authorized_device_final.sn }}"
              - "FortiManager device    : {{ authorized_device_final.name }}"
              - "Management IP          : {{ authorized_device_final.ip }}"
              - "Target ADOM            : {{ expected_adom }}"
              - "Target VDOM            : {{ expected_vdom }}"
              - "Policy Package         : {{ expected_policy_package }}"
              - "ADOM ownership         : VERIFIED"
              - "Management IP          : VERIFIED"
              - "Root migration         : VERIFIED"
              - "Installation Target   : VERIFIED"
              - "Device + VDOM scope  : VERIFIED"
              - "Policy installation   : NOT PERFORMED"
              - "============================================================"

      # ======================================================
      # ERROR HANDLING
      # ======================================================

      rescue:

        - name: Display Step 04 failure context
          ansible.builtin.debug:
            msg:
              - ""
              - "============================================================"
              - "STEP 04 STATUS: FAILED"
              - "============================================================"
              - "NetBox asset_tag : {{ netbox_asset_tag }}"
              - "Serial           : {{ selected_firewall.serial }}"
              - "Expected IP      : {{ expected_management_ip }}"
              - "Target ADOM      : {{ expected_adom }}"
              - "Target VDOM      : {{ expected_vdom }}"
              - "Policy Package   : {{ expected_policy_package }}"
              - ""
              - "No policy package installation was triggered."
              - "The workflow stopped before any unsafe next step."
              - "============================================================"

        - name: Fail Step 04
          ansible.builtin.fail:
            msg: >-
              STEP 04 failed. Review the immediately preceding task output
              for the exact FortiManager API response and state mismatch.

      # ======================================================
      # ALWAYS LOGOUT
      # ======================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            body:
              id: 999
              method: exec
              params:
                - url: "/sys/logout"
              session: "{{ fmg_session }}"
              verbose: 1
            status_code: 200
          when: fmg_session is defined
          no_log: true

        - name: Display logout status
          ansible.builtin.debug:
            msg: "FortiManager API session closed."
          when: fmg_session is defined
