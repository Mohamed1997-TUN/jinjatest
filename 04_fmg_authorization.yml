---
# ============================================================
# STEP 04 - FortiManager Direct ADOM Authorization +
#           Policy Package Installation Target
# ============================================================
#
# OBJECTIVE
# ---------
# Starting state:
#
#   FortiManager
#     ADOM: root (GUI context)
#       Unauthorized Devices
#         -> FortiGate
#
# Desired state:
#
#   FortiManager
#     ADOM: <target_adom>
#       Managed FortiGate
#         -> correct management IP
#         -> correct policy package
#         -> Installation Target
#
# IMPORTANT:
#   The Unauthorized Devices view is shown under root, but the
#   device does NOT need to be promoted to a managed device in
#   root first.
#
#   For a first-time unauthorized device we use:
#
#       promote_unreg
#       adom = <target_adom>
#
#   This means:
#
#       Unauthorized Devices -> target ADOM
#
#   No root -> target ADOM migration is performed.
#
# VDOM POLICY
# -----------
#   VDOM is NOT treated as the primary device-placement key.
#
#   We do NOT perform an independent "does this device currently
#   have VDOM X?" verification.
#
#   However, FortiManager's Installation Target record uses:
#
#       name + vdom
#
#   Therefore installation_target_vdom is still sent to the Installation
#   Target API, and the final policy-package check verifies that
#   the stored target contains the requested device + requested
#   VDOM. This verifies the target mapping itself, not a separate
#   device VDOM inventory.
#
# IP POLICY
# ---------
#   Management IP is mandatory because it protects us from
#   selecting the wrong FortiGate with a matching/normalized
#   serial or wrong device name.
#
# SOURCE OF TRUTH
# ---------------
#   NetBox asset_tag
#       |
#       v
#   vars/firewalls.vars
#
# Required fields in the selected firewall record:
#   serial
#   hostname
#   management_ip
#   target_adom
#   target_vdom
#   policy_package
#
# SAFETY
# ------
# - Serial is normalized only for comparison.
# - Real FortiManager serial is never modified.
# - Target ADOM must exist before authorization.
# - Unauthorized device serial + IP must match the source of truth.
# - Authorization is sent directly to target ADOM.
# - Device must appear in target ADOM after authorization.
# - Device serial + management IP are revalidated.
# - Policy package must exist in that same ADOM.
# - Existing wrong-VDOM target is never silently changed.
# - Duplicate target state causes a hard failure.
# - No policy package installation is performed.
# - No rescue block is used intentionally: the exact failing task
#   must remain visible in AWX. Logout is handled in always.
#
# ============================================================

- name: STEP 04 - Direct ADOM authorization and Installation Target
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_jsonrpc_url: "https://{{ fortimanager_host }}/jsonrpc"

    # Read firewalls.vars as raw YAML.
    # This avoids evaluating unrelated variables in that file
    # before the requested firewall is selected.
    firewall_data: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir + '/vars/firewalls.vars'
        )
        | from_yaml
      }}

    firewall_records: >-
      {{
        firewall_data.firewalls
        | default(firewall_data)
      }}

    netbox_asset_tag: >-
      {{
        hostvars[inventory_hostname]['asset_tag']
        | default('')
        | string
        | trim
      }}

    api_timeout_seconds: 30

    authorization_task_retries: 36
    authorization_task_delay: 5

    adom_state_retries: 30
    adom_state_delay: 5

  tasks:

    # ========================================================
    # 1. SELECT SOURCE-OF-TRUTH RECORD
    # ========================================================

    - name: Display NetBox source-of-truth information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "STEP 04 - SOURCE OF TRUTH"
          - "============================================================"
          - "Inventory host : {{ inventory_hostname }}"
          - "Asset tag      : {{ netbox_asset_tag }}"
          - "============================================================"

    - name: Validate NetBox asset_tag
      ansible.builtin.assert:
        that:
          - netbox_asset_tag | length > 0
        fail_msg: >-
          NetBox asset_tag is empty for '{{ inventory_hostname }}'.
          The asset_tag must contain the FortiGate serial.

    - name: Select firewall from firewalls.vars
      ansible.builtin.set_fact:
        selected_firewalls: >-
          {{
            firewall_records
            | selectattr('serial', 'defined')
            | selectattr('serial', 'equalto', netbox_asset_tag)
            | list
          }}

    - name: Validate exactly one firewall record
      ansible.builtin.assert:
        that:
          - selected_firewalls | length == 1
        fail_msg: >-
          Expected exactly one firewall record matching asset_tag
          '{{ netbox_asset_tag }}', but found
          {{ selected_firewalls | length }}.

    - name: Save selected firewall
      ansible.builtin.set_fact:
        selected_firewall: "{{ selected_firewalls[0] }}"

    - name: Validate required firewall attributes
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | trim | length > 0
          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | trim | length > 0
          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | trim | length > 0
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | trim | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | trim | length > 0
        fail_msg: >-
          The selected firewall definition is incomplete.
          Required fields:
          serial, hostname, management_ip, target_adom, target_vdom,
          policy_package.

    - name: Normalize source-of-truth values
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            selected_firewall.serial
            | string
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}
        expected_adom: "{{ selected_firewall.target_adom | string | trim }}"
        source_target_vdom: >-
          {{
            selected_firewall.target_vdom
            | default('')
            | string
            | trim
          }}
        expected_policy_package: "{{ selected_firewall.policy_package | string | trim }}"
        expected_management_ip: "{{ selected_firewall.management_ip | string | trim }}"

    - name: Display selected firewall mapping
      ansible.builtin.debug:
        msg:
          - "Expected serial        : {{ selected_firewall.serial }}"
          - "Normalized serial      : {{ normalized_device_serial }}"
          - "Expected hostname      : {{ selected_firewall.hostname }}"
          - "Expected management IP : {{ expected_management_ip }}"
          - "Target ADOM            : {{ expected_adom }}"
          - "Target VDOM            : {{ installation_target_vdom }}"
          - "Policy Package         : {{ expected_policy_package }}"

    # ========================================================
    # 2. LOGIN
    # ========================================================

    - name: Login to FortiManager
      ansible.builtin.uri:
        url: "{{ fmg_jsonrpc_url }}"
        method: POST
        validate_certs: false
        return_content: true
        body_format: json
        timeout: "{{ api_timeout_seconds }}"
        status_code: 200
        body:
          id: 1
          method: exec
          params:
            - url: "/sys/login/user"
              data:
                user: "{{ fortimanager_user }}"
                passwd: "{{ fortimanager_password }}"
          verbose: 1
      register: fmg_login
      no_log: true

    - name: Validate FortiManager login
      ansible.builtin.assert:
        that:
          - fmg_login.json is defined
          - fmg_login.json.result is defined
          - fmg_login.json.result | length > 0
          - fmg_login.json.result[0].status is defined
          - fmg_login.json.result[0].status.code | int == 0
          - fmg_login.json.session is defined
          - fmg_login.json.session | string | length > 0
        fail_msg: >-
          FortiManager login failed.
          HTTP={{ fmg_login.status | default('unknown') }},
          RPC={{
            fmg_login.json.result[0].status.code
            if (
              fmg_login.json is defined
              and fmg_login.json.result is defined
              and fmg_login.json.result | length > 0
              and fmg_login.json.result[0].status is defined
            )
            else 'unknown'
          }},
          message={{
            fmg_login.json.result[0].status.message
            if (
              fmg_login.json is defined
              and fmg_login.json.result is defined
              and fmg_login.json.result | length > 0
              and fmg_login.json.result[0].status is defined
            )
            else 'unknown'
          }}.

    - name: Save FortiManager session
      ansible.builtin.set_fact:
        fmg_session: "{{ fmg_login.json.session }}"

    - name: Display login success
      ansible.builtin.debug:
        msg:
          - "FortiManager login : SUCCESS"
          - "Session returned   : YES"

    # ========================================================
    # MAIN WORKFLOW
    # ========================================================

    - name: Execute Step 04 workflow
      block:

        # ====================================================
        # 3. TARGET ADOM MUST EXIST
        # ====================================================

        - name: Get FortiManager ADOMs
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 10
              method: get
              params:
                - url: "/dvmdb/adom/"
                  fields:
                    - name
                    - oid
              session: "{{ fmg_session }}"
              verbose: 1
          register: fmg_adoms

        - name: Validate ADOM response
          ansible.builtin.assert:
            that:
              - fmg_adoms.json.result is defined
              - fmg_adoms.json.result | length > 0
              - fmg_adoms.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve the ADOM database.

        - name: Build FortiManager ADOM list
          ansible.builtin.set_fact:
            fmg_adom_list: "{{ fmg_adoms.json.result[0].data | default([]) }}"

        - name: Find requested target ADOM
          ansible.builtin.set_fact:
            target_adom_matches: >-
              {{
                fmg_adom_list
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', expected_adom)
                | list
              }}

        - name: Validate target ADOM
          ansible.builtin.assert:
            that:
              - target_adom_matches | length == 1
            fail_msg: >-
              Target ADOM '{{ expected_adom }}' does not exist uniquely.
              Matches={{ target_adom_matches | length }}.

        - name: Display target ADOM
          ansible.builtin.debug:
            msg:
              - "Target ADOM exists : YES"
              - "Target ADOM         : {{ expected_adom }}"
              - "Target ADOM OID     : {{ target_adom_matches[0].oid | default('unknown') }}"

        # ====================================================
        # 4. CHECK WHETHER DEVICE IS ALREADY IN TARGET ADOM
        # ====================================================

        - name: Get devices in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 20
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
          register: target_adom_devices_response

        - name: Validate target ADOM devices response
          ansible.builtin.assert:
            that:
              - target_adom_devices_response.json.result is defined
              - target_adom_devices_response.json.result | length > 0
              - target_adom_devices_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Failed to retrieve devices from target ADOM
              '{{ expected_adom }}'.

        - name: Build target ADOM device list
          ansible.builtin.set_fact:
            target_adom_device_list: >-
              {{
                target_adom_devices_response.json.result[0].data
                | default([])
              }}

        - name: Initialize target ADOM serial matches
          ansible.builtin.set_fact:
            target_adom_serial_matches: []

        - name: Match expected serial in target ADOM
          ansible.builtin.set_fact:
            target_adom_serial_matches: >-
              {{
                target_adom_serial_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ target_adom_device_list }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"

        - name: Validate target ADOM serial uniqueness
          ansible.builtin.assert:
            that:
              - target_adom_serial_matches | length <= 1
            fail_msg: >-
              More than one device in ADOM '{{ expected_adom }}' matches
              serial '{{ selected_firewall.serial }}'. Refusing to continue.

        - name: Set target ADOM placement state
          ansible.builtin.set_fact:
            device_already_in_target_adom: >-
              {{ target_adom_serial_matches | length == 1 }}

        - name: Save existing target ADOM device
          ansible.builtin.set_fact:
            managed_device: "{{ target_adom_serial_matches[0] }}"
          when: device_already_in_target_adom

        # ====================================================
        # 5. DISCOVER THE ACTUAL UNAUTHORIZED DEVICE
        #
        # Only used when the device is not already in the target ADOM.
        # ====================================================

        - name: Get Unauthorized Devices
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 30
              method: get
              params:
                - url: "/dvmdb/device"
                  fields:
                    - name
                    - sn
                    - ip
                    - mgmt_mode
                    - oid
                    - platform_str
                  filter:
                    - mgmt_mode
                    - "=="
                    - "unreg"
              session: "{{ fmg_session }}"
              verbose: 1
          register: unauthorized_response
          when: not device_already_in_target_adom

        - name: Validate Unauthorized Devices response
          ansible.builtin.assert:
            that:
              - unauthorized_response.json.result is defined
              - unauthorized_response.json.result | length > 0
              - unauthorized_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager failed to retrieve Unauthorized Devices.
          when: not device_already_in_target_adom

        - name: Build Unauthorized Devices list
          ansible.builtin.set_fact:
            unauthorized_device_list: >-
              {{
                unauthorized_response.json.result[0].data
                | default([])
              }}
          when: not device_already_in_target_adom

        - name: Initialize unauthorized serial matches
          ansible.builtin.set_fact:
            unauthorized_serial_matches: []
          when: not device_already_in_target_adom

        - name: Match expected serial in Unauthorized Devices
          ansible.builtin.set_fact:
            unauthorized_serial_matches: >-
              {{
                unauthorized_serial_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ unauthorized_device_list | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: not device_already_in_target_adom

        - name: Validate unauthorized serial uniqueness
          ansible.builtin.assert:
            that:
              - unauthorized_serial_matches | length <= 1
            fail_msg: >-
              Multiple Unauthorized Devices match serial
              '{{ selected_firewall.serial }}'. Refusing to continue.
          when: not device_already_in_target_adom

        - name: Require the expected device to be either in target ADOM or unauthorized
          ansible.builtin.assert:
            that:
              - device_already_in_target_adom or unauthorized_serial_matches | length == 1
            fail_msg: >-
              The FortiGate '{{ selected_firewall.serial }}' is not in target
              ADOM '{{ expected_adom }}' and was not found in Unauthorized
              Devices. The playbook will not guess another device/state.
          when: not device_already_in_target_adom

        - name: Save unauthorized device
          ansible.builtin.set_fact:
            unauthorized_device: "{{ unauthorized_serial_matches[0] }}"
          when:
            - not device_already_in_target_adom
            - unauthorized_serial_matches | length == 1

        # ====================================================
        # 6. VALIDATE UNAUTHORIZED DEVICE IDENTITY
        # ====================================================

        - name: Validate unauthorized serial and management IP
          ansible.builtin.assert:
            that:
              - unauthorized_device.name is defined
              - unauthorized_device.sn is defined
              - unauthorized_device.ip is defined
              - >-
                (
                  unauthorized_device.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - unauthorized_device.ip | string | trim == expected_management_ip
            fail_msg: >-
              Unauthorized device identity does not match the source of truth.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              FortiManager unauthorized device:
              {{ unauthorized_device | to_nice_json }}
          when: not device_already_in_target_adom

        - name: Display direct authorization target
          ansible.builtin.debug:
            msg:
              - "Unauthorized device found: YES"
              - "Device name       : {{ unauthorized_device.name }}"
              - "Serial             : {{ unauthorized_device.sn }}"
              - "Management IP      : {{ unauthorized_device.ip }}"
              - "DIRECT TARGET ADOM : {{ expected_adom }}"
          when: not device_already_in_target_adom

        # ====================================================
        # 7. DIRECT UNAUTHORIZED -> TARGET ADOM
        #
        # IMPORTANT:
        # We deliberately do NOT authorize into root first.
        # ====================================================

        - name: Authorize unauthorized FortiGate directly into target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 40
              method: exec
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ expected_adom }}"
                    device:
                      name: "{{ unauthorized_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
              session: "{{ fmg_session }}"
              verbose: 1
          register: authorization_response
          when: not device_already_in_target_adom

        - name: Validate direct authorization response
          ansible.builtin.assert:
            that:
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - authorization_response.json.result[0].data is defined
              - >-
                (
                  authorization_response.json.result[0].data.taskid is defined
                )
                or
                (
                  authorization_response.json.result[0].data.task is defined
                )
                or
                (
                  authorization_response.json.result[0].data.device is defined
                )
            fail_msg: >-
              FortiManager rejected direct authorization of
              '{{ unauthorized_device.name }}' into ADOM '{{ expected_adom }}'.

              Response:
              {{ authorization_response.json | to_nice_json }}
          when: not device_already_in_target_adom

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.taskid
                | default(
                    authorization_response.json.result[0].data.task
                    | default('')
                  )
              }}
          when: not device_already_in_target_adom

        - name: Display authorization request result
          ansible.builtin.debug:
            msg:
              - "Direct authorization accepted"
              - "Target ADOM: {{ expected_adom }}"
              - "Task ID    : {{ authorization_task_id | default('not returned') }}"
          when: not device_already_in_target_adom

        # ====================================================
        # 8. WAIT FOR AUTHORIZATION TASK WHEN ASYNC
        # ====================================================

        - name: Wait for authorization task
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 41
              method: get
              params:
                - url: "/task/task/{{ authorization_task_id }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: authorization_task_status
          until:
            - authorization_task_status.json.result is defined
            - authorization_task_status.json.result | length > 0
            - authorization_task_status.json.result[0].status.code | int == 0
            - >-
              (
                authorization_task_status.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          retries: "{{ authorization_task_retries }}"
          delay: "{{ authorization_task_delay }}"
          when:
            - not device_already_in_target_adom
            - authorization_task_id | default('') | string | length > 0

        - name: Validate authorization task result
          ansible.builtin.assert:
            that:
              - authorization_task_status.json.result[0].data.percent | default(0) | int >= 100
              - authorization_task_status.json.result[0].data.num_err | default(0) | int == 0
            fail_msg: >-
              Direct authorization task failed.

              Task data:
              {{ authorization_task_status.json.result[0].data | to_nice_json }}
          when:
            - not device_already_in_target_adom
            - authorization_task_id | default('') | string | length > 0

        # ====================================================
        # 9. VERIFY DEVICE IS NOW INSIDE TARGET ADOM
        # ====================================================

        - name: Wait for FortiGate to appear in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 50
              method: get
              params:
                - url: "/dvmdb/adom/{{ expected_adom }}/device"
                  option:
                    - "no loadsub"
              session: "{{ fmg_session }}"
              verbose: 1
          register: target_after_auth_response
          until:
            - target_after_auth_response.json.result is defined
            - target_after_auth_response.json.result | length > 0
            - target_after_auth_response.json.result[0].status.code | int == 0
            - >-
              (
                target_after_auth_response.json.result[0].data | default([])
                | selectattr('sn', 'defined')
                | map(attribute='sn')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | list
              ).count(normalized_device_serial) == 1
          retries: "{{ adom_state_retries }}"
          delay: "{{ adom_state_delay }}"
          when: not device_already_in_target_adom

        - name: Build target ADOM list after authorization
          ansible.builtin.set_fact:
            target_after_auth_list: >-
              {{
                target_after_auth_response.json.result[0].data
                | default([])
              }}
          when: not device_already_in_target_adom

        - name: Initialize post-authorization matches
          ansible.builtin.set_fact:
            post_authorization_matches: []
          when: not device_already_in_target_adom

        - name: Find device in target ADOM after authorization
          ansible.builtin.set_fact:
            post_authorization_matches: >-
              {{
                post_authorization_matches
                +
                (
                  [item]
                  if (
                    item.sn is defined
                    and
                    (
                      item.sn
                      | string
                      | regex_replace('[^A-Za-z0-9]', '')
                      | upper
                    ) == normalized_device_serial
                  )
                  else []
                )
              }}
          loop: "{{ target_after_auth_list | default([]) }}"
          loop_control:
            label: "{{ item.name | default('unknown') }}"
          when: not device_already_in_target_adom

        - name: Validate device in target ADOM
          ansible.builtin.assert:
            that:
              - post_authorization_matches | length == 1
              - post_authorization_matches[0].name is defined
              - post_authorization_matches[0].sn is defined
              - >-
                (
                  post_authorization_matches[0].sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - post_authorization_matches[0].ip is defined
              - post_authorization_matches[0].ip | string | trim == expected_management_ip
            fail_msg: >-
              The device was authorized but was not correctly placed in
              target ADOM '{{ expected_adom }}'.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              Matches:
              {{ post_authorization_matches | to_nice_json }}
          when: not device_already_in_target_adom

        - name: Save managed device
          ansible.builtin.set_fact:
            managed_device: >-
              {{
                post_authorization_matches[0]
                if not device_already_in_target_adom
                else managed_device
              }}

        # ====================================================
        # 10. FINAL DEVICE + IP CHECK
        #
        # ADOM is the primary placement boundary.
        #
        # We do NOT independently validate a requested VDOM against
        # the device as a separate placement decision.
        #
        # FortiManager still requires a VDOM value in the policy-
        # package Installation Target scope member. Therefore:
        #
        #   - single-VDOM device -> derive the only VDOM reported by FMG
        #   - multi-VDOM device  -> use source_target_vdom, but only if
        #                           it exists on the device
        #
        # This is exactly aligned with the observed device:
        #   maxvdom = 1
        #   vdom    = [ { name: "root" } ]
        #
        # Therefore Installation Target VDOM = root.
        # ====================================================

        - name: Verify managed device identity and management IP
          ansible.builtin.assert:
            that:
              - managed_device.name is defined
              - managed_device.sn is defined
              - >-
                (
                  managed_device.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
              - managed_device.ip is defined
              - managed_device.ip | string | trim == expected_management_ip
            fail_msg: >-
              Final managed-device identity verification failed.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              Managed device:
              {{ managed_device | to_nice_json }}

        - name: Extract actual FortiGate VDOM inventory
          ansible.builtin.set_fact:
            managed_device_vdoms: >-
              {{
                managed_device.vdom
                | default([])
                | selectattr('name', 'defined')
                | map(attribute='name')
                | list
              }}

        - name: Validate FortiManager returned at least one VDOM
          ansible.builtin.assert:
            that:
              - managed_device_vdoms | length >= 1
            fail_msg: >-
              FortiManager returned no usable VDOM for device
              '{{ managed_device.name }}'. The policy-package target
              cannot be built safely.

        - name: Determine Installation Target VDOM
          ansible.builtin.set_fact:
            installation_target_vdom: >-
              {{
                managed_device_vdoms[0]
                if managed_device_vdoms | length == 1
                else source_target_vdom
              }}

        - name: Validate Installation Target VDOM selection for multi-VDOM device
          ansible.builtin.assert:
            that:
              - installation_target_vdom | string | trim | length > 0
              - installation_target_vdom in managed_device_vdoms
            fail_msg: >-
              FortiManager reports multiple VDOMs for device
              '{{ managed_device.name }}', but the requested VDOM is not
              valid.

              Available VDOMs={{ managed_device_vdoms | to_nice_json }}
              Source VDOM hint={{ source_target_vdom | default('not provided') }}

        - name: Display target ADOM device verification
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "TARGET ADOM DEVICE VERIFIED"
              - "============================================================"
              - "ADOM                 : {{ expected_adom }}"
              - "Device               : {{ managed_device.name }}"
              - "Serial               : {{ managed_device.sn }}"
              - "Management IP        : {{ managed_device.ip }}"
              - "Available VDOMs      : {{ managed_device_vdoms }}"
              - "Installation VDOM    : {{ installation_target_vdom }}"
              - "============================================================"

        - name: Report ignored VDOM hint for single-VDOM device
          ansible.builtin.debug:
            msg:
              - >-
                Source target_vdom '{{ source_target_vdom }}' is not used
                because FortiManager reports the single VDOM
                '{{ installation_target_vdom }}' on this device.
              - >-
                The target ADOM '{{ expected_adom }}' remains the primary
                placement boundary.
          when:
            - managed_device_vdoms | length == 1
            - source_target_vdom | length > 0
            - source_target_vdom != installation_target_vdom

        # ====================================================
        # 11. VERIFY POLICY PACKAGE IN THE SAME ADOM
        # ====================================================

        - name: Get policy package in target ADOM
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 80
              method: get
              params:
                - url: "/pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: policy_package_response

        - name: Validate target policy package
          ansible.builtin.assert:
            that:
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name is defined
              - policy_package_response.json.result[0].data.name == expected_policy_package
            fail_msg: >-
              Policy package '{{ expected_policy_package }}' was not found
              in target ADOM '{{ expected_adom }}'.

        - name: Save policy package data
          ansible.builtin.set_fact:
            policy_package_data: "{{ policy_package_response.json.result[0].data }}"

        - name: Display policy package validation
          ansible.builtin.debug:
            msg:
              - "Policy Package : {{ expected_policy_package }}"
              - "Policy ADOM     : {{ expected_adom }}"
              - "Policy Exists   : YES"

        # ====================================================
        # 12. READ CURRENT PACKAGE INSTALLATION TARGETS
        # ====================================================

        - name: Read current package Installation Targets
          ansible.builtin.set_fact:
            existing_scope_members: >-
              {{
                policy_package_data['scope member']
                | default([])
              }}

        - name: Display current Installation Targets
          ansible.builtin.debug:
            msg:
              - "Policy Package : {{ expected_policy_package }}"
              - "Current Targets:"
              - "{{ existing_scope_members | to_nice_json }}"

        - name: Find exact device + VDOM target
          ansible.builtin.set_fact:
            exact_target_matches: >-
              {{
                existing_scope_members
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', managed_device.name)
                | selectattr('vdom', 'equalto', installation_target_vdom)
                | list
              }}

        - name: Find same-device target entries
          ansible.builtin.set_fact:
            same_device_targets: >-
              {{
                existing_scope_members
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', managed_device.name)
                | list
              }}

        - name: Reject ambiguous target state
          ansible.builtin.assert:
            that:
              - exact_target_matches | length <= 1
              - same_device_targets | length <= 1
            fail_msg: >-
              Policy package '{{ expected_policy_package }}' contains an
              ambiguous Installation Target state for device
              '{{ managed_device.name }}'.

              Existing targets:
              {{ existing_scope_members | to_nice_json }}

        - name: Determine target status
          ansible.builtin.set_fact:
            installation_target_exists: "{{ exact_target_matches | length == 1 }}"
            wrong_vdom_target_exists: >-
              {{
                same_device_targets | length == 1
                and
                (
                  same_device_targets[0].vdom | default('')
                ) != installation_target_vdom
              }}

        - name: Refuse existing wrong-VDOM target
          ansible.builtin.assert:
            that:
              - not wrong_vdom_target_exists
            fail_msg: >-
              The policy package already contains device
              '{{ managed_device.name }}' as an Installation Target with
              a different VDOM.

              Existing VDOM={{
                (
                  same_device_targets[0].vdom
                  if (same_device_targets | length > 0)
                  else 'unknown'
                )
              }}

              Expected VDOM={{ installation_target_vdom }}

              Existing targets:
              {{ existing_scope_members | to_nice_json }}

              The playbook will not silently change an existing mapping.

        - name: Display Installation Target pre-check
          ansible.builtin.debug:
            msg:
              - "ADOM             : {{ expected_adom }}"
              - "Policy Package   : {{ expected_policy_package }}"
              - "Device           : {{ managed_device.name }}"
              - "Management IP    : {{ managed_device.ip }}"
              - "Target VDOM      : {{ installation_target_vdom }}"
              - "Target exists    : {{ installation_target_exists }}"

        - name: Validate Installation Target API input
          ansible.builtin.assert:
            that:
              - expected_adom | length > 0
              - expected_policy_package | length > 0
              - managed_device.name is defined
              - managed_device.name | string | trim | length > 0
              - managed_device.ip is defined
              - managed_device.ip | string | trim == expected_management_ip
              - installation_target_vdom | length > 0
            fail_msg: >-
              Installation Target input validation failed before the API
              operation.

              ADOM={{ expected_adom }}
              Policy Package={{ expected_policy_package }}
              Device={{ managed_device.name | default('undefined') }}
              Device IP={{ managed_device.ip | default('undefined') }}
              Expected IP={{ expected_management_ip }}
              VDOM field={{ installation_target_vdom }}

        # ====================================================
        # 13. ADD PACKAGE INSTALLATION TARGET
        # ====================================================
        #
        # IMPORTANT:
        # This is the PACKAGE-LEVEL Installation Target endpoint.
        # It is different from a firewall-policy "Install On" scope.
        #
        # URL:
        #   /pm/pkg/adom/<adom>/<pkg>/scope member
        #
        # The package-level scope member represents the policy
        # package's Installation Targets.
        # ====================================================

        - name: Display final Installation Target write object
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "INSTALLATION TARGET WRITE"
              - "============================================================"
              - "ADOM          : {{ expected_adom }}"
              - "Policy Package: {{ expected_policy_package }}"
              - "Device        : {{ managed_device.name }}"
              - "Management IP : {{ managed_device.ip }}"
              - "VDOM          : {{ installation_target_vdom }}"
              - "Payload       : {{ {'name': managed_device.name, 'vdom': installation_target_vdom} | to_nice_json }}"
              - "============================================================"
          when: not installation_target_exists

        - name: Add device to policy package Installation Targets
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 90
              method: add
              params:
                - url: >-
                    /pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}/scope member
                  data:
                    name: "{{ managed_device.name }}"
                    vdom: "{{ installation_target_vdom }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: installation_target_add_response
          when: not installation_target_exists

        - name: Validate Installation Target API response
          ansible.builtin.assert:
            that:
              - installation_target_add_response.json.result is defined
              - installation_target_add_response.json.result | length > 0
              - installation_target_add_response.json.result[0].status.code | int == 0
            fail_msg: >-
              FortiManager rejected the Installation Target assignment.

              ADOM={{ expected_adom }}
              Policy Package={{ expected_policy_package }}
              Device={{ managed_device.name }}
              VDOM={{ installation_target_vdom }}

              Response:
              {{ installation_target_add_response.json | to_nice_json }}
          when: not installation_target_exists

        - name: Display Installation Target operation result
          ansible.builtin.debug:
            msg: >-
              {{
                'Installation Target already existed.'
                if installation_target_exists
                else
                'Installation Target API add succeeded.'
              }}

        # ====================================================
        # 14. RE-READ PACKAGE AND PROVE THE TARGET EXISTS
        # ====================================================

        - name: Re-read policy package after Installation Target operation
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 100
              method: get
              params:
                - url: "/pm/pkg/adom/{{ expected_adom }}/{{ expected_policy_package }}"
              session: "{{ fmg_session }}"
              verbose: 1
          register: final_policy_package_response

        - name: Validate final package response
          ansible.builtin.assert:
            that:
              - final_policy_package_response.json.result is defined
              - final_policy_package_response.json.result | length > 0
              - final_policy_package_response.json.result[0].status.code | int == 0
            fail_msg: >-
              Could not re-read policy package
              '{{ expected_policy_package }}' after Installation Target
              modification.

        - name: Save final scope members
          ansible.builtin.set_fact:
            final_scope_members: >-
              {{
                final_policy_package_response.json.result[0].data['scope member']
                | default([])
              }}

        - name: Find final exact Installation Target
          ansible.builtin.set_fact:
            final_exact_target_matches: >-
              {{
                final_scope_members
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', managed_device.name)
                | selectattr('vdom', 'equalto', installation_target_vdom)
                | list
              }}

        - name: Verify Installation Target exists exactly
          ansible.builtin.assert:
            that:
              - final_exact_target_matches | length == 1
              - final_exact_target_matches[0].name == managed_device.name
              - final_exact_target_matches[0].vdom == installation_target_vdom
            fail_msg: >-
              Installation Target was NOT verified after the API operation.

              Required:
                ADOM={{ expected_adom }}
                Policy Package={{ expected_policy_package }}
                Device={{ managed_device.name }}
                VDOM={{ installation_target_vdom }}

              Actual scope:
              {{ final_scope_members | to_nice_json }}

        # ====================================================
        # 15. FINAL DEVICE/IP CROSS-CHECK
        # ====================================================

        - name: Final mandatory management IP verification
          ansible.builtin.assert:
            that:
              - managed_device.ip is defined
              - managed_device.ip | string | trim == expected_management_ip
              - >-
                (
                  managed_device.sn
                  | string
                  | regex_replace('[^A-Za-z0-9]', '')
                  | upper
                ) == normalized_device_serial
            fail_msg: >-
              Final managed-device verification failed.

              Expected serial={{ selected_firewall.serial }}
              Expected IP={{ expected_management_ip }}

              Actual device:
              {{ managed_device | to_nice_json }}

        # ====================================================
        # 16. SUCCESS
        # ====================================================

        - name: STEP 04 final success
          ansible.builtin.debug:
            msg:
              - ""
              - "============================================================"
              - "STEP 04 STATUS: SUCCESS"
              - "============================================================"
              - "Device Name         : {{ managed_device.name }}"
              - "Serial              : {{ managed_device.sn }}"
              - "Management IP       : {{ managed_device.ip }}"
              - "Target ADOM         : {{ expected_adom }}"
              - "Policy Package      : {{ expected_policy_package }}"
              - "Installation Target : VERIFIED"
              - "Target VDOM field   : {{ installation_target_vdom }}"
              - "Policy installation : NOT PERFORMED"
              - "============================================================"

      # ======================================================
      # ALWAYS LOGOUT
      # ======================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "{{ fmg_jsonrpc_url }}"
            method: POST
            validate_certs: false
            return_content: true
            body_format: json
            timeout: "{{ api_timeout_seconds }}"
            status_code: 200
            body:
              id: 999
              method: exec
              params:
                - url: "/sys/logout"
              session: "{{ fmg_session }}"
              verbose: 1
          when: fmg_session is defined
          no_log: true

        - name: Display logout status
          ansible.builtin.debug:
            msg: "FortiManager API session closed."
          when: fmg_session is defined
