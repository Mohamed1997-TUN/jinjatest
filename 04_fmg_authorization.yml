---
- name: Step 3 - Authorize FortiGate in FortiManager
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:

    # ============================================================
    # FORTIMANAGER
    # ============================================================

    fmg_validate_certs: false


  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================
    #
    # Do NOT use:
    #
    #   vars_files:
    #     - vars/firewalls.vars
    #
    # because firewalls.vars contains vault_* variables for
    # multiple FortiGates.
    #
    # We load the YAML as raw data and select only the device
    # matching the NetBox asset_tag.
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action           : SKIPPED"
          - "=============================================="

      when:
        - selected_firewall | length == 0


    - name: End host for unknown firewall
      ansible.builtin.meta: end_host

      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE FIREWALL DATA
    # ============================================================

    - name: Validate selected firewall
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
          - selected_firewall.target_adom is defined
          - selected_firewall.target_vdom is defined
          - selected_firewall.policy_package is defined

        fail_msg: >-
          Firewall {{ asset_tag }}
          exists in firewalls.vars but one or more required fields
          are missing.

          Required:
          serial
          hostname
          management_ip
          target_adom
          target_vdom
          policy_package

        success_msg: >-
          Firewall {{ selected_firewall.serial }}
          contains all required automation parameters.


    # ============================================================
    # 5. SAVE DEVICE PARAMETERS
    # ============================================================

    - name: Save target FortiGate parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        device_name: "{{ selected_firewall.hostname }}"
        device_vdom: "{{ selected_firewall.target_vdom }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    # ============================================================
    # 6. NORMALIZE SERIAL FOR API COMPARISON
    # ============================================================
    #
    # NetBox:
    #
    #   FGVMEVP1E5VM0ED
    #
    # FortiManager:
    #
    #   FGVMEVP1_E5VM0ED
    #
    # Only the comparison value is normalized.
    # The original serial values are never modified.
    # ============================================================

    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    # ============================================================
    # 7. DISPLAY TARGET PARAMETERS
    # ============================================================

    - name: Display authorization target
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE AUTHORIZATION TARGET"
          - "=============================================="
          - "NetBox Asset Tag  : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Normalized Serial : {{ normalized_device_serial }}"
          - "Hostname          : {{ device_name }}"
          - "Management IP     : {{ selected_firewall.management_ip }}"
          - "Target ADOM       : {{ target_adom }}"
          - "Target VDOM       : {{ device_vdom }}"
          - "Policy Package    : {{ policy_package }}"
          - "=============================================="


    # ============================================================
    # 8. FORTIMANAGER WORKFLOW
    # ============================================================

    - name: Execute FortiManager authorization workflow
      block:

        # ========================================================
        # 8.1 LOGIN
        # ========================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 1
              method: "exec"

              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"

            return_content: true

          register: fmg_login
          no_log: true


        # ========================================================
        # 8.2 VERIFY LOGIN
        # ========================================================

        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined

            fail_msg: "FortiManager authentication failed."

            success_msg: "FortiManager authentication successful."


        # ========================================================
        # 8.3 SAVE SESSION
        # ========================================================

        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"

          no_log: true


        # ========================================================
        # 8.4 CHECK WHETHER DEVICE IS ALREADY AUTHORIZED
        # ========================================================
        #
        # This makes the workflow idempotent.
        #
        # If the device already exists in the destination ADOM,
        # we do not execute promote_unreg again.
        # ========================================================

        - name: Check target ADOM for existing FortiGate
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"

            return_content: true

          register: existing_target_devices
          no_log: true


        # ========================================================
        # 8.5 VERIFY TARGET ADOM QUERY
        # ========================================================

        - name: Verify target ADOM query
          ansible.builtin.assert:
            that:
              - existing_target_devices.json.result is defined
              - existing_target_devices.json.result | length > 0
              - existing_target_devices.json.result[0].status.code | int == 0

            fail_msg: >-
              FortiManager failed to query target ADOM
              {{ target_adom }}.

              Response:
              {{ existing_target_devices.json }}

            success_msg: >-
              Target ADOM {{ target_adom }}
              queried successfully.


        # ========================================================
        # 8.6 INITIALIZE AUTHORIZED DEVICE
        # ========================================================

        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        # ========================================================
        # 8.7 FIND EXISTING AUTHORIZED DEVICE
        # ========================================================

        - name: Find existing FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"

          loop: >-
            {{
              existing_target_devices.json.result[0].data
              | default([])
            }}

          when:
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.8 DISPLAY EXISTING AUTHORIZED DEVICE
        # ========================================================

        - name: Display existing authorized FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE ALREADY AUTHORIZED"
              - "=============================================="
              - "Device Name : {{ authorized_device.name }}"
              - "Serial      : {{ authorized_device.sn }}"
              - "ADOM        : {{ target_adom }}"
              - "Action      : SKIP AUTHORIZATION"
              - "=============================================="

          when:
            - authorized_device | length > 0


        # ========================================================
        # 8.9 GET GLOBAL DVM DATABASE
        # ========================================================
        #
        # We intentionally do NOT rely on mgmt_mode.
        #
        # In your environment FortiManager returned:
        #
        #   mgmt_mode: 0
        #
        # even though the GUI showed the device as Unauthorized.
        #
        # Therefore the serial number is the authoritative match.
        #
        # 12 retries x 5 seconds = up to 60 seconds.
        # ========================================================

        - name: Get FortiGates from global DVM database
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/device"

                  fields:
                    - "name"
                    - "sn"
                    - "oid"
                    - "mgmt_mode"
                    - "ip"
                    - "hostname"
                    - "platform_str"

                  loadsub: 0

            return_content: true

          register: all_devices

          no_log: true

          retries: 12
          delay: 5

          until:
            - all_devices.json.result is defined
            - all_devices.json.result | length > 0
            - all_devices.json.result[0].status.code | int == 0
            - >
              (
                all_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.10 INITIALIZE TARGET DEVICE
        # ========================================================

        - name: Initialize target device
          ansible.builtin.set_fact:
            target_device: {}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.11 FIND TARGET DEVICE BY NORMALIZED SERIAL
        # ========================================================

        - name: Find target FortiGate in DVM database
          ansible.builtin.set_fact:
            target_device: "{{ item }}"

          loop: >-
            {{
              all_devices.json.result[0].data
              | default([])
            }}

          when:
            - authorized_device | length == 0
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.12 VERIFY TARGET DEVICE
        # ========================================================

        - name: Verify target FortiGate exists
          ansible.builtin.assert:
            that:
              - target_device | length > 0

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in the FortiManager DVM database.

            success_msg: >-
              FortiGate {{ device_serial }}
              was found in the FortiManager DVM database.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.13 DISPLAY DISCOVERED DEVICE
        # ========================================================

        - name: Display discovered FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE READY FOR AUTHORIZATION"
              - "=============================================="
              - "FortiManager Name : {{ target_device.name }}"
              - "Serial            : {{ target_device.sn }}"
              - "IP                : {{ target_device.ip | default('n/a') }}"
              - "OID               : {{ target_device.oid }}"
              - "Management Mode   : {{ target_device.mgmt_mode | default('n/a') }}"
              - "Target ADOM       : {{ target_adom }}"
              - "Target VDOM       : {{ device_vdom }}"
              - "Policy Package    : {{ policy_package }}"
              - "=============================================="

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.14 AUTHORIZE DEVICE
        # ========================================================
        #
        # Important:
        # use target_device.name returned by FortiManager.
        #
        # Example:
        #
        #   dhia-staline
        #
        # not the serial number.
        # ========================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvm/cmd/add/device"

                  data:
                    adom: "{{ target_adom }}"

                    device:
                      name: "{{ target_device.name }}"
                      "device action": "promote_unreg"

                    flags:
                      - create_task
                      - nonblocking

            return_content: true

          register: authorize_result
          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.15 VERIFY AUTHORIZE REQUEST
        # ========================================================

        - name: Verify authorize request
          ansible.builtin.assert:
            that:
              - authorize_result.json.result is defined
              - authorize_result.json.result | length > 0
              - authorize_result.json.result[0].status.code | int == 0
              - authorize_result.json.result[0].data.taskid is defined

            fail_msg: >-
              FortiManager rejected the authorization request.

              Code:
              {{
                authorize_result.json.result[0].status.code
                | default('N/A')
              }}

              Message:
              {{
                authorize_result.json.result[0].status.message
                | default('N/A')
              }}

            success_msg: >-
              FortiManager accepted the authorization request.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.16 SAVE TASK ID
        # ========================================================

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorize_task_id: >-
              {{
                authorize_result.json.result[0].data.taskid
              }}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.17 DISPLAY TASK ID
        # ========================================================

        - name: Display authorization task ID
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIMANAGER AUTHORIZATION TASK"
              - "=============================================="
              - "Task ID : {{ authorize_task_id }}"
              - "=============================================="

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.18 POLL AUTHORIZATION TASK
        # ========================================================
        #
        # 30 retries x 5 seconds = up to 150 seconds.
        # ========================================================

        - name: Wait for FortiManager authorization task
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/task/task/{{ authorize_task_id }}"

            return_content: true

          register: authorize_task

          retries: 30
          delay: 5

          until:
            - authorize_task.json.result is defined
            - authorize_task.json.result | length > 0
            - authorize_task.json.result[0].data is defined
            - >
              (
                authorize_task.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100

          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.19 VERIFY AUTHORIZATION TASK
        # ========================================================

        - name: Verify authorization task completed
          ansible.builtin.assert:
            that:
              - authorize_task.json.result is defined
              - authorize_task.json.result | length > 0
              - >
                (
                  authorize_task.json.result[0].data.percent
                  | default(0)
                  | int
                ) >= 100
              - >
                (
                  authorize_task.json.result[0].data.num_err
                  | default(0)
                  | int
                ) == 0

            fail_msg: >-
              FortiManager authorization task failed.

            success_msg: >-
              FortiManager authorization task completed successfully.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.20 GET TARGET ADOM AFTER AUTHORIZATION
        # ========================================================
        #
        # 12 retries x 5 seconds = up to 60 seconds.
        # ========================================================

        - name: Get devices from target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"

            return_content: true

          register: target_devices

          retries: 12
          delay: 5

          until:
            - target_devices.json.result is defined
            - target_devices.json.result | length > 0
            - target_devices.json.result[0].status.code | int == 0
            - >
              (
                target_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.21 REFRESH AUTHORIZED DEVICE
        # ========================================================

        - name: Initialize final authorized device
          ansible.builtin.set_fact:
            authorized_device: {}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.22 FIND AUTHORIZED DEVICE
        # ========================================================

        - name: Find FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"

          loop: >-
            {{
              target_devices.json.result[0].data
              | default([])
            }}

          when:
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.23 VERIFY TARGET ADOM
        # ========================================================

        - name: Verify FortiGate is in target ADOM
          ansible.builtin.assert:
            that:
              - authorized_device | length > 0

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in ADOM {{ target_adom }}
              after authorization.

              The ADOM lookup was retried for up to 60 seconds.

            success_msg: >-
              FortiGate {{ device_serial }}
              is now present in ADOM {{ target_adom }}.


        # ========================================================
        # 8.24 DISPLAY AUTHORIZED DEVICE
        # ========================================================

        - name: Display authorized FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE AUTHORIZED"
              - "=============================================="
              - "Name   : {{ authorized_device.name }}"
              - "Serial : {{ authorized_device.sn }}"
              - "IP     : {{ authorized_device.ip | default('n/a') }}"
              - "OID    : {{ authorized_device.oid }}"
              - "ADOM   : {{ target_adom }}"
              - "=============================================="


        # ========================================================
        # 8.25 INITIALIZE VDOM OID
        # ========================================================

        - name: Initialize target VDOM OID
          ansible.builtin.set_fact:
            target_vdom_oid: null


        # ========================================================
        # 8.26 FIND TARGET VDOM OID
        # ========================================================

        - name: Find target VDOM OID
          ansible.builtin.set_fact:
            target_vdom_oid: "{{ item.oid }}"

          loop: "{{ authorized_device.vdom | default([]) }}"

          when:
            - item.name is defined
            - item.name == device_vdom
            - item.oid is defined


        # ========================================================
        # 8.27 VERIFY TARGET VDOM
        # ========================================================

        - name: Verify target VDOM exists
          ansible.builtin.assert:
            that:
              - target_vdom_oid is not none

            fail_msg: >-
              VDOM {{ device_vdom }}
              was not found on FortiGate {{ device_serial }}.

              The playbook will not guess a VDOM OID.

            success_msg: >-
              VDOM {{ device_vdom }}
              found with OID {{ target_vdom_oid }}.


        # ========================================================
        # 8.28 DISPLAY VDOM
        # ========================================================

        - name: Display VDOM information
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "TARGET VDOM"
              - "=============================================="
              - "VDOM     : {{ device_vdom }}"
              - "VDOM OID : {{ target_vdom_oid }}"
              - "=============================================="


        # ========================================================
        # 8.29 ASSIGN POLICY PACKAGE
        # ========================================================

        - name: Assign policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 7
              method: "set"
              session: "{{ fmg_session }}"

              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

                  data:
                    "scope member":

                      - name: "{{ authorized_device.name }}"
                        oid: "{{ authorized_device.oid | string }}"
                        vdom: "{{ device_vdom }}"
                        vdom_oid: "{{ target_vdom_oid }}"

            return_content: true

          register: policy_assignment
          no_log: true


        # ========================================================
        # 8.30 VERIFY POLICY PACKAGE
        # ========================================================

        - name: Verify policy package assignment
          ansible.builtin.assert:
            that:
              - policy_assignment.json.result is defined
              - policy_assignment.json.result | length > 0
              - policy_assignment.json.result[0].status.code | int == 0

            fail_msg: >-
              Policy package {{ policy_package }}
              assignment failed.

              Code:
              {{
                policy_assignment.json.result[0].status.code
                | default('N/A')
              }}

              Message:
              {{
                policy_assignment.json.result[0].status.message
                | default('N/A')
              }}

            success_msg: >-
              Policy package {{ policy_package }}
              assigned successfully.


        # ========================================================
        # 8.31 FINAL SUMMARY
        # ========================================================

        - name: Display final Step 3 summary
          ansible.builtin.debug:
            msg:
              - "=================================================="
              - "STEP 3 - FORTIGATE AUTHORIZATION"
              - "=================================================="
              - "NetBox Asset Tag : {{ asset_tag }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "Serial           : {{ authorized_device.sn }}"
              - "Target ADOM      : {{ target_adom }}"
              - "Target VDOM      : {{ device_vdom }}"
              - "VDOM OID         : {{ target_vdom_oid }}"
              - "Policy Package   : {{ policy_package }}"
              - "Authorization    : SUCCESS"
              - "Package Assign   : SUCCESS"
              - "=================================================="


      # ==========================================================
      # 9. ALWAYS LOGOUT FROM FORTIMANAGER
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 8
              method: "exec"
              session: "{{ fmg_session }}"

              params:
                - url: "/sys/logout"

            return_content: true

          no_log: true

          when:
            - fmg_session is defined
