---
- name: Step 3 - Authorize FortiGate in FortiManager and assign policy package
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action           : SKIPPED"
          - "=============================================="

      when:
        - selected_firewall | length == 0


    - name: End host for unknown firewall
      ansible.builtin.meta: end_host

      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE REQUIRED DATA
    # ============================================================

    - name: Validate selected firewall
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.hostname is defined
          - selected_firewall.management_ip is defined
          - selected_firewall.target_adom is defined
          - selected_firewall.target_vdom is defined
          - selected_firewall.policy_package is defined

        fail_msg: >-
          Firewall {{ asset_tag }}
          exists in firewalls.vars but one or more required fields
          are missing.

          Required:
          serial
          hostname
          management_ip
          target_adom
          target_vdom
          policy_package

        success_msg: >-
          Firewall {{ selected_firewall.serial }}
          contains all authorization parameters.


    # ============================================================
    # 5. SAVE TARGET PARAMETERS
    # ============================================================

    - name: Save target FortiGate parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        device_name: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    # ============================================================
    # 6. NORMALIZE SERIAL
    # ============================================================
    #
    # NetBox:
    #   FGVMEVP1E5VM0ED
    #
    # FortiManager:
    #   FGVMEVP1_E5VM0ED
    #
    # The normalization is used only for comparison.
    # ============================================================

    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    # ============================================================
    # 7. DISPLAY TARGET
    # ============================================================

    - name: Display authorization target
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FORTIGATE AUTHORIZATION TARGET"
          - "=============================================="
          - "NetBox Asset Tag  : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Normalized Serial : {{ normalized_device_serial }}"
          - "Hostname          : {{ device_name }}"
          - "Management IP     : {{ selected_firewall.management_ip }}"
          - "Target ADOM       : {{ target_adom }}"
          - "Target VDOM       : {{ target_vdom }}"
          - "Policy Package    : {{ policy_package }}"
          - "=============================================="


    # ============================================================
    # 8. FORTIMANAGER WORKFLOW
    # ============================================================

    - name: Execute FortiManager authorization workflow
      block:

        # ========================================================
        # 8.1 LOGIN
        # ========================================================

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 1
              method: "exec"

              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"

            return_content: true

          register: fmg_login
          no_log: true


        # ========================================================
        # 8.2 VERIFY LOGIN
        # ========================================================

        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined

            fail_msg: "FortiManager authentication failed."

            success_msg: "FortiManager authentication successful."


        # ========================================================
        # 8.3 SAVE SESSION
        # ========================================================

        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login.json.session }}"

          no_log: true


        # ========================================================
        # 8.4 CHECK IF ALREADY AUTHORIZED
        # ========================================================

        - name: Check target ADOM for existing FortiGate
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"

            return_content: true

          register: target_adom_devices
          no_log: true


        # ========================================================
        # 8.5 INITIALIZE AUTHORIZED DEVICE
        # ========================================================

        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        # ========================================================
        # 8.6 FIND DEVICE IN TARGET ADOM
        # ========================================================

        - name: Find existing FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"

          loop: >-
            {{
              target_adom_devices.json.result[0].data
              | default([])
            }}

          when:
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.7 DISPLAY ALREADY AUTHORIZED
        # ========================================================

        - name: Display already authorized FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE ALREADY AUTHORIZED"
              - "=============================================="
              - "Device Name : {{ authorized_device.name }}"
              - "Serial      : {{ authorized_device.sn }}"
              - "ADOM        : {{ target_adom }}"
              - "Action      : AUTHORIZATION SKIPPED"
              - "=============================================="

          when:
            - authorized_device | length > 0


        # ========================================================
        # 8.8 GET GLOBAL DVM DATABASE
        # ========================================================

        - name: Get FortiGates from global DVM database
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 3
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/device"

                  fields:
                    - "name"
                    - "sn"
                    - "oid"
                    - "mgmt_mode"
                    - "ip"
                    - "hostname"
                    - "platform_str"

                  loadsub: 0

            return_content: true

          register: all_devices
          no_log: true

          retries: 12
          delay: 5

          until:
            - all_devices.json.result is defined
            - all_devices.json.result | length > 0
            - all_devices.json.result[0].status.code | int == 0
            - >
              (
                all_devices.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.9 INITIALIZE TARGET DEVICE
        # ========================================================

        - name: Initialize target device
          ansible.builtin.set_fact:
            target_device: {}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.10 FIND TARGET DEVICE
        # ========================================================

        - name: Find target FortiGate in DVM database
          ansible.builtin.set_fact:
            target_device: "{{ item }}"

          loop: >-
            {{
              all_devices.json.result[0].data
              | default([])
            }}

          when:
            - authorized_device | length == 0
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.11 VERIFY TARGET DEVICE
        # ========================================================

        - name: Verify target FortiGate exists
          ansible.builtin.assert:
            that:
              - target_device | length > 0

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in the FortiManager DVM database.

            success_msg: >-
              FortiGate {{ device_serial }}
              was found in the FortiManager DVM database.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.12 DISPLAY DEVICE
        # ========================================================

        - name: Display discovered FortiGate
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "FORTIGATE READY FOR AUTHORIZATION"
              - "=============================================="
              - "FortiManager Name : {{ target_device.name }}"
              - "FortiManager Serial: {{ target_device.sn }}"
              - "IP                : {{ target_device.ip | default('n/a') }}"
              - "OID               : {{ target_device.oid }}"
              - "Target ADOM       : {{ target_adom }}"
              - "=============================================="

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.13 AUTHORIZE / PROMOTE DEVICE
        # ========================================================
        #
        # The device name is taken from FortiManager.
        # ========================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 4
              method: "exec"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvm/cmd/add/device"

                  data:
                    adom: "{{ target_adom }}"

                    device:
                      name: "{{ target_device.name }}"
                      "device action": "promote_unreg"

                    flags:
                      - create_task
                      - nonblocking

            return_content: true

          register: authorize_result
          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.14 VERIFY AUTHORIZATION REQUEST
        # ========================================================

        - name: Verify authorization request
          ansible.builtin.assert:
            that:
              - authorize_result.json.result is defined
              - authorize_result.json.result | length > 0
              - authorize_result.json.result[0].status.code | int == 0
              - authorize_result.json.result[0].data.taskid is defined

            fail_msg: >-
              FortiManager rejected the authorization request.

              Code:
              {{
                authorize_result.json.result[0].status.code
                | default('N/A')
              }}

              Message:
              {{
                authorize_result.json.result[0].status.message
                | default('N/A')
              }}

            success_msg: >-
              FortiManager accepted the authorization request.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.15 SAVE TASK ID
        # ========================================================

        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorize_task_id: >-
              {{
                authorize_result.json.result[0].data.taskid
              }}

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.16 DISPLAY TASK
        # ========================================================

        - name: Display authorization task ID
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "AUTHORIZATION TASK"
              - "=============================================="
              - "Task ID : {{ authorize_task_id }}"
              - "=============================================="

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.17 POLL AUTHORIZATION TASK
        # ========================================================

        - name: Wait for FortiManager authorization task
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/task/task/{{ authorize_task_id }}"

            return_content: true

          register: authorize_task

          retries: 30
          delay: 5

          until:
            - authorize_task.json.result is defined
            - authorize_task.json.result | length > 0
            - authorize_task.json.result[0].data is defined
            - >
              (
                authorize_task.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100

          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.18 VERIFY AUTHORIZATION TASK
        # ========================================================

        - name: Verify authorization task completed
          ansible.builtin.assert:
            that:
              - authorize_task.json.result is defined
              - authorize_task.json.result | length > 0
              - >
                (
                  authorize_task.json.result[0].data.percent
                  | default(0)
                  | int
                ) >= 100
              - >
                (
                  authorize_task.json.result[0].data.num_err
                  | default(0)
                  | int
                ) == 0

            fail_msg: >-
              FortiManager authorization task failed.

            success_msg: >-
              FortiManager authorization task completed successfully.

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.19 VERIFY DEVICE IN TARGET ADOM
        # ========================================================
        #
        # We simply verify that the device itself reached
        # the target ADOM.
        #
        # 12 retries x 5 seconds = up to 60 seconds.
        # ========================================================

        - name: Wait for FortiGate to appear in target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"

            return_content: true

          register: target_adom_devices_after_auth

          retries: 12
          delay: 5

          until:
            - target_adom_devices_after_auth.json.result is defined
            - target_adom_devices_after_auth.json.result | length > 0
            - target_adom_devices_after_auth.json.result[0].status.code | int == 0
            - >
              (
                target_adom_devices_after_auth.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          no_log: true

          when:
            - authorized_device | length == 0


        # ========================================================
        # 8.20 FIND FINAL DEVICE
        # ========================================================
        #
        # Only runs after a fresh authorization.
        #
        # If the device was already authorized, authorized_device
        # was already populated in 8.6 and 8.19 was skipped, so
        # target_adom_devices_after_auth does not exist.
        # (The old "Initialize final authorized device" task
        # wiped the device and broke re-runs, so it was removed.)
        # ========================================================

        - name: Find authorized FortiGate in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"

          loop: >-
            {{
              target_adom_devices_after_auth.json.result[0].data
              | default([])
            }}

          when:
            - authorized_device | length == 0
            - item.sn is defined
            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.21 VERIFY FINAL DEVICE
        # ========================================================

        - name: Verify FortiGate authorization
          ansible.builtin.assert:
            that:
              - authorized_device | length > 0

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in target ADOM {{ target_adom }}
              after authorization.

            success_msg: >-
              FortiGate {{ device_serial }}
              is successfully authorized in ADOM {{ target_adom }}.


        # ========================================================
        # 8.22 GET TARGET POLICY PACKAGE
        # ========================================================
        #
        # Reads the policy package (including its installation
        # targets, returned in "scope member").
        #
        # If the package sits inside a folder, set policy_package
        # in firewalls.vars as "folder/package".
        # ========================================================

        - name: Get target policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 7
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

            return_content: true

          register: policy_package_info
          no_log: true


        # ========================================================
        # 8.23 VERIFY POLICY PACKAGE EXISTS
        # ========================================================

        - name: Verify policy package exists in target ADOM
          ansible.builtin.assert:
            that:
              - policy_package_info.json.result is defined
              - policy_package_info.json.result | length > 0
              - policy_package_info.json.result[0].status.code | int == 0
              - policy_package_info.json.result[0].data.type | default('pkg') == 'pkg'

            fail_msg: >-
              Policy package {{ policy_package }} was not found
              (or is not a package) in ADOM {{ target_adom }}.
              Create it first or fix policy_package in firewalls.vars.

            success_msg: >-
              Policy package {{ policy_package }}
              exists in ADOM {{ target_adom }}.


        # ========================================================
        # 8.24 GET VDOMS OF THE FORTIGATE
        # ========================================================
        #
        # A policy package installation target is device + VDOM,
        # so the VDOM must already be known to FortiManager.
        # ========================================================

        - name: Get VDOMs of the authorized FortiGate
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 8
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device/{{ authorized_device.name }}/vdom"

            return_content: true

          register: device_vdoms
          no_log: true


        # ========================================================
        # 8.25 VERIFY VDOM EXISTS
        # ========================================================

        - name: Verify target VDOM exists on the FortiGate
          ansible.builtin.assert:
            that:
              - device_vdoms.json.result is defined
              - device_vdoms.json.result | length > 0
              - device_vdoms.json.result[0].status.code | int == 0
              - >
                target_vdom in (
                  device_vdoms.json.result[0].data
                  | default([], true)
                  | map(attribute='name')
                  | list
                )

            fail_msg: >-
              VDOM {{ target_vdom }} was not found on
              {{ authorized_device.name }} in FortiManager.
              The VDOM must exist (and be synced to FortiManager)
              before the device can be assigned to a policy package.

            success_msg: >-
              VDOM {{ target_vdom }} exists on
              {{ authorized_device.name }}.


        # ========================================================
        # 8.26 CHECK IF ALREADY ON THE POLICY PACKAGE
        # ========================================================

        - name: Check current installation targets of policy package
          ansible.builtin.set_fact:
            policy_package_assigned: >-
              {{
                (
                  policy_package_info.json.result[0].data['scope member']
                  | default([], true)
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) > 0
              }}


        # ========================================================
        # 8.27 DISPLAY ALREADY ASSIGNED
        # ========================================================

        - name: Display already assigned policy package
          ansible.builtin.debug:
            msg:
              - "=============================================="
              - "POLICY PACKAGE ALREADY ASSIGNED"
              - "=============================================="
              - "Device         : {{ authorized_device.name }}"
              - "VDOM           : {{ target_vdom }}"
              - "Policy Package : {{ policy_package }}"
              - "Action         : ASSIGNMENT SKIPPED"
              - "=============================================="

          when:
            - policy_package_assigned | bool


        # ========================================================
        # 8.28 ASSIGN DEVICE TO POLICY PACKAGE
        # ========================================================
        #
        # Adds device + VDOM to the package's installation
        # targets ("scope member").
        #
        # This only assigns the device. It does NOT install
        # (push) the policy package to the FortiGate.
        # ========================================================

        - name: Assign FortiGate to policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 9
              method: "add"
              session: "{{ fmg_session }}"

              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}/scope member"

                  data:
                    name: "{{ authorized_device.name }}"
                    vdom: "{{ target_vdom }}"

            return_content: true

          register: policy_assign_result
          no_log: true

          when:
            - not (policy_package_assigned | bool)


        # ========================================================
        # 8.29 VERIFY ASSIGNMENT REQUEST
        # ========================================================

        - name: Verify policy package assignment request
          ansible.builtin.assert:
            that:
              - policy_assign_result.json.result is defined
              - policy_assign_result.json.result | length > 0
              - policy_assign_result.json.result[0].status.code | int == 0

            fail_msg: >-
              FortiManager rejected the policy package assignment.

              Code:
              {{
                policy_assign_result.json.result[0].status.code
                | default('N/A')
              }}

              Message:
              {{
                policy_assign_result.json.result[0].status.message
                | default('N/A')
              }}

            success_msg: >-
              FortiManager accepted the policy package assignment.

          when:
            - not (policy_package_assigned | bool)


        # ========================================================
        # 8.30 VERIFY FINAL ASSIGNMENT
        # ========================================================

        - name: Get policy package after assignment
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 10
              method: "get"
              session: "{{ fmg_session }}"

              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"

            return_content: true

          register: policy_package_after
          no_log: true


        - name: Verify FortiGate is on the correct policy package
          ansible.builtin.assert:
            that:
              - policy_package_after.json.result is defined
              - policy_package_after.json.result | length > 0
              - policy_package_after.json.result[0].status.code | int == 0
              - >
                (
                  policy_package_after.json.result[0].data['scope member']
                  | default([], true)
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) > 0

            fail_msg: >-
              {{ authorized_device.name }} / {{ target_vdom }}
              is not listed in the installation targets of
              policy package {{ policy_package }}
              after assignment.

            success_msg: >-
              {{ authorized_device.name }} / {{ target_vdom }}
              is assigned to policy package {{ policy_package }}.


        # ========================================================
        # 8.31 DISPLAY FINAL RESULT
        # ========================================================

        - name: Display authorization result
          ansible.builtin.debug:
            msg:
              - "=================================================="
              - "STEP 03 - FORTIGATE AUTHORIZATION + POLICY PACKAGE"
              - "=================================================="
              - "NetBox Asset Tag : {{ asset_tag }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "Serial           : {{ authorized_device.sn }}"
              - "OID              : {{ authorized_device.oid }}"
              - "Target ADOM      : {{ target_adom }}"
              - "Authorization    : SUCCESS"
              - "VDOM (scope)     : {{ target_vdom }}"
              - "Policy Package   : {{ policy_package }}"
              - "Package Assign   : {{ 'ALREADY ASSIGNED' if (policy_package_assigned | bool) else 'ASSIGNED' }}"
              - "Package Install  : NOT PROCESSED IN STEP 03"
              - "=================================================="


      # ==========================================================
      # 9. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 11
              method: "exec"
              session: "{{ fmg_session }}"

              params:
                - url: "/sys/logout"

            return_content: true

          no_log: true

          when:
            - fmg_session is defined
