---
# ============================================================
# STEP 04 - FORTIGATE AUTHORIZATION + POLICY PACKAGE TARGET
# ============================================================
#
# Purpose:
#   1. Read the firewall definition selected by NetBox asset_tag.
#   2. Find the connected FortiGate in FortiManager root ADOM /
#      Unauthorized Devices.
#   3. Authorize it directly into the configured target ADOM.
#   4. Ensure the configured policy package contains the FortiGate
#      as an Installation Target.
#
# Source of truth:
#   vars/firewalls.vars
#
# Required per firewall:
#   serial
#   hostname
#   management_ip
#   target_adom
#   target_vdom
#   policy_package
#
# IMPORTANT:
#   target_adom = FortiManager ADOM
#   target_vdom = FortiGate VDOM
#
# ============================================================

- name: Step 04 - FortiGate Authorization and Package Target
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:
    fmg_validate_certs: false

    # Newly connected unauthorized FortiGates are displayed by
    # FortiManager under the root ADOM.
    source_adom: "root"

    authorization_poll_retries: 30
    authorization_poll_delay: 5

    target_verify_retries: 12
    target_verify_delay: 5

    api_timeout: 30

  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:
        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:
        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Skip firewall not present in firewall database
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action            : SKIPPED"
          - "============================================================"
      when:
        - selected_firewall | length == 0


    - name: End host for unknown firewall
      ansible.builtin.meta: end_host
      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE REQUIRED DATA
    # ============================================================

    - name: Validate selected firewall configuration
      ansible.builtin.assert:
        that:
          - selected_firewall.serial is defined
          - selected_firewall.serial | string | length > 0
          - selected_firewall.hostname is defined
          - selected_firewall.hostname | string | length > 0
          - selected_firewall.management_ip is defined
          - selected_firewall.management_ip | string | length > 0
          - selected_firewall.target_adom is defined
          - selected_firewall.target_adom | string | length > 0
          - selected_firewall.target_vdom is defined
          - selected_firewall.target_vdom | string | length > 0
          - selected_firewall.policy_package is defined
          - selected_firewall.policy_package | string | length > 0

        fail_msg: >-
          Firewall '{{ asset_tag }}' exists in firewalls.vars, but required
          authorization/package-target fields are missing.

          Required:
            serial
            hostname
            management_ip
            target_adom
            target_vdom
            policy_package

        success_msg: >-
          Firewall '{{ selected_firewall.serial }}' contains all required
          authorization and package-target parameters.


    # ============================================================
    # 5. SAVE TARGET PARAMETERS
    # ============================================================

    - name: Save target parameters
      ansible.builtin.set_fact:
        device_serial: "{{ selected_firewall.serial }}"
        desired_hostname: "{{ selected_firewall.hostname }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    # ============================================================
    # 6. NORMALIZE SERIAL
    # ============================================================

    - name: Normalize FortiGate serial for comparison
      ansible.builtin.set_fact:
        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    # ============================================================
    # 7. DISPLAY COMPLETE TARGET
    # ============================================================

    - name: Display selected provisioning target
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FORTIGATE PROVISIONING TARGET"
          - "============================================================"
          - "NetBox Asset Tag : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Normalized Serial : {{ normalized_device_serial }}"
          - "Expected Name     : {{ desired_hostname }}"
          - "Management IP     : {{ selected_firewall.management_ip }}"
          - "Source ADOM       : {{ source_adom }}"
          - "Target ADOM       : {{ target_adom }}"
          - "Target VDOM       : {{ target_vdom }}"
          - "Policy Package    : {{ policy_package }}"
          - "============================================================"


    # ============================================================
    # 8. FORTIMANAGER WORKFLOW
    # ============================================================

    - name: Execute FortiManager authorization and package workflow
      block:

        # --------------------------------------------------------
        # 8.1 LOGIN
        # --------------------------------------------------------

        - name: Login to FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 1
              method: "exec"
              params:
                - url: "/sys/login/user"
                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"
              session: null
              verbose: 1
            return_content: true
          register: fmg_login
          failed_when: false
          no_log: true


        # --------------------------------------------------------
        # 8.2 PARSE LOGIN RESPONSE
        # --------------------------------------------------------

        - name: Parse FortiManager login response
          ansible.builtin.set_fact:
            fmg_login_data: >-
              {{
                fmg_login.json
                if fmg_login.json is defined
                else (fmg_login.content | from_json)
              }}
          no_log: true


        # --------------------------------------------------------
        # 8.3 VERIFY LOGIN
        # --------------------------------------------------------

        - name: Verify FortiManager authentication
          ansible.builtin.assert:
            that:
              - fmg_login.status | int == 200
              - fmg_login_data.result is defined
              - fmg_login_data.result | length > 0
              - fmg_login_data.result[0].status.code | int == 0
              - fmg_login_data.session is defined
              - fmg_login_data.session | string | length > 0

            fail_msg: >-
              FortiManager authentication failed.

              HTTP status:
              {{ fmg_login.status | default('unknown') }}

              JSON-RPC code:
              {{
                fmg_login_data.result[0].status.code
                if fmg_login_data.result is defined
                and fmg_login_data.result | length > 0
                else 'not available'
              }}

              JSON-RPC message:
              {{
                fmg_login_data.result[0].status.message
                if fmg_login_data.result is defined
                and fmg_login_data.result | length > 0
                else fmg_login.msg | default('No JSON response')
              }}

            success_msg: "FortiManager authentication successful."


        # --------------------------------------------------------
        # 8.4 SAVE SESSION
        # --------------------------------------------------------

        - name: Save FortiManager session
          ansible.builtin.set_fact:
            fmg_session: "{{ fmg_login_data.session }}"
          no_log: true


        # ========================================================
        # 8.5 CHECK WHETHER DEVICE IS ALREADY AUTHORIZED
        # ========================================================
        #
        # This makes the workflow idempotent.
        # If the device is already in the destination ADOM, do not
        # attempt another promote/authorize operation.
        # ========================================================

        - name: Get devices from target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: target_adom_before_auth
          no_log: true


        - name: Verify target ADOM discovery
          ansible.builtin.assert:
            that:
              - target_adom_before_auth.status | int == 200
              - target_adom_before_auth.json.result is defined
              - target_adom_before_auth.json.result | length > 0
              - target_adom_before_auth.json.result[0].status.code | int == 0

            fail_msg: >-
              Unable to read target ADOM '{{ target_adom }}' from
              FortiManager before authorization.


        - name: Initialize authorized device
          ansible.builtin.set_fact:
            authorized_device: {}


        - name: Find device already present in target ADOM
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              target_adom_before_auth.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Set authorization state
          ansible.builtin.set_fact:
            authorization_needed: >-
              {{
                (authorized_device | length) == 0
              }}


        - name: Display authorization state
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "AUTHORIZATION STATE"
              - "============================================================"
              - "Target ADOM       : {{ target_adom }}"
              - "FortiGate serial  : {{ device_serial }}"
              - "Already authorized: {{ not authorization_needed }}"
              - >-
                Current device:
                {{
                  authorized_device.name
                  if not authorization_needed
                  else 'not present in target ADOM'
                }}
              - "============================================================"


        # ========================================================
        # 8.6 FIND DEVICE IN ROOT ADOM / UNAUTHORIZED DEVICES
        # ========================================================
        #
        # Only required when the device is not already authorized.
        #
        #
        # FortiManager displays newly trusted/unauthorized devices
        # under the root ADOM. We intentionally match by serial and
        # do not rely on the mgmt_mode value because this lab has
        # already shown that the API value may not mirror the GUI
        # label exactly.
        # ========================================================

        - name: Get devices from FortiManager root ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 2
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ source_adom }}/device"
                  loadsub: 0
            return_content: true
          register: root_devices_response
          no_log: true
          when:
            - authorization_needed


        - name: Verify root ADOM device discovery
          ansible.builtin.assert:
            that:
              - root_devices_response.status | int == 200
              - root_devices_response.json.result is defined
              - root_devices_response.json.result | length > 0
              - root_devices_response.json.result[0].status.code | int == 0

            fail_msg: >-
              FortiManager root ADOM device discovery failed.

              ADOM:
              {{ source_adom }}

              Code:
              {{
                root_devices_response.json.result[0].status.code
                | default('unknown')
              }}

              Message:
              {{
                root_devices_response.json.result[0].status.message
                | default('unknown')
              }}

          when:
            - authorization_needed


        - name: Save root ADOM devices
          ansible.builtin.set_fact:
            root_devices: >-
              {{
                root_devices_response.json.result[0].data
                | default([])
              }}
          when:
            - authorization_needed


        - name: Build normalized root ADOM serial matches
          ansible.builtin.set_fact:
            root_device_matches: >-
              {%- set ns = namespace(matches=[]) -%}
              {%- for device in root_devices -%}
                {%- if device.sn is defined -%}
                  {%- if (
                    device.sn
                    | regex_replace('[^A-Za-z0-9]', '')
                    | upper
                  ) == normalized_device_serial -%}
                    {%- set ns.matches = ns.matches + [device] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.matches }}
          when:
            - authorization_needed


        - name: Display root ADOM matching device
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "ROOT ADOM DEVICE MATCH"
              - "============================================================"
              - "Expected serial   : {{ device_serial }}"
              - "Normalized serial : {{ normalized_device_serial }}"
              - "Matches found     : {{ root_device_matches | length }}"
              - >-
                Matched device:
                {{
                  root_device_matches[0].name
                  if root_device_matches | length > 0
                  else 'NOT FOUND'
                }}
              - >-
                Matched serial:
                {{
                  root_device_matches[0].sn
                  if root_device_matches | length > 0
                  else 'NOT FOUND'
                }}
              - "============================================================"
          when:
            - authorization_needed


        - name: Verify unique root ADOM device match
          ansible.builtin.assert:
            that:
              - root_device_matches | length == 1

            fail_msg: >-
              Expected exactly one FortiGate with serial
              '{{ device_serial }}' in FortiManager root ADOM,
              but found {{ root_device_matches | length }}.

              The authorization workflow was stopped to avoid
              authorizing the wrong device.

          when:
            - authorization_needed


        - name: Save unauthorized FortiGate device object
          ansible.builtin.set_fact:
            unauthorized_device: "{{ root_device_matches[0] }}"
          when:
            - authorization_needed


        # ========================================================
        # 8.7 AUTHORIZE INTO TARGET ADOM
        # ========================================================

        - name: Authorize FortiGate into target ADOM
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 3
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvm/cmd/add/device"
                  data:
                    adom: "{{ target_adom }}"
                    device:
                      name: "{{ unauthorized_device.name }}"
                      "device action": "promote_unreg"
                    flags:
                      - create_task
                      - nonblocking
            return_content: true
          register: authorization_response
          no_log: true
          when:
            - authorization_needed


        - name: Verify authorization request accepted
          ansible.builtin.assert:
            that:
              - authorization_response.status | int == 200
              - authorization_response.json.result is defined
              - authorization_response.json.result | length > 0
              - authorization_response.json.result[0].status.code | int == 0
              - authorization_response.json.result[0].data.taskid is defined

            fail_msg: >-
              FortiManager rejected authorization of
              '{{ unauthorized_device.name }}' into ADOM
              '{{ target_adom }}'.

              Code:
              {{
                authorization_response.json.result[0].status.code
                | default('unknown')
              }}

              Message:
              {{
                authorization_response.json.result[0].status.message
                | default('unknown')
              }}


        - name: Save authorization task ID
          ansible.builtin.set_fact:
            authorization_task_id: >-
              {{
                authorization_response.json.result[0].data.taskid
              }}
          when:
            - authorization_needed


        - name: Display authorization task ID
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "AUTHORIZATION REQUEST ACCEPTED"
              - "============================================================"
              - "FortiGate : {{ unauthorized_device.name }}"
              - "Serial    : {{ unauthorized_device.sn }}"
              - "Target ADOM: {{ target_adom }}"
              - "Task ID   : {{ authorization_task_id }}"
              - "============================================================"
          when:
            - authorization_needed


        # ========================================================
        # 8.8 WAIT FOR AUTHORIZATION TASK
        # ========================================================

        - name: Wait for authorization task completion
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 4
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/task/task/{{ authorization_task_id }}"
            return_content: true
          register: authorization_task
          retries: "{{ authorization_poll_retries }}"
          delay: "{{ authorization_poll_delay }}"
          until:
            - authorization_task.json.result is defined
            - authorization_task.json.result | length > 0
            - authorization_task.json.result[0].status.code | int == 0
            - authorization_task.json.result[0].data is defined
            - >-
              (
                authorization_task.json.result[0].data.percent
                | default(0)
                | int
              ) >= 100
          no_log: true
          when:
            - authorization_needed


        - name: Verify authorization task result
          ansible.builtin.assert:
            that:
              - authorization_task.json.result[0].data.percent | int >= 100
              - authorization_task.json.result[0].data.num_err | default(0) | int == 0

            fail_msg: >-
              Authorization task failed.

              FortiGate:
              {{ unauthorized_device.name }}

              Task:
              {{ authorization_task_id }}

              Progress:
              {{
                authorization_task.json.result[0].data.percent
                | default(0)
              }}%

              Errors:
              {{
                authorization_task.json.result[0].data.num_err
                | default(0)
              }}

              Detail:
              {{
                authorization_task.json.result[0].data.detail
                | default('')
              }}

          when:
            - authorization_needed


        # ========================================================
        # 8.9 VERIFY DEVICE IN TARGET ADOM
        # ========================================================

        - name: Get target ADOM devices for final verification
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 5
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/dvmdb/adom/{{ target_adom }}/device"
                  loadsub: 0
            return_content: true
          register: final_target_adom_response
          retries: "{{ target_verify_retries }}"
          delay: "{{ target_verify_delay }}"
          until:
            - final_target_adom_response.json.result is defined
            - final_target_adom_response.json.result | length > 0
            - final_target_adom_response.json.result[0].status.code | int == 0
            - >-
              (
                final_target_adom_response.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) == 1
          no_log: true


        - name: Save final authorized FortiGate
          ansible.builtin.set_fact:
            authorized_device: "{{ item }}"
          loop: >-
            {{
              final_target_adom_response.json.result[0].data
              | default([])
            }}
          when:
            - item.sn is defined
            - >-
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        - name: Verify FortiGate authorization in target ADOM
          ansible.builtin.assert:
            that:
              - authorized_device is defined
              - authorized_device | length > 0
            fail_msg: >-
              FortiGate '{{ device_serial }}' is not present in
              target ADOM '{{ target_adom }}'.
            success_msg: >-
              FortiGate '{{ device_serial }}' is confirmed in
              target ADOM '{{ target_adom }}'.


        # ========================================================
        # 8.10 GET POLICY PACKAGE
        # ========================================================

        - name: Get configured policy package
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 6
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: policy_package_response


        - name: Verify policy package exists
          ansible.builtin.assert:
            that:
              - policy_package_response.status | int == 200
              - policy_package_response.json.result is defined
              - policy_package_response.json.result | length > 0
              - policy_package_response.json.result[0].status.code | int == 0
              - policy_package_response.json.result[0].data.name == policy_package

            fail_msg: >-
              Policy package '{{ policy_package }}' was not found
              in ADOM '{{ target_adom }}'.

              The authorization step does not create packages.
              Run the policy-package management step first.

            success_msg: >-
              Policy package '{{ policy_package }}' exists in
              ADOM '{{ target_adom }}'.


        - name: Save current policy package state
          ansible.builtin.set_fact:
            current_policy_package: >-
              {{
                policy_package_response.json.result[0].data
              }}


        # ========================================================
        # 8.10 CHECK INSTALLATION TARGET
        # ========================================================

        - name: Determine whether FortiGate is an Installation Target
          ansible.builtin.set_fact:
            installation_target_exists: >-
              {{
                (
                  current_policy_package['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('vdom', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) == 1
              }}


        - name: Display Installation Target state
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "POLICY PACKAGE INSTALLATION TARGET"
              - "============================================================"
              - "ADOM            : {{ target_adom }}"
              - "Policy Package  : {{ policy_package }}"
              - "FortiGate        : {{ authorized_device.name }}"
              - "VDOM            : {{ target_vdom }}"
              - "Target exists   : {{ installation_target_exists }}"
              - >-
                Current scope :
                {{
                  current_policy_package['scope member']
                  | default([])
                }}
              - "============================================================"


        # ========================================================
        # 8.11 ADD INSTALLATION TARGET WHEN MISSING
        # ========================================================

        - name: Add FortiGate to policy package Installation Targets
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 7
              method: "add"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}/scope member"
                  data:
                    name: "{{ authorized_device.name }}"
                    vdom: "{{ target_vdom }}"
            return_content: true
          register: installation_target_add
          when:
            - not installation_target_exists


        - name: Verify Installation Target add request
          ansible.builtin.assert:
            that:
              - installation_target_add.status | int == 200
              - installation_target_add.json.result is defined
              - installation_target_add.json.result | length > 0
              - installation_target_add.json.result[0].status.code | int == 0

            fail_msg: >-
              FortiManager rejected adding
              '{{ authorized_device.name }}/{{ target_vdom }}'
              to policy package '{{ policy_package }}'.

              Code:
              {{
                installation_target_add.json.result[0].status.code
                | default('unknown')
              }}

              Message:
              {{
                installation_target_add.json.result[0].status.message
                | default('unknown')
              }}

            success_msg: >-
              FortiGate '{{ authorized_device.name }}/{{ target_vdom }}'
              was added to policy package '{{ policy_package }}'.

          when:
            - not installation_target_exists


        # ========================================================
        # 8.12 RE-READ PACKAGE AND VERIFY TARGET
        # ========================================================

        - name: Re-read policy package after target update
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 8
              method: "get"
              session: "{{ fmg_session }}"
              params:
                - url: "/pm/pkg/adom/{{ target_adom }}/{{ policy_package }}"
            return_content: true
          register: policy_package_after_target
          retries: 10
          delay: 3
          until:
            - policy_package_after_target.json.result is defined
            - policy_package_after_target.json.result | length > 0
            - policy_package_after_target.json.result[0].status.code | int == 0
            - >-
              (
                policy_package_after_target.json.result[0].data['scope member']
                | default([])
                | selectattr('name', 'defined')
                | selectattr('vdom', 'defined')
                | selectattr('name', 'equalto', authorized_device.name)
                | selectattr('vdom', 'equalto', target_vdom)
                | list
                | length
              ) == 1


        - name: Verify Installation Target exists
          ansible.builtin.assert:
            that:
              - policy_package_after_target.json.result is defined
              - policy_package_after_target.json.result | length > 0
              - policy_package_after_target.json.result[0].status.code | int == 0
              - >-
                (
                  policy_package_after_target.json.result[0].data['scope member']
                  | default([])
                  | selectattr('name', 'defined')
                  | selectattr('vdom', 'defined')
                  | selectattr('name', 'equalto', authorized_device.name)
                  | selectattr('vdom', 'equalto', target_vdom)
                  | list
                  | length
                ) == 1

            fail_msg: >-
              Installation Target verification failed.

              FortiGate:
              {{ authorized_device.name }}

              VDOM:
              {{ target_vdom }}

              Policy package:
              {{ policy_package }}

              The package still does not contain the expected
              scope member.

            success_msg: >-
              Installation Target confirmed:
              '{{ authorized_device.name }}/{{ target_vdom }}'
              is assigned to '{{ policy_package }}'.


        # ========================================================
        # 8.13 FINAL SUMMARY
        # ========================================================

        - name: Display final authorization result
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "STEP 04 - COMPLETED"
              - "============================================================"
              - "NetBox Asset Tag  : {{ asset_tag }}"
              - "FortiGate         : {{ authorized_device.name }}"
              - "Serial            : {{ authorized_device.sn }}"
              - "Target ADOM       : {{ target_adom }}"
              - "Target VDOM       : {{ target_vdom }}"
              - "Policy Package    : {{ policy_package }}"
              - "Authorization     : SUCCESS"
              - "Installation Target: SUCCESS"
              - "============================================================"


      # ==========================================================
      # 9. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:
            url: "https://{{ fortimanager_host }}/jsonrpc"
            method: POST
            validate_certs: "{{ fmg_validate_certs }}"
            timeout: "{{ api_timeout }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              id: 99
              method: "exec"
              session: "{{ fmg_session }}"
              params:
                - url: "/sys/logout"
            return_content: true
          when:
            - fmg_session is defined
          failed_when: false
          no_log: true
