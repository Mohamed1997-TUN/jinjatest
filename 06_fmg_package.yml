---
- name: Step 5 - FortiManager Policy Package Management
  hosts: all
  connection: local
  gather_facts: false

  vars_files:
    - vars/fortimanager.vars

  vars:

    # ============================================================
    # FORTIMANAGER
    # ============================================================

    fmg_validate_certs: false

    # Retry parameters
    device_lookup_retries: 12
    device_lookup_delay: 5

    package_lookup_retries: 6
    package_lookup_delay: 3

    scope_lookup_retries: 6
    scope_lookup_delay: 3


  tasks:

    # ============================================================
    # 1. READ FIREWALL DATABASE
    # ============================================================
    #
    # We intentionally do not load firewalls.vars through vars_files.
    #
    # firewalls.vars contains vault_* references for multiple
    # FortiGates. Loading the whole file through vars_files can make
    # Ansible resolve unrelated secrets before selecting the device.
    #
    # We therefore read the YAML as raw data and select only the
    # firewall associated with NetBox asset_tag.
    # ============================================================

    - name: Read firewall database
      ansible.builtin.set_fact:

        firewall_data: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/vars/firewalls.vars'
            )
            | from_yaml
          }}


    # ============================================================
    # 2. SELECT FIREWALL USING NETBOX ASSET TAG
    # ============================================================

    - name: Select firewall using NetBox asset tag
      ansible.builtin.set_fact:

        selected_firewall: >-
          {{
            firewall_data.firewalls
            | selectattr(
                'serial',
                'equalto',
                asset_tag | default('')
              )
            | list
            | first
            | default({})
          }}


    # ============================================================
    # 3. SKIP UNKNOWN FIREWALL
    # ============================================================

    - name: Display firewall not present in database
      ansible.builtin.debug:

        msg:
          - "=============================================="
          - "FORTIGATE NOT IN FIREWALL DATABASE"
          - "=============================================="
          - "NetBox Asset Tag : {{ asset_tag | default('undefined') }}"
          - "Action           : SKIPPED"
          - "=============================================="

      when:
        - selected_firewall | length == 0


    - name: End host for unknown firewall
      ansible.builtin.meta: end_host

      when:
        - selected_firewall | length == 0


    # ============================================================
    # 4. VALIDATE REQUIRED POLICY PACKAGE DATA
    # ============================================================

    - name: Validate selected firewall policy package data
      ansible.builtin.assert:

        that:
          - selected_firewall.serial is defined
          - selected_firewall.target_adom is defined
          - selected_firewall.target_vdom is defined
          - selected_firewall.policy_package is defined
          - selected_firewall.target_adom | length > 0
          - selected_firewall.target_vdom | length > 0
          - selected_firewall.policy_package | length > 0

        fail_msg: >-
          FortiGate {{ asset_tag }}
          exists in firewalls.vars but required policy-package
          parameters are missing.

          Required:
          serial
          target_adom
          target_vdom
          policy_package

        success_msg: >-
          FortiGate {{ selected_firewall.serial }}
          contains all required policy-package parameters.


    # ============================================================
    # 5. SAVE TARGET PARAMETERS
    # ============================================================

    - name: Save target policy-package parameters
      ansible.builtin.set_fact:

        device_serial: "{{ selected_firewall.serial }}"
        target_adom: "{{ selected_firewall.target_adom }}"
        target_vdom: "{{ selected_firewall.target_vdom }}"
        policy_package: "{{ selected_firewall.policy_package }}"


    # ============================================================
    # 6. NORMALIZE SERIAL
    # ============================================================
    #
    # NetBox:
    #
    #   FGVMEVP1E5VM0ED
    #
    # FortiManager:
    #
    #   FGVMEVP1_E5VM0ED
    #
    # Only the comparison value is normalized.
    # ============================================================

    - name: Normalize FortiGate serial
      ansible.builtin.set_fact:

        normalized_device_serial: >-
          {{
            device_serial
            | regex_replace('[^A-Za-z0-9]', '')
            | upper
          }}


    # ============================================================
    # 7. DISPLAY TARGET
    # ============================================================

    - name: Display policy package target
      ansible.builtin.debug:

        msg:
          - "=============================================="
          - "POLICY PACKAGE TARGET"
          - "=============================================="
          - "NetBox Asset Tag  : {{ asset_tag }}"
          - "Serial            : {{ device_serial }}"
          - "Normalized Serial : {{ normalized_device_serial }}"
          - "Target ADOM       : {{ target_adom }}"
          - "Target VDOM       : {{ target_vdom }}"
          - "Policy Package    : {{ policy_package }}"
          - "=============================================="


    # ============================================================
    # 8. FORTIMANAGER WORKFLOW
    # ============================================================

    - name: Execute FortiManager policy-package workflow
      block:

        # ========================================================
        # 8.1 LOGIN
        # ========================================================

        - name: Login to FortiManager
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:
              id: 1
              method: "exec"

              params:
                - url: "/sys/login/user"

                  data:
                    user: "{{ fortimanager_user }}"
                    passwd: "{{ fortimanager_password }}"

            return_content: true

          register: fmg_login

          no_log: true


        # ========================================================
        # 8.2 VERIFY LOGIN
        # ========================================================

        - name: Verify FortiManager authentication
          ansible.builtin.assert:

            that:
              - fmg_login.json.result is defined
              - fmg_login.json.result | length > 0
              - fmg_login.json.result[0].status.code | int == 0
              - fmg_login.json.session is defined

            fail_msg: "FortiManager authentication failed."

            success_msg: "FortiManager authentication successful."


        # ========================================================
        # 8.3 SAVE SESSION
        # ========================================================

        - name: Save FortiManager session
          ansible.builtin.set_fact:

            fmg_session: "{{ fmg_login.json.session }}"

          no_log: true


        # ========================================================
        # 8.4 DISCOVER DEVICE IN TARGET ADOM
        # ========================================================
        #
        # The ADOM comes from firewalls.vars.
        #
        # The serial comparison is normalized.
        #
        # We retry because the previous authorization step may have
        # only recently placed the FortiGate into the ADOM.
        # ========================================================

        - name: Get FortiGate devices from target ADOM
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 2

              method: "get"

              session: "{{ fmg_session }}"

              params:

                - url: "/dvmdb/adom/{{ target_adom }}/device"

                  fields:
                    - "name"
                    - "sn"
                    - "oid"
                    - "ip"
                    - "hostname"
                    - "platform_str"

                  loadsub: 0

            return_content: true

          register: managed_devices_response

          retries: "{{ device_lookup_retries }}"
          delay: "{{ device_lookup_delay }}"

          until:

            - managed_devices_response.json.result is defined

            - managed_devices_response.json.result | length > 0

            - managed_devices_response.json.result[0].status.code | int == 0

            - >
              (
                managed_devices_response.json.result[0].data
                | default([])
                | map(attribute='sn')
                | select('defined')
                | map('regex_replace', '[^A-Za-z0-9]', '')
                | map('upper')
                | select('equalto', normalized_device_serial)
                | list
                | length
              ) > 0

          no_log: true


        # ========================================================
        # 8.5 INITIALIZE TARGET DEVICE
        # ========================================================

        - name: Initialize target device
          ansible.builtin.set_fact:

            target_device: {}


        # ========================================================
        # 8.6 FIND TARGET DEVICE BY NORMALIZED SERIAL
        # ========================================================

        - name: Find target FortiGate
          ansible.builtin.set_fact:

            target_device: "{{ item }}"

          loop: >-
            {{
              managed_devices_response.json.result[0].data
              | default([])
            }}

          when:

            - item.sn is defined

            - >
              (
                item.sn
                | regex_replace('[^A-Za-z0-9]', '')
                | upper
              ) == normalized_device_serial


        # ========================================================
        # 8.7 VERIFY TARGET DEVICE
        # ========================================================

        - name: Verify target FortiGate exists
          ansible.builtin.assert:

            that:
              - target_device | length > 0
              - target_device.name is defined
              - target_device.oid is defined

            fail_msg: >-
              FortiGate {{ device_serial }}
              was not found in ADOM {{ target_adom }}.

            success_msg: >-
              FortiGate {{ device_serial }}
              was found in ADOM {{ target_adom }}.


        # ========================================================
        # 8.8 DISPLAY TARGET DEVICE
        # ========================================================

        - name: Display target FortiGate
          ansible.builtin.debug:

            msg:
              - "=============================================="
              - "FORTIGATE POLICY TARGET"
              - "=============================================="
              - "FortiManager Name : {{ target_device.name }}"
              - "Serial            : {{ target_device.sn }}"
              - "OID               : {{ target_device.oid }}"
              - "IP                : {{ target_device.ip | default('n/a') }}"
              - "Target ADOM       : {{ target_adom }}"
              - "Target VDOM       : {{ target_vdom }}"
              - "Policy Package    : {{ policy_package }}"
              - "=============================================="


        # ========================================================
        # 8.9 GET POLICY PACKAGE LIST
        # ========================================================
        #
        # We inspect the ADOM package list and determine whether
        # the requested package already exists.
        # ========================================================

        - name: Get policy packages from FortiManager
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 3

              method: "get"

              session: "{{ fmg_session }}"

              params:

                - url: "/pm/pkg/adom/{{ target_adom }}"

            return_content: true

          register: package_list_response

          retries: "{{ package_lookup_retries }}"
          delay: "{{ package_lookup_delay }}"

          until:
            - package_list_response.json.result is defined
            - package_list_response.json.result | length > 0
            - package_list_response.json.result[0].status.code | int == 0

          no_log: true


        # ========================================================
        # 8.10 INITIALIZE PACKAGE
        # ========================================================

        - name: Initialize policy package
          ansible.builtin.set_fact:

            existing_package: {}


        # ========================================================
        # 8.11 FIND REQUESTED PACKAGE
        # ========================================================

        - name: Find requested policy package
          ansible.builtin.set_fact:

            existing_package: "{{ item }}"

          loop: >-
            {{
              package_list_response.json.result[0].data
              | default([])
            }}

          when:
            - item.name is defined
            - item.name == policy_package


        # ========================================================
        # 8.12 DISPLAY PACKAGE STATUS
        # ========================================================

        - name: Display policy package status
          ansible.builtin.debug:

            msg:
              - "=============================================="
              - "POLICY PACKAGE STATUS"
              - "=============================================="
              - "ADOM           : {{ target_adom }}"
              - "Package        : {{ policy_package }}"
              - "Status         : >-"
              - >-
                {{
                  'EXISTS - NO CREATION REQUIRED'
                  if existing_package | length > 0
                  else
                  'MISSING - WILL CREATE'
                }}
              - "=============================================="


        # ========================================================
        # 8.13 CREATE PACKAGE WHEN MISSING
        # ========================================================

        - name: Create missing policy package
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 4

              method: "add"

              session: "{{ fmg_session }}"

              params:

                - url: "/pm/pkg/adom/{{ target_adom }}"

                  data:

                    name: "{{ policy_package }}"

                    "package settings":

                      central-nat: "disable"
                      consolidated-firewall-mode: "disable"
                      fwpolicy-implicit-log: "disable"
                      fwpolicy6-implicit-log: "disable"
                      ngfw-mode: "profile-based"

                    type: "pkg"

            return_content: true

          register: package_creation_response

          no_log: true

          when:
            - existing_package | length == 0

          failed_when:
            - package_creation_response.json.result is not defined
              or package_creation_response.json.result | length == 0
              or package_creation_response.json.result[0].status.code | int not in [0, 2]


        # ========================================================
        # 8.14 VERIFY / WAIT FOR PACKAGE
        # ========================================================
        #
        # Whether the package already existed or was just created,
        # perform a fresh GET of the exact package.
        #
        # This gives us a single authoritative package object for
        # the scope operation.
        # ========================================================

        - name: Get requested policy package
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 5

              method: "get"

              session: "{{ fmg_session }}"

              params:

                - url: >-
                    /pm/pkg/adom/{{ target_adom }}/{{ policy_package }}

            return_content: true

          register: package_verify_response

          retries: 8
          delay: 3

          until:
            - package_verify_response.json.result is defined
            - package_verify_response.json.result | length > 0
            - package_verify_response.json.result[0].status.code | int == 0
            - package_verify_response.json.result[0].data is defined
            - package_verify_response.json.result[0].data.name == policy_package

          no_log: true


        # ========================================================
        # 8.15 SAVE PACKAGE DATA
        # ========================================================

        - name: Save policy package data
          ansible.builtin.set_fact:

            package_data: >-
              {{
                package_verify_response.json.result[0].data
              }}

            package_scope_members: >-
              {{
                package_verify_response.json.result[0].data.get(
                  'scope member',
                  []
                )
              }}


        # ========================================================
        # 8.16 VERIFY PACKAGE EXISTS
        # ========================================================

        - name: Verify policy package exists
          ansible.builtin.assert:

            that:
              - package_data.name is defined
              - package_data.name == policy_package

            fail_msg: >-
              Policy package '{{ policy_package }}'
              does not exist in ADOM {{ target_adom }}.

            success_msg: >-
              Policy package '{{ policy_package }}'
              exists in ADOM {{ target_adom }}.


        # ========================================================
        # 8.17 DISPLAY CURRENT SCOPE
        # ========================================================

        - name: Display current policy package scope
          ansible.builtin.debug:

            msg:
              - "=============================================="
              - "CURRENT POLICY PACKAGE SCOPE"
              - "=============================================="
              - "Package : {{ policy_package }}"
              - "Device  : {{ target_device.name }}"
              - "VDOM    : {{ target_vdom }}"
              - "Scope   : {{ package_scope_members }}"
              - "=============================================="


        # ========================================================
        # 8.18 DETERMINE WHETHER SCOPE ADD IS REQUIRED
        # ========================================================

        - name: Determine package scope synchronization state
          ansible.builtin.set_fact:

            scope_add_required: >-
              {{
                (
                  package_scope_members
                  | selectattr('name', 'defined')
                  | selectattr(
                      'name',
                      'equalto',
                      target_device.name
                    )
                  | selectattr('vdom', 'defined')
                  | selectattr(
                      'vdom',
                      'equalto',
                      target_vdom
                    )
                  | list
                  | length
                ) == 0
              }}


        # ========================================================
        # 8.19 DISPLAY SCOPE DECISION
        # ========================================================

        - name: Display package scope decision
          ansible.builtin.debug:

            msg:
              - "=============================================="
              - "POLICY PACKAGE SCOPE DECISION"
              - "=============================================="
              - "Package       : {{ policy_package }}"
              - "Device        : {{ target_device.name }}"
              - "VDOM          : {{ target_vdom }}"
              - "Add Required  : {{ scope_add_required }}"
              - "=============================================="


        # ========================================================
        # 8.20 ADD DEVICE TO PACKAGE SCOPE
        # ========================================================
        #
        # FortiManager API:
        #
        # /pm/pkg/adom/<adom>/<package>/scope member
        #
        # We use ADD rather than SET so that existing installation
        # targets are not overwritten.
        # ========================================================

        - name: Add FortiGate to policy package scope
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 6

              method: "add"

              session: "{{ fmg_session }}"

              params:

                - url: >-
                    /pm/pkg/adom/{{ target_adom }}/{{ policy_package }}/scope member

                  data:

                    name: "{{ target_device.name }}"

                    vdom: "{{ target_vdom }}"

            return_content: true

          register: scope_add_response

          no_log: true

          retries: 3
          delay: 3

          until:
            - scope_add_response.json.result is defined
            - scope_add_response.json.result | length > 0
            - scope_add_response.json.result[0].status.code | int in [0, 2]

          when:
            - scope_add_required | bool


        # ========================================================
        # 8.21 DISPLAY SCOPE ADD RESULT
        # ========================================================

        - name: Display scope synchronization result
          ansible.builtin.debug:

            msg:
              - "=============================================="
              - "POLICY PACKAGE SCOPE RESULT"
              - "=============================================="
              - "Package : {{ policy_package }}"
              - "Device  : {{ target_device.name }}"
              - "VDOM    : {{ target_vdom }}"
              - >-
                {{
                  'ADDED TO SCOPE'
                  if scope_add_required | bool
                  else
                  'ALREADY IN SCOPE'
                }}
              - "=============================================="


        # ========================================================
        # 8.22 RE-READ PACKAGE FOR FINAL VERIFICATION
        # ========================================================
        #
        # We do not trust the ADD response alone.
        # We verify the resulting package object.
        # ========================================================

        - name: Read final policy package state
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 7

              method: "get"

              session: "{{ fmg_session }}"

              params:

                - url: >-
                    /pm/pkg/adom/{{ target_adom }}/{{ policy_package }}

            return_content: true

          register: final_package_response

          retries: "{{ scope_lookup_retries }}"
          delay: "{{ scope_lookup_delay }}"

          until:
            - final_package_response.json.result is defined
            - final_package_response.json.result | length > 0
            - final_package_response.json.result[0].status.code | int == 0
            - final_package_response.json.result[0].data is defined

          no_log: true


        # ========================================================
        # 8.23 SAVE FINAL PACKAGE SCOPE
        # ========================================================

        - name: Save final package scope
          ansible.builtin.set_fact:

            final_package_data: >-
              {{
                final_package_response.json.result[0].data
              }}

            final_scope_members: >-
              {{
                final_package_response.json.result[0].data.get(
                  'scope member',
                  []
                )
              }}


        # ========================================================
        # 8.24 VERIFY FINAL PACKAGE
        # ========================================================

        - name: Verify final policy package state
          ansible.builtin.assert:

            that:

              - final_package_data.name == policy_package

              - >
                (
                  final_scope_members
                  | selectattr('name', 'defined')
                  | selectattr(
                      'name',
                      'equalto',
                      target_device.name
                    )
                  | selectattr('vdom', 'defined')
                  | selectattr(
                      'vdom',
                      'equalto',
                      target_vdom
                    )
                  | list
                  | length
                ) > 0

            fail_msg: >-
              Final verification failed.

              Package:
              {{ policy_package }}

              Expected installation target:
              {{ target_device.name }}/{{ target_vdom }}

              Final scope:
              {{ final_scope_members }}

            success_msg: >-
              Policy package '{{ policy_package }}'
              is correctly assigned to
              '{{ target_device.name }}/{{ target_vdom }}'.


        # ========================================================
        # 8.25 FINAL SUMMARY
        # ========================================================

        - name: Display Step 05 summary
          ansible.builtin.debug:

            msg:

              - "======================================================"
              - "STEP 05 - POLICY PACKAGE MANAGEMENT"
              - "======================================================"

              - "NetBox Asset Tag : {{ asset_tag }}"

              - "FortiGate        : {{ target_device.name }}"

              - "Serial           : {{ target_device.sn }}"

              - "Target ADOM      : {{ target_adom }}"

              - "Target VDOM      : {{ target_vdom }}"

              - "Policy Package   : {{ policy_package }}"

              - >-
                {{
                  'PACKAGE CREATED'
                  if existing_package | length == 0
                  else
                  'PACKAGE ALREADY EXISTS'
                }}

              - >-
                {{
                  'DEVICE ADDED TO SCOPE'
                  if scope_add_required | bool
                  else
                  'DEVICE ALREADY IN SCOPE'
                }}

              - "Final Verification : SUCCESS"

              - "======================================================"


      # ==========================================================
      # 9. ALWAYS LOGOUT
      # ==========================================================

      always:

        - name: Logout from FortiManager
          ansible.builtin.uri:

            url: "https://{{ fortimanager_host }}/jsonrpc"

            method: POST

            validate_certs: "{{ fmg_validate_certs }}"

            headers:
              Content-Type: application/json

            body_format: json

            body:

              id: 99

              method: "exec"

              session: "{{ fmg_session }}"

              params:

                - url: "/sys/logout"

            return_content: true

          no_log: true

          when:
            - fmg_session is defined
